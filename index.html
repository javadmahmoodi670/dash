<script>(function(){
var API='https://kpi.appleeiran.ir/api';try{var o=localStorage.getItem('hj-api');if(o)API=String(o).replace(/\/+$/,'')}catch(_){}
var $=function(i){return document.getElementById(i)},E=$('e'),B=$('b');
function dg(s){return String(s).trim().replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
var EO='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
$('eye').innerHTML=EO;$('eye').onclick=function(){var k=$('k');k.type=k.type==='password'?'text':'password';k.focus()};
function ls(k,v){try{if(v==null)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(_){}}
// خطای شبکه را دقیق نشان می‌دهد
function net(){return 'اتصال به سرور برقرار نشد. اینترنت را بررسی کنید و دوباره امتحان کنید.'}
async function api(m,p,b,t){var r;try{r=await fetch(API+p,{method:m,headers:Object.assign({'X-Auth-Token':t||''},b?{'Content-Type':'application/json'}:{}),body:b?JSON.stringify(b):undefined,cache:'no-store'})}catch(_){var e=new Error(net());e.net=1;throw e}
 return r}
async function jerr(r){var j={};try{j=await r.clone().json()}catch(_){}var e=new Error(j.message||('خطای سرور ('+r.status+')'));e.status=r.status;e.code=j.error;return e}
// ورود موفق: کد برنامه از سرور گرفته و جایگزین این صفحه می‌شود
async function boot(tok,role){
 var r=await api('GET','/app',null,tok);if(!r.ok)throw await jerr(r);
 var html=await r.text();if(role==='manager')window.__ADM=1;
 document.open();document.write(html);document.close()}
(async function auto(){
 var m;try{m=sessionStorage.getItem('hj-msg');sessionStorage.removeItem('hj-msg')}catch(_){}
 if(m){E.textContent=m}
 var t=ls('hj-api-tok'),role=ls('hj-api-role');
 if(!t){$('c').focus();return}
 B.disabled=true;B.textContent='در حال بررسی…';
 try{await boot(t,role)}catch(x){B.disabled=false;B.textContent='ورود';
  if(x.status===401){['hj-api-tok','hj-api-role','hj-api-name'].forEach(function(k){try{localStorage.removeItem(k)}catch(_){}});E.textContent=x.message}else E.textContent=x.message;$('c').focus()}})();
$('f').onsubmit=async function(ev){ev.preventDefault();E.textContent='';
 var code=dg($('c').value),pw=$('k').value;if(!code||!pw){E.textContent='کد پرسنلی و رمز را وارد کنید.';return}
