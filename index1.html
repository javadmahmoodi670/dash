    </nav>
<!-- دکمهٔ تغییر تم تیره/روشن (با data-theme-toggle)؛ نسخهٔ دیگری از آن در سربرگ برای موبایل وجود دارد -->
    <button type="button" class="mi thm" data-theme-toggle aria-label="تغییر حالت تیره و روشن"><span class="ti"></span><span class="tl"></span></button>
<!-- فاصله‌انداز که بخش بارگذاری را به پایین سایدبار می‌راند -->
    <div class="sp"></div>
<!-- بارگذاری گزارش اکسل (xlsm/xlsx): دکمه، ذخیره، ورودی فایل مخفی و پیام وضعیت -->
    <div class="upl">
<!-- ردیف ۱: دکمه‌ی بارگذاری اکسل (تمام‌عرض) -->
      <div class="urow">
        <button type="button" class="ubtn" id="upBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span>بارگزاری گزارش فروش</span></button>
      </div>
<!-- ردیف ۲ (پس از ورود مدیر): ذخیره و انتشار هم‌اندازه کنار هم، و ⚙ برای تنظیم انتشار (Shift+کلیک روی «انتشار» هم همین را باز می‌کند) -->
      <div class="urow" id="pubRow" hidden>
        <button type="button" class="ubtn save" id="saveBtn" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg><span>ذخیره</span></button>
        <button type="button" class="ubtn pub" id="pubBtn" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span>انتشار</span></button>
        <button type="button" class="ubtn save" id="pubSet" title="تنظیم انتشار (مخزن، مسیر، توکن)" aria-label="تنظیم انتشار">⚙</button>
      </div>
<!-- ردیف ارسال به سرور: زیر «ذخیره/انتشار» و هم‌زمان با آن‌ها نمایان می‌شود (کنترل در 85_server.js) -->
      <div class="urow" id="srvRow" hidden>
        <button type="button" class="ubtn pub" id="srvBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18a4 4 0 010-8 6 6 0 0111.5-1.5A4.5 4.5 0 0117 18H5z"/><path d="M12 12v6M9.5 14.5L12 12l2.5 2.5"/></svg>ارسال به سرور</button>
      </div>
      <input type="file" id="file" accept=".xlsm,.xlsx" hidden>
<!-- انتخاب نمای داده (مدیریت یا عمومی) و رمز آن؛ فقط پس از ورود مدیر نمایش داده می‌شود (hidden) -->
      <div class="vas" id="vas" hidden>
        <div class="vseg" role="group" aria-label="نمای داده"><button type="button" data-vas="real" class="on">نمای مدیریت</button><button type="button" data-vas="team">نمای تیم فروش</button></div>
        <label for="realPw">رمز نمای مدیریت</label><span class="pw"><input id="realPw" type="password" value="14051405" autocomplete="off" spellcheck="false" dir="ltr"><button type="button" class="eye" data-eye aria-label="نمایش یا پنهان‌کردن رمز" title="نمایش/پنهان‌کردن رمز"></button></span>
      </div>
      <span id="umsg" role="status"></span>
    </div>
<!-- تاریخ آخرین به‌روزرسانی داده‌ها (توسط جاوااسکریپت پر می‌شود) -->
    <div class="asof" id="asof"></div>
<!-- نسخه‌ی برنامه (شماره + زمان ساخت)؛ برای اطمینان از اینکه آخرین فایل منتشرشده همین نسخه است -->
    <div class="ver" id="appVer">نسخه برنامه: v1.8.0<br>ساخت 2026-11-17 11:10</div>
  </aside>
<!-- پردهٔ پشت منوهای کشویی در موبایل؛ با کلیک روی آن منو بسته می‌شود -->
  <div class="scrim" id="scrim"></div>

<!-- بخش اصلی: سربرگ، فیلترها، کارت‌های آمار و محتوای تب فعال -->
  <section class="main">
<!-- سربرگ: دکمهٔ منو و خلاصه (فقط موبایل)، عنوان صفحه و دکمهٔ تم -->
    <header class="top">
      <button type="button" class="tbtn" id="menuBtn" aria-label="باز کردن منو"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>منو</span></button>
      <div class="ttl"><h1 id="mTitle">داشبورد فروش</h1><p id="mastSub"></p></div>
      <button type="button" class="tbtn thm-h" data-theme-toggle aria-label="تغییر حالت تیره و روشن"><span class="ti"></span></button>
      <button type="button" class="tbtn" id="sumBtn" aria-label="باز کردن خلاصه"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16M7 9h4M7 13h4"/></svg><span>خلاصه</span></button>
    </header>
<!-- فیلترها: انتخاب شعبه و ویزیتور، پاک‌کردن فیلترها و چیپ‌های محصول (توسط JS ساخته می‌شوند) -->
    <div class="filters">
      <div class="frow">
        <div class="sel"><label for="selBranch">شعبه</label><select id="selBranch"></select></div>
        <div class="sel"><label for="selVisitor">ویزیتور</label><select id="selVisitor"></select></div>
        <button class="reset" id="reset" type="button">پاک‌کردن فیلترها</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="محصول"></div>
    </div>
<!-- کارت‌های آمار کلیدی (KPI)؛ محتوا با جاوااسکریپت رندر می‌شود -->
    <div class="stats" id="stats"></div>
<!-- محل رندر تب فعال (نمودارها و جدول‌ها)؛ استایل inline: گرید با فاصلهٔ ۱۸ و min-width:0 برای جلوگیری از سرریز -->
    <div id="view" style="display:grid;gap:18px;min-width:0"></div>
  </section>

<!-- پنل خلاصه (ستون چپ در RTL؛ در موبایل کشو) -->
  <aside class="summary" id="summary" aria-label="خلاصه"></aside>
</div>
<!-- پنجرهٔ مودال ورود مدیر برای بارگذاری گزارش جدید؛ تا زمان نیاز hidden است -->
<div class="modal" id="modal" hidden>
  <form class="box" id="loginForm" autocomplete="off">
    <h3>ورود مدیر</h3>
    <p>برای بارگذاری گزارش جدید، نام کاربری و رمز عبور را وارد کنید.</p>
    <label for="uName">نام کاربری</label><input id="uName" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="uPass">رمز عبور</label><span class="pw"><input id="uPass" type="password" autocomplete="off"><button type="button" class="eye" data-eye aria-label="نمایش یا پنهان‌کردن رمز" title="نمایش/پنهان‌کردن رمز"></button></span>
    <div class="err" id="loginErr" role="alert"></div>
    <div class="row"><button class="go" type="submit">ورود</button><button class="no" type="button" id="cancel">انصراف</button></div>
  </form>
</div>
<!-- عنصر tooltip سراسری؛ با ماوس (hover) یا نگه‌داشتن انگشت (long-press) توسط JS موقعیت‌دهی و نمایش داده می‌شود -->
<div id="tip" hidden></div>

<script>
// =====================================================================
// فایل ۱۰: ابزارهای عمومی و خواندن گزارش اکسل (utils + parser)
// نقش این فایل:
//  ۱) ابزارهای نمایشی: قالب‌بندی اعداد فارسی، میان‌بر $ و state برنامه (st).
//  ۲) setData و paintHeader: قرار دادن داده‌ی گزارش در متغیرهای سراسری و رسم عنوان صفحه.
//  ۳) خواننده‌ی کامل xlsx درون خود مرورگر و بدون کتابخانه‌ی بیرونی:
//     readZip (خواندن ZIP و باز کردن deflate) ← parseReport (نگاشت شیت‌ها به شیء داده) ← parseComm (شیت‌های پورسانت).
// چرا بدون کتابخانه؟ تا فایل نهایی تک‌فایل و آفلاین بماند و اطلاعات فروش هرگز از مرورگر کاربر خارج نشود.
// =====================================================================
const nf0=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:1});
const n=x=> (Math.abs(x)<100 && Math.abs(x%1)>1e-9) ? nf1.format(x) : nf0.format(Math.round(x));
const pc=x=> nf0.format(Math.floor(x*100+1e-9))+'٪';
const $=s=>document.querySelector(s);

// state سراسری رابط: نما (تب) فعال و فیلترهای شعبه/ویزیتور/محصول و لیست ویزیتورهای مقایسه (cmp).
const st={view:'overview',branch:'all',visitor:'all',product:'all',cmp:[],comp:'all'};
// نام تب‌های ممکن برنامه؛ ترتیب آن‌ها همان ترتیب نوار تب‌هاست.
const VIEWS=['overview','compare','target','commission','cov','nc','price','track','staff'];
// SNAPSHOT: داده‌ی جاسازی‌شده در همین فایل (در نسخه‌ی مشاهده‌گر، همان داده‌ی «تیم» است). به‌صورت JSON درون تگ reportData ذخیره می‌شود.
const SNAPSHOT=JSON.parse(document.getElementById("reportData").textContent);
// REALD: داده‌ی واقعی مدیریت (فقط در حافظه). D داده‌ی در حال نمایش است که می‌تواند واقعی یا نسخه‌ی تیم باشد؛ بقیه مشتق‌های D هستند.
let REALD=null,D,E,T,R,PACE,PRODUCTS=[],BRANCHES=[],rows=[],visitors=[];
const faY=new Intl.NumberFormat('fa-IR',{useGrouping:false});
// setData: داده‌ی گزارش را در متغیرهای سراسری می‌گذارد و فهرست‌های مشتق (شعب، محصولات، ویزیتورها) را می‌سازد.
// فیلترهای قبلی که در داده‌ی جدید وجود ندارند به «همه» برمی‌گردند؛ و اگر مقایسه کمتر از دو نفر شد، سه ویزیتور برتر (میانگین درصد تحقق) انتخاب می‌شوند.
// PACE = نسبت روزهای سپری‌شده به کل ماه؛ معیار «خط برنامه» برای رنگ‌بندی وضعیت.
function setData(d){
  D=d;E=d.elapsed;T=d.total;R=d.remaining;PACE=E/T;
  BRANCHES=d.branches.map(x=>x.name);rows=[];d.branches.forEach(x=>x.rows.forEach(r=>rows.push(Object.assign({branch:x.name},r))));
  PRODUCTS=[];rows.forEach(r=>{if(!PRODUCTS.includes(r.product))PRODUCTS.push(r.product)});
  visitors=[];rows.forEach(r=>{if(!visitors.find(v=>v.code===r.code))visitors.push({code:r.code,name:r.visitor,branch:r.branch})});
  if(st.branch!=='all'&&!BRANCHES.includes(st.branch))st.branch='all';
  if(st.visitor!=='all'&&!visitors.some(v=>v.code===st.visitor))st.visitor='all';
  if(st.product!=='all'&&!PRODUCTS.includes(st.product))st.product='all';
  st.cmp=st.cmp.filter(c=>visitors.some(v=>v.code===c));
  if(st.cmp.length<2)st.cmp=visitors.map(v=>({c:v.code,p:meanPct(rows.filter(r=>r.code===v.code))})).sort((a,b)=>b.p-a.p).slice(0,3).map(x=>x.c);
}
// paintHeader: عنوان (ماه و سال)، تعداد شعب/ویزیتور/محصول و زمان آخرین بروزرسانی را در سربرگ می‌نویسد.
function paintHeader(){
  $('#mTitle').textContent='داشبورد فروش '+(D.month||'')+(D.year?' '+faY.format(D.year):'');
  $('#mastSub').innerHTML=[nf0.format(BRANCHES.length)+' شعبه',nf0.format(visitors.length)+' ویزیتور',nf0.format(PRODUCTS.length)+' محصول'].map(x=>'<span>'+x+'</span>').join('');
  $('#asof').textContent=D.asof?'آخرین بروزرسانی: '+D.asof:'';
}

/* ---------- reading the Excel report (no external libraries) ---------- */
// WANTED: شیت‌های الزامی فایل اکسل (چهار شعبه). نبودن هرکدام یعنی فایل نامعتبر است و خطا داده می‌شود.
const WANTED=['بابل','آمل','گردشگری','بابلسر'];
// normFa: نرمال‌سازی متن فارسی. «ي» عربی و «ك» عربی به «ی» و «ک» فارسی تبدیل می‌شوند و نیم‌فاصله به فاصله.
// چرا؟ فایل‌های اکسل اغلب با کیبورد عربی تایپ شده‌اند و بدون یکسان‌سازی، مقایسه‌ی نام شیت/ستون با رشته‌های برنامه شکست می‌خورد.
// مقدار null یا شیء (مثل خطای سلول) به رشته‌ی خالی تبدیل می‌شود.
const normFa=s=>(s==null||typeof s==='object')?'':String(s).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').trim();
// readZip: خواندن ساختار فایل ZIP (xlsx در اصل یک ZIP است) با DataView، بدون کتابخانه.
// روش کار: ۱) از انتهای فایل به عقب دنبال امضای «پایان دایرکتوری مرکزی» (0x06054b50) می‌گردیم؛
// ۲) تعداد ورودی‌ها و آدرس دایرکتوری مرکزی را می‌خوانیم؛ ۳) برای هر ورودی (0x02014b50) نام، روش فشرده‌سازی، اندازه و آدرس هدر محلی را ثبت می‌کنیم.
// محتوای هر فایل فقط هنگام درخواست (get) باز می‌شود تا حافظه و زمان هدر نرود.
async function readZip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let p=u8.length-22;while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;
  if(p<0)throw new Error('این فایل، یک فایل اکسل معتبر نیست.');
  const cnt=dv.getUint16(p+10,true);let o=dv.getUint32(p+16,true);const files={};const dec=new TextDecoder();
  for(let i=0;i<cnt;i++){
    if(dv.getUint32(o,true)!==0x02014b50)break;
    const nl=dv.getUint16(o+28,true),el=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true);
    files[dec.decode(u8.subarray(o+46,o+46+nl))]={method:dv.getUint16(o+10,true),csize:dv.getUint32(o+20,true),lho:dv.getUint32(o+42,true)};
    o+=46+nl+el+cl;
  }
  // get(name): محتوای یک فایل داخل ZIP را به‌صورت متن برمی‌گرداند. داده‌ی واقعی بعد از هدر محلی (۳۰ بایت + طول نام + طول extra) شروع می‌شود.
  // روش ۰ = ذخیره‌شده بدون فشرده‌سازی؛ روش ۸ = deflate که با DecompressionStream('deflate-raw') مرورگر باز می‌شود (بدون zlib).
  // روش‌های دیگر یا مرورگر قدیمی با پیام فارسی رد می‌شوند.
  return{async get(name){
    const f=files[name];if(!f)return null;
    const start=f.lho+30+dv.getUint16(f.lho+26,true)+dv.getUint16(f.lho+28,true);
    const data=u8.subarray(start,start+f.csize);
    if(f.method===0)return dec.decode(data);
    if(f.method!==8)throw new Error('نوع فشرده‌سازی فایل پشتیبانی نمی‌شود.');
    if(typeof DecompressionStream==='undefined')throw new Error('مرورگر شما قدیمی است. Chrome، Edge یا Safari جدید را استفاده کنید.');
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }};
}
// colName: شماره‌ی ستون (از صفر) را به نام ستون اکسل تبدیل می‌کند (۰→A، ۲۵→Z، ۲۶→AA). برای ساختن آدرس سلول مثل «C5» لازم است.
const colName=c=>{let s='';c++;while(c){s=String.fromCharCode(65+(c-1)%26)+s;c=Math.floor((c-1)/26)}return s};
// parseReport: ورودی فایل اکسل (ArrayBuffer) و خروجی شیء داده‌ی داشبورد (out) است.
// مراحل: ۱) باز کردن ZIP؛ ۲) پیدا کردن نام شیت‌ها از workbook.xml و مسیر فایل هر شیت از فایل rels؛
// ۳) خواندن sharedStrings؛ ۴) خواندن شیت‌های شعب (فروش و تارگت) و سپس بخش‌های اختیاری (پورسانت، لیست قیمت، کدهای پرسنلی، نسخه‌ی تیم، پوشش، مشتریان بدون خرید).
// بخش‌های اختیاری هرکدام در try جدا هستند: خطای یکی فقط یک هشدار (…Warn) می‌سازد و بقیه‌ی داشبورد کار می‌کند؛ اما شیت‌های اصلی شعب خطای سخت می‌دهند.
// شیء خروجی: branches (هر شعبه و ردیف‌های فروش)، elapsed/total/remaining (روزهای ماه)، month/year/asof، comm، price، codes، alt، cov، nc.
async function parseReport(buf){
  const z=await readZip(buf),dp=new DOMParser(),xml=t=>dp.parseFromString(t,'application/xml');
  const wbx=await z.get('xl/workbook.xml'),rel=await z.get('xl/_rels/workbook.xml.rels');
  if(!wbx||!rel)throw new Error('این فایل، یک فایل اکسل معتبر نیست.');
  const RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  // نگاشت شناسه‌ی رابطه (rId) به مسیر فایل شیت؛ workbook.xml فقط نام شیت و rId دارد و مسیر واقعی در rels است.
  const relMap={};[...xml(rel).getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  // sheets: نام نرمال‌شده‌ی شیت ← مسیر فایل. sheetsNS همان است ولی کلیدش بدون فاصله است تا نام‌هایی مثل «بابل (پورسانت)» و «بابل(پورسانت)» یکسان پیدا شوند.
  const sheets={},sheetsNS={};
  [...xml(wbx).getElementsByTagName('sheet')].forEach(s=>{const t=relMap[s.getAttributeNS(RNS,'id')||s.getAttribute('r:id')];if(!t)return;const p=t.startsWith('/')?t.slice(1):'xl/'+t,nm=normFa(s.getAttribute('name'));sheets[nm]=p;sheetsNS[nm.replace(/\s+/g,'')]=p});
  // بررسی وجود چهار شیت اصلی؛ اگر نباشند نام شیت‌های گمشده در پیام خطا می‌آید.
  const miss=WANTED.filter(w=>!sheets[w]);
  if(miss.length)throw new Error('این شیت‌ها در فایل پیدا نشد: '+miss.join('، '));
  // sharedStrings: در xlsx متن سلول‌ها یک‌بار در جدول رشته‌ها ذخیره می‌شود و سلول فقط اندیس آن را دارد.
  // متن‌های rPh (راهنمای تلفظ آسیای شرقی) حذف می‌شوند تا متن تکراری به رشته اضافه نشود؛ بخش‌های rich-text با هم الحاق می‌شوند.
  const sstX=await z.get('xl/sharedStrings.xml');const sst=[];
  if(sstX)[...xml(sstX).getElementsByTagName('si')].forEach(si=>{sst.push([...si.getElementsByTagName('t')].filter(t=>t.parentNode.nodeName!=='rPh').map(t=>t.textContent).join(''))});
  // loadCells: یک شیت را می‌خواند و نقشه‌ی «آدرس سلول ← مقدار» و بزرگ‌ترین شماره‌ی ردیف را برمی‌گرداند.
  // نوع سلول (t): inlineStr متن درون‌خطی، s اندیس رشته‌ی مشترک، str نتیجه‌ی فرمول متنی، b بولین، e خطا (به‌صورت شیء تا از متن/عدد جدا شود)، و در غیر این صورت عدد.
  // سلول بدون مقدار نادیده گرفته می‌شود.
  const loadCells=async(path,label)=>{
    const sx=await z.get(path);if(!sx)throw new Error('شیت «'+label+'» خوانده نشد.');
    const cells={};let maxRow=0;
    [...xml(sx).getElementsByTagName('c')].forEach(c=>{
      const a=c.getAttribute('r'),t=c.getAttribute('t'),ve=c.getElementsByTagName('v')[0];let val;
      if(t==='inlineStr'){val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('')}
      else if(!ve)return;
      else if(t==='s')val=sst[+ve.textContent];
      else if(t==='str')val=ve.textContent;
      else if(t==='b')val=ve.textContent==='1';
      else if(t==='e')val={e:ve.textContent};
      else val=Number(ve.textContent);
      cells[a]=val;const r=+a.replace(/\D/g,'');if(r>maxRow)maxRow=r;
    });
    return{cells,maxRow};
  };
  // salesRows: ردیف‌های فروش یک شعبه را از روی ستون‌های ثابت شیت استخراج می‌کند (ردیف‌ها از ردیف ۴ شروع می‌شوند).
  // ستون C = گروه محصول (فقط در اولین ردیف هر گروه پر است، پس آخرین مقدار در group نگه داشته می‌شود)، D = نام ویزیتور، E = کد ویزیتور،
  // G = تارگت، H = فروش، M = هزینه، N = تعداد فاکتور. ردیف «جمع» و ردیف‌هایی که تارگت/فروش عددی ندارند رد می‌شوند.
  // اگر کد ویزیتور عدد نبود، نام او به‌عنوان کد استفاده می‌شود تا ردیف‌ها قابل شناسایی بمانند.
  const salesRows=(cells,maxRow)=>{
    const v=(c,r)=>cells[colName(c)+(r+1)],rs=[];let group=null;
    for(let r=3;r<maxRow;r++){
      const c=normFa(v(2,r)),name=normFa(v(3,r));
      if(c==='جمع')continue;
      if(c)group=c;
      if(!name||!group)continue;
      const t=v(6,r),s=v(7,r);
      if(typeof t!=='number'||typeof s!=='number')continue;
      const code=v(4,r),inv=v(13,r);
      rs.push({product:group,visitor:name,code:typeof code==='number'?code:name,target:t,sales:s,invoices:typeof inv==='number'?inv:null,cost:typeof v(12,r)==='number'?v(12,r):null});
    }
    return rs;
  };
  // out: شیء نهایی. حلقه‌ی زیر چهار شعبه را می‌خواند؛ از شیت اول (بابل) علاوه بر فروش، اطلاعات زمانی ماه هم برداشته می‌شود.
  const out={branches:[]};
  for(let i=0;i<WANTED.length;i++){
    const w=WANTED[i],{cells,maxRow}=await loadCells(sheets[w],w);
    const v=(c,r)=>cells[colName(c)+(r+1)];
    // ردیف ۲ شیت بابل: روزهای سپری‌شده (H2)، کل روزهای ماه (J2)، باقی‌مانده (K2)، نام ماه (B2) و تاریخ گزارش (F2).
    // تاریخ گزارش در اکسل «شماره‌ی سریال» است؛ ۲۵۵۶۹ فاصله‌ی مبدا اکسل (۱۹۰۰) تا ۱۹۷۰ یونیکس به روز است و ۸۶۴۰۰۰۰۰ میلی‌ثانیه‌ی هر روز.
    // فقط مقادیر بزرگ‌تر از ۳۰۰۰۰ (یعنی واقعاً تاریخ) پذیرفته می‌شوند. اگر روزها خوانده نشوند، خطای سخت داده می‌شود چون بدون آن‌ها درصد پیشرفت ماه معنا ندارد.
    if(i===0){
      const el=v(7,1),to=v(9,1),rem=v(10,1),f=v(5,1);
      if(typeof el!=='number'||typeof to!=='number'||!to)throw new Error('تعداد روزهای سپری‌شده و کل ماه (ردیف ۲ شیت بابل) خوانده نشد.');
      out.elapsed=el;out.total=to;out.remaining=typeof rem==='number'?rem:to-el;out.month=normFa(v(1,1));
      if(typeof f==='number'&&f>30000){const d=new Date(Math.round((f-25569)*864e5));out.year=d.getUTCFullYear();out.iso=d.toISOString().slice(0,10);
        out.asof=new Intl.DateTimeFormat('fa-IR-u-ca-gregory',{dateStyle:'medium',timeStyle:'short',timeZone:'UTC'}).format(d)}
    }
    const rs=salesRows(cells,maxRow);
    if(!rs.length)throw new Error('در شیت «'+w+'» ردیفی با هدف و فروش پیدا نشد.');
    out.branches.push({name:w,rows:rs});
  }
  // بخش پورسانت: برای هر شعبه یک شیت «<شعبه> (پورسانت)» با parseComm خوانده می‌شود. اگر مشکلی باشد comm=null و فقط هشدار ثبت می‌شود.
  /* commission sheets: «<شعبه> (پورسانت)» */
  try{
    const cb=[],groups=[];
    for(const w of WANTED){
      const p=sheetsNS[w+'(پورسانت)'];if(!p)throw new Error('شیت «'+w+' (پورسانت)» در فایل پیدا نشد.');
      const {cells,maxRow}=await loadCells(p,w+' (پورسانت)');
      const b=parseComm(cells,maxRow,w);b.groups.forEach(g=>{if(!groups.includes(g))groups.push(g)});cb.push(b);
    }
    out.comm={branches:cb,groups};
  }catch(err){out.comm=null;out.commWarn=err&&err.message?err.message:String(err)}
  // بخش لیست قیمت (شیت anbar): ابتدا با نام شیت و در صورت نبود با شناسایی ردیف سرستون پیدا می‌شود، چون نام شیت ممکن است متفاوت باشد.
  /* price list: sheet «anbar» (found by name, or by its header row) */
  try{
    // sq: نرمال‌سازی قوی برای مقایسه‌ی سرستون‌ها: حذف فاصله، نیم‌فاصله و همزه و تبدیل به حروف کوچک.
    const isNum=x=>typeof x==='number'&&isFinite(x),nn=x=>isNum(x)?x:null,sq=x=>normFa(x).replace(/[\s‌‌]+/g,'').replace(/ء/g,'').toLowerCase();
    const FIELDS=[['code',['کدکالا']],['name',['نامکالا','نامکاال']],['box',['بطر']],['prod',['قیمتتولید']],['cons',['مصرفکننده']],['costBtl',['تمامشدهبهبطر']],['costBox',['تمامشدهبهباکس']],['unit',['قیمتواحد']],['stock',['موجودی']],['newp',['قیمتجدید']],['total',['قجدید+موجودی','قیمتجدید+موجودی']],['out',['خروجی']],['exp',['تاریخانقضا','انقضا']]];
    // DEF: جایگاه پیش‌فرض ستون‌ها در صورتی که سرستونی با نام شناخته‌شده پیدا نشد.
    const DEF={code:0,name:1,box:2,prod:3,cons:4,costBtl:5,costBox:6,unit:7,stock:8,newp:9,total:10,out:11,exp:12};
    // findHeader: در هشت ردیف اول دنبال ردیف سرستون می‌گردد؛ اگر نام کالا و حداقل پنج ستون شناخته‌شده یافت شد آن ردیف و نگاشت ستون‌ها را برمی‌گرداند.
    const findHeader=(cells,maxRow)=>{
      for(let r=0;r<Math.min(maxRow,8);r++){
        const map={};let hit=0;
        for(let c=0;c<30;c++){const t=sq(cells[colName(c)+(r+1)]);if(!t)continue;
          for(const [k,alts] of FIELDS){if(map[k]!==undefined)continue;if(alts.some(a=>t===sq(a))||(k==='exp'&&/انقض/.test(t))){map[k]=c;hit++;break}}}
        if(map.name!==undefined&&hit>=5)return{r,map};
      }
      return null;
    };
    let found=null;
    const tryPath=async(p,label)=>{const {cells,maxRow}=await loadCells(p,label);const h=findHeader(cells,maxRow);return h?{cells,maxRow,h}:null};
    const cand=Object.entries(sheetsNS).filter(([k])=>/anbar|انبار/.test(k.toLowerCase()));
    for(const [k,p] of cand){found=await tryPath(p,k);if(found)break}
    if(!found){const skip=new Set([...WANTED,...WANTED.map(w=>w+'(پورسانت)')]);
      for(const [k,p] of Object.entries(sheetsNS)){if(skip.has(k)||cand.some(c=>c[0]===k))continue;try{found=await tryPath(p,k)}catch(_){found=null}if(found)break}}
    if(!found)throw new Error('شیت لیست قیمت (anbar) با ستون‌های «نام کالا»، «قیمت تولید»، … در فایل پیدا نشد.');
    // col: ستون هر فیلد از روی سرستون یافت‌شده، یا مقدار پیش‌فرض DEF. بعد از ردیف سرستون، هر ردیفِ دارای نام کالا یک آیتم قیمت می‌شود.
    const {cells,maxRow,h}=found,col=k=>h.map[k]!==undefined?h.map[k]:DEF[k],v=(c,r)=>cells[colName(c)+(r+1)];
    const items=[];
    for(let r=h.r+1;r<maxRow;r++){
      const name=normFa(v(col('name'),r));if(!name)continue;
      // تاریخ انقضا (میلادی، سریال اکسل) به صورت ISO (YYYY-MM-DD) ذخیره می‌شود؛ مقدار غیرتاریخ به null تبدیل می‌شود.
      const d=v(col('exp'),r);let exp=null;
      if(isNum(d)&&d>30000)exp=new Date(Math.round((d-25569)*864e5)).toISOString().slice(0,10);
      const cd=v(col('code'),r),g=k=>nn(v(col(k),r));
      items.push({code:isNum(cd)?cd:normFa(cd),name,box:g('box'),prod:g('prod'),cons:g('cons'),costBtl:g('costBtl'),costBox:g('costBox'),unit:g('unit'),stock:g('stock'),newp:g('newp'),total:g('total'),out:g('out'),exp});
    }
    if(!items.length)throw new Error('در شیت لیست قیمت (anbar) کالایی پیدا نشد.');
    out.price=items;
  }catch(err){out.price=null;out.priceWarn=err&&err.message?err.message:String(err)}
  // کدهای پرسنلی: شیت «DataBase» و ستون «کد پرسنلی». هر کد یک رمز مشاهده است (رمز نسخه‌ی تیم)؛ در sealHtml به‌عنوان یک slot کلید ساخته می‌شود.
  // این کدها فقط برای قفل‌گذاری استفاده می‌شوند و هنگام ذخیره از داده‌ی جاسازی‌شده حذف می‌شوند (buildSavedHtml: codes:undefined).
  /* personnel codes (sheet «DataBase», column «کد پرسنلی») = viewing passwords */
  try{
    const key=Object.keys(sheetsNS).find(k=>k.toLowerCase()==='database');
    if(!key)throw new Error('شیت «DataBase» در فایل پیدا نشد.');
    const {cells,maxRow}=await loadCells(sheetsNS[key],'DataBase');

// parseComm: یک شیت پورسانت شعبه را می‌خواند. ردیف ۲ سرتیتر ستون‌هاست (پورسانت، قوطی، شیشه، نهایی) و اگر نباشند خطا می‌دهد.

// ردیف سرپرست (بدون درصد و در گروه اول) جدا از ویزیتورها در sup ذخیره می‌شود. هر ویزیتور با کدش یک‌بار در Map ثبت و اطلاعات هر گروه در e.g جمع می‌شود.

}

// checkLogin: نام کاربری (کوچک‌شده و بدون فاصله‌ی اضافه) و رمز را با نمک هش می‌کند و با AUTH_HASH مقایسه می‌کند. کاربر مجاز: mahmoudi.
const checkLogin=(u,p)=>sha256hex(AUTH_SALT+'|'+u.trim().toLowerCase()+':'+p)===AUTH_HASH;
// buildSavedHtml: کل سند را کلون می‌کند و آن را به یک فایل مستقل «مشاهده‌گر» تبدیل می‌کند (خروجی دکمه‌ی ذخیره).
// ۱) محتوای پویای رابط خالی می‌شود تا فقط داده‌ی جاسازی‌شده و کد باقی بماند؛
// ۲) داده در reportData نوشته می‌شود، با حذف codes (کدهای پرسنلی) و alt (نسخه‌ی تیم): در این خروجی داده‌ی واقعی مدیریت است و بعداً sealHtml آن را رمزنگاری می‌کند؛
// ۳) کاراکتر < به \u003c تبدیل می‌شود تا داده نتواند تگ script را ببندد (جلوگیری از تزریق)؛
// ۴) دکمه‌ی بارگذاری و پنجره‌های ورود/محاسبه حذف و VIEWER به true تغییر می‌کند و هش ورود پاک می‌شود.
function buildSavedHtml(data){
  const cl=document.documentElement.cloneNode(true),q=x=>cl.querySelector(x);cl.removeAttribute('data-theme');
  ['#view','#stats','#summary','#chips','#selBranch','#selVisitor','#mastSub','#asof'].forEach(x=>{const n=q(x);if(n)n.innerHTML=''});
  q('#mTitle').textContent='داشبورد فروش';const tp=q('#tip');tp.removeAttribute('style');tp.setAttribute('hidden','');tp.innerHTML='';
  ['#side','#summary','#scrim'].forEach(x=>{const n=q(x);if(n)n.classList.remove('open','on')});
  cl.querySelectorAll('.tab').forEach(t=>t.removeAttribute('aria-selected'));
  q('#reportData').textContent=JSON.stringify(Object.assign({},data,{codes:undefined,alt:undefined})).replace(/</g,'\\u003c');
  /* viewer copy: no upload button, no login box, no password check */
  ['.upl','#modal','#calcModal'].forEach(x=>{const n=q(x);if(n)n.remove()});
  const sc=[...cl.querySelectorAll('script')].find(n=>!n.type&&n.textContent.includes('const VIEWER='+'false'));
  sc.textContent=sc.textContent.split('const VIEWER='+'false').join('const VIEWER='+'true').replace(/AUTH_HASH='[0-9a-f]{64}'/,"AUTH_HASH=''");
  return '<!doctype html>\n'+cl.outerHTML;
}

// اصل امنیتی: payload تیم هرگز نباید داده‌ی واقعی داشته باشد، چون کدهای پرسنلی بین افراد زیاد پخش است و قابل افشا هستند؛ فقط اعداد «فیک» در آن است.
// قالب باینری: salt(16) | تعداد payload(1) | [iv(12) طول(4) متن‌رمز]... | تعداد شکاف(2) | [اندیس(1) iv(12) کلید-پیچیده(48)]...
// meta.iso: تاریخ گزارش (YYYY-MM-DD) که در صفحه‌ی ورود (بیرون از بخش رمزنگاری‌شده) نمایش داده می‌شود تا کاربر بفهمد گزارش جدید است یا قدیمی
async function sealHtml(payloads,specs,meta){
  const enc=new TextEncoder(),sub=crypto.subtle;
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const P=await Promise.all(payloads.map(async html=>{
    const comp=await new Response(new Blob([enc.encode(html)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
    const iv=crypto.getRandomValues(new Uint8Array(12)),raw=crypto.getRandomValues(new Uint8Array(32));
    const k=await sub.importKey('raw',raw,'AES-GCM',false,['encrypt']);
    return{iv,raw,ct:new Uint8Array(await sub.encrypt({name:'AES-GCM',iv},k,comp))}}));
  const slots=await Promise.all(specs.map(async sp=>{
    const km=await sub.importKey('raw',enc.encode(pwNorm(sp.pw)),'PBKDF2',false,['deriveKey']);
    const kek=await sub.deriveKey({name:'PBKDF2',salt,iterations:PW_ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12)),w=new Uint8Array(await sub.encrypt({name:'AES-GCM',iv},kek,P[sp.i].raw));
    const o=new Uint8Array(61);o[0]=sp.i;o.set(iv,1);o.set(w,13);return o}));
  let n=17+2+slots.length*61;P.forEach(p=>{n+=16+p.ct.length});
  const all=new Uint8Array(n);all.set(salt,0);let off=16;all[off++]=P.length;
  P.forEach(p=>{all.set(p.iv,off);off+=12;const L=p.ct.length;all[off]=L>>>24;all[off+1]=(L>>>16)&255;all[off+2]=(L>>>8)&255;all[off+3]=L&255;off+=4;all.set(p.ct,off);off+=L});
  all[off]=slots.length>>8;all[off+1]=slots.length&255;off+=2;slots.forEach(s=>{all.set(s,off);off+=61});
  let bin='';for(let i=0;i<all.length;i+=32768)bin+=String.fromCharCode.apply(null,all.subarray(i,i+32768));
  const b64=btoa(bin).replace(/.{100}/g,'$&\n');
  const R={'{{TITLE}}':'داشبورد فروش','{{H1}}':'داشبورد فروش','{{HINT}}':'این فایل رمزگذاری شده است. رمز مشاهده را وارد کنید.','{{USER}}':'','{{PH}}':'رمز مشاهده','{{BTN}}':'باز کردن داشبورد','{{ADM}}':'0','{{ISO}}':(meta&&meta.iso)||'','{{ITER}}':String(PW_ITER),'{{PAYLOAD}}':b64};
  return LOADER_TPL.replace(/\{\{[A-Z0-9]+\}\}/g,k=>R[k]);
}

// syncVas: دکمه‌های «نمایش به‌عنوان» (مدیریت/تیم) فقط برای مدیر وارد‌شده و فقط وقتی نسخه‌ی تیم وجود دارد (alt) نشان داده می‌شوند.
function syncVas(){const e=$('#vas'),sb=$('#saveBtn'),r=REALD||D;if(e)e.hidden=!(!VIEWER&&(window.__ADM||(sb&&!sb.hidden))&&r&&r.alt)}
// viewAs: جابه‌جایی بین نمای واقعی و نمای تیم. در نمای تیم شعب و پورسانت از alt می‌آید و قیمت‌های خروجی/هزینه با stripOut پاک می‌شود تا داده‌ی واقعی نشت نکند. REALD داده‌ی واقعی را نگه می‌دارد.
function viewAs(w){const real=REALD||D;if(!real||!real.alt)return;REALD=real;
  setData(w==='team'?Object.assign({},real,{branches:real.alt.branches,comm:real.alt.comm||real.comm,team:true,price:stripOut(real.price)}):real);
  document.querySelectorAll('[data-vas]').forEach(b=>b.classList.toggle('on',b.dataset.vas===w));paintHeader();render()}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-vas]');if(b)viewAs(b.dataset.vas)});
// agg: جمع تارگت و فروش برای مجموعه‌ای از ردیف‌ها و درصد تحقق، باقی‌مانده و مازاد.
function agg(rs){let t=0,s=0;rs.forEach(r=>{t+=r.target;s+=r.sales});return{t,s,pct:t?s/t:0,rem:Math.max(0,t-s),over:Math.max(0,s-t)}}
// meanPct: میانگین درصد تحقق محصولات (هر محصول یک‌بار، مستقل از تعداد ردیف‌هایش).
function meanPct(rs){const by={};rs.forEach(r=>(by[r.product]=by[r.product]||[]).push(r));const ps=Object.values(by).map(a=>agg(a).pct);return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0}
// scopeRows: ردیف‌ها را با فیلترهای فعال (شعبه، ویزیتور، محصول) می‌برد؛ پارامتر ign نام فیلترهایی است که باید نادیده گرفته شوند.
function scopeRows(ign){ign=ign||[];return rows.filter(r=>
  (ign.includes('branch')||st.branch==='all'||r.branch===st.branch)&&
  (ign.includes('visitor')||st.visitor==='all'||r.code===st.visitor)&&
  (ign.includes('product')||st.product==='all'||r.product===st.product))}
// stOf: وضعیت رنگی بر اساس درصد تحقق: خوب اگر از خط برنامه (PACE) کمتر نباشد، سپس هشدار (۶۰٪)، جدی (۴۰٪) و بحرانی.
function stOf(p){return p>=PACE?'good':p>=0.6?'warn':p>=0.4?'serious':'crit'}
// label: برچسب فارسی هر وضعیت؛ ۱۰۰٪ یا بیشتر «تارگت زده شد».
function label(p){return p>=1?'تارگت زده شد':({good:'در مسیر',warn:'کمی عقب',serious:'عقب',crit:'نیازمند تلاش'})[stOf(p)]}
const pill=p=>`<span class="pill st-${stOf(p)}"><i></i>${label(p)}</span>`;
// domOf: بیشینه‌ی محور میله‌ها؛ حداقل ۱٫۲ و گرد‌شده به مضرب ۰٫۲۵.
const domOf=ps=>Math.max(1.2,Math.ceil(Math.max(...ps,0)*4)/4);
// vName: نام ویزیتور از روی کد.
const vName=code=>(visitors.find(v=>v.code===code)||{}).name||'';

// ring: حلقه‌ی پیشرفت SVG؛ طول کمان با درصد (حداکثر ۱۰۰٪) متناسب است.
function ring(p,r,w){const C=2*Math.PI*r;const d=Math.min(p,1)*C;const s=100;
  return `<svg viewBox="0 0 ${s} ${s}" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="${w}"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--c)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${d} ${C}"/></svg>`}

// barRow: یک ردیف میله‌ای با نشانگر خط برنامه و تارگت.
function barRow(o){
  const s=stOf(o.pct);
  return `<div class="brow st-${s}${o.on?' on':''}" role="button" tabindex="0" data-act="${o.act}" data-tip="${o.tip}">
    <div class="bl"><b>${o.label}</b><small>${o.sub||''}</small></div>
    <div class="bt"><div class="f" style="width:${Math.min(100,o.pct/o.dom*100)}%"></div><i class="mk p" style="inset-inline-start:${PACE/o.dom*100}%"></i><i class="mk" style="inset-inline-start:${1/o.dom*100}%"></i></div>
    <div class="bv"><b class="num">${pc(o.pct)}</b>${pill(o.pct)}</div></div>`}

// barLegend: راهنمای رنگ‌ها و نشانگرهای میله‌ها.
const barLegend=()=>`<div class="legend"><span><i class="lk d"></i>خط برنامه: ${pc(PACE)} (روز ${nf0.format(E)} از ${nf0.format(T)})</span><span><i class="lk"></i>تارگت: ۱۰۰٪</span>
  <span class="pill st-good"><i></i>در مسیر</span><span class="pill st-warn"><i></i>۶۰ تا ${pc(PACE)}</span><span class="pill st-serious"><i></i>۴۰ تا ۶۰٪</span><span class="pill st-crit"><i></i>زیر ۴۰٪</span></div>`;

// scopeTitle: عنوان متنی دامنه‌ی فعلی (شعبه · ویزیتور · محصول).
function scopeTitle(ignV){
  const a=[st.branch==='all'?'همه شعب':'شعبه '+st.branch];
  if(st.visitor!=='all'&&!ignV)a.push(vName(st.visitor));
  a.push(st.product==='all'?'همه محصولات':st.product);
  return a.join(' · ')}

// pushMsg: پیام انگیزشی: نرخ فروش لازم روزانه برای باقی‌مانده را با سرعت فعلی مقایسه می‌کند و بر اساس نسبت (m) لحن پیام را انتخاب می‌کند.
function pushMsg(a){
  if(a.rem<=0)return `تارگت زده شد و ${n(a.over)} واحد از هدف جلوتر هستید. ادامه بدهید.`;
  const cur=a.s/E, need=a.rem/R, m=cur>0?need/cur:Infinity;
  const base=`${n(a.rem)} واحد تا تارگت مانده، یعنی روزی ${n(need)} واحد در ${nf0.format(R)} روز باقی‌مانده.`;
  if(m<=1)return base+' با سرعت فعلی به هدف می‌رسید، همین ریتم را نگه دارید.';
  if(m<=1.6)return base+' فقط کمی سریع‌تر از امروز لازم است.';
  if(m<=3)return base+' چالش جدی ولی شدنی است. روی مشتریان پرخرید تمرکز کنید.';
  return base+' فاصله زیاد است و هر روز حساب است. از امروز شروع کنید.';
}

// ==========================================================================
// بخش‌های مشترک + صفحه نمای کلی (Overview) + مقایسه ویزیتورها + صفحه شکاف تارگت
// - بخش مشترک: ساخت آیکن SVG، حلقه درصد (ring)، کارت‌های آمار، نمودار ستونی عمودی (vChart)
//   و کارت خلاصه سمت راست/بالا (summaryHtmlSales) که در چند صفحه استفاده می‌شود.
// - نمای کلی (viewOverview): تحقق تارگت به تفکیک محصول و ویزیتور با نمودار ستونی.
// - مقایسه (viewCompare): رتبه‌بندی، نقشه حرارتی و مقایسه مستقیم تا ۳ ویزیتور.
// - تارگت (viewTarget): کسری تا تارگت، «لازم در روز»، سرعت فعلی و پیش‌بینی پایان ماه.
// نکته: قالب‌بندی عدد (nf0/nf1/n/pc) و راهنمای شناور data-tip (با فشردن طولانی در لمسی)
// در فایل‌های دیگر تعریف شده؛ این فایل فقط از آن‌ها استفاده می‌کند و data-tip را در HTML می‌گذارد.
// ==========================================================================
/* ---------- shared pieces ---------- */
// تابع کمکی ساخت آیکن SVG درون‌خطی؛ d محتوای مسیرهای SVG و s اندازه (پیش‌فرض ۲۶) است.
// رنگ آیکن با currentColor از متن والد گرفته می‌شود تا با تم روشن/تیره هماهنگ باشد.
const ic=(d,s)=>`<svg viewBox="0 0 24 24" width="${s||26}" height="${s||26}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
// جدول مسیرهای آیکن‌ها (تقویم، ساعت، پرچم، کاربران)؛ کلید همان نامی است که به ic() داده می‌شود.
const IC_={cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',flag:'<path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3 3 0 010 5.6M21 20c0-2.6-1.6-4.8-3.8-5.6"/>'};
// heroOf: عدد اصلی و پیام کارت خلاصه را از ردیف‌های فروش می‌سازد.
// خروجی: درصد (p)، متن درشت، عنوان، پیام راهنما و چهار KPI کوچک.
function heroOf(rs){
  if(!rs.length)return{p:0,big:pc(0),cap:'میانگین تحقق',msg:'برای این انتخاب داده‌ای وجود ندارد.',kpis:[]};
  // حالت «همه محصولات»: ردیف‌ها بر اساس محصول گروه می‌شوند و درصد کل میانگین درصد تحقق محصولات است
  // (نه نسبت جمع فروش به جمع تارگت)، چون واحد محصولات با هم فرق دارد.
  if(st.product==='all'){
    const by={};rs.forEach(r=>(by[r.product]=by[r.product]||[]).push(r));
    const ags=Object.entries(by).map(([k,v])=>({k,a:agg(v)}));
    // PACE خط برنامه امروز است. «در مسیر» یعنی تحقق از PACE بالاتر ولی هنوز زیر ۱۰۰٪؛ «کم‌تحقق» زیر ۴۰٪.
    const mp=meanPct(rs), hit=ags.filter(x=>x.a.pct>=1).length, trk=ags.filter(x=>x.a.pct>=PACE&&x.a.pct<1).length, low=ags.filter(x=>x.a.pct<0.4).length;
    return{p:mp,big:pc(mp),cap:'میانگین تحقق',
      msg:`از ${nf0.format(ags.length)} محصول، ${nf0.format(hit)} محصول تارگت زده و ${nf0.format(trk)} محصول در مسیر است. ${low?nf0.format(low)+' محصول زیر ۴۰٪ تارگت است و بیشترین فرصت رشد را دارد.':'هیچ محصولی زیر ۴۰٪ نیست.'}`,
      kpis:[['تارگت‌زده',nf0.format(hit)+' محصول'],['در مسیر',nf0.format(trk)+' محصول'],['عقب‌تر از ۶۰٪',nf0.format(ags.filter(x=>x.a.pct<0.6).length)+' محصول'],['زیر ۴۰٪',nf0.format(low)+' محصول']]};
  }
  // حالت یک محصول: جمع‌بندی دقیق با agg(). پیش‌بینی پایان ماه = (فروش تا امروز ÷ روز سپری‌شده E) × کل روزهای کاری T ÷ تارگت.
  const a=agg(rs), proj=(a.s/E*T)/a.t;
  return{p:a.pct,big:pc(a.pct),cap:'تحقق تارگت',msg:pushMsg(a),
    kpis:[['تارگت ماه',n(a.t)+' واحد'],['فروش تا امروز',n(a.s)+' واحد'],[a.rem>0?'کسری':'اضافه فروش',n(a.rem>0?a.rem:a.over)+' واحد'],['پیش‌بینی پایان ماه',pc(proj)]]};
}
// در نمای مقایسه، فیلتر ویزیتور نادیده گرفته می‌شود تا همه ویزیتورها دیده شوند؛ در غیر این صورت فیلتر اعمال می‌شود.
const ignOf=()=>st.view==='compare'?['visitor']:[];

// statsHtmlSales: چهار کارت آمار بالای صفحه (روز کاری سپری‌شده، روز مانده، خط برنامه، تعداد ویزیتور).
function statsHtmlSales(){
  // تعداد ویزیتورهای یکتا در نمای فعلی با شمارش کدهای منحصربه‌فرد.
  const vc=new Set(scopeRows(ignOf()).map(r=>r.code)).size;
  const card=(i,v,t,extra)=>`<div class="stat"><span class="si">${ic(IC_[i])}</span><b class="num">${v}</b><small>${t}</small>${extra||''}</div>`;
  return card('cal',`${nf0.format(E)} از ${nf0.format(T)}`,'روز کاری سپری‌شده',`<span class="mbar"><i style="width:${PACE*100}%"></i></span>`)
    +card('clock',nf0.format(R),'روز تا پایان ماه')
    +card('flag',pc(PACE),'خط برنامه امروز')
    +card('users',nf0.format(vc),'ویزیتور در این نما');
}
// ringSvg: حلقه پیشرفت با دو دایره؛ دایره رنگی با stroke-dasharray (طول کمان، محیط) کشیده می‌شود.
// درصد بالاتر از ۱۰۰٪ برای رسم به ۱۰۰٪ محدود می‌شود تا حلقه از دایره بیرون نزند.
function ringSvg(p,r,w){const C=2*Math.PI*r,d=Math.min(p,1)*C;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="${w}"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--c)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${d} ${C}"/></svg>`}
// نام محصول «اورجینال»؛ شاخص‌های عملیاتی (هزینه کل و میانگین فاکتور) فقط برای همین محصول حساب می‌شود.
const ORIG='اورجینال';
// opsOf: هزینه کل (میانگین وزنی با وزن فروش هر ویزیتور) و میانگین فاکتور روزانه را حساب می‌کند.
// ویزیتور بدون هزینه معتبر یا بدون فاکتور ثبت‌شده در میانگین نمی‌آید.
function opsOf(){
  const rs=scopeRows(['product'].concat(ignOf())).filter(r=>r.product===ORIG);
  let w=0,cw=0,cn=0;
  rs.forEach(r=>{if(typeof r.cost==='number'&&isFinite(r.cost)&&r.sales>0){w+=r.sales;cw+=r.sales*r.cost;cn++}});
  const inv=rs.filter(r=>typeof r.invoices==='number'&&r.invoices>0);
  return{cost:w?cw/w:null,costN:cn,avg:inv.length?inv.reduce((a,r)=>a+r.invoices/E,0)/inv.length:null,invN:inv.length,total:rs.length};
}
// sdetHtml: جزئیات زیر حلقه خلاصه؛ KPIها + دو شاخص رنگی هزینه کل (قرمز بالای ۲۵٪) و میانگین فاکتور
// (قرمز زیر ۱۰، زرد ۱۰ تا ۱۵، سبز ۱۵ به بالا). متن راهنما با جداکننده | در data-tip قرار می‌گیرد.
function sdetHtml(h){
  const o=opsOf(),cell=(l,v,t,cls,tip)=>`<div class="ops ${cls}" data-tip="${tip}"><small>${l}</small><b class="num">${v}</b><em>${t}</em></div>`;
  let c,a;
  if(o.cost==null)c=cell('هزینه کل','-','داده‌ای نیست','mt-na','هزینه کل|برای این انتخاب مقداری در فایل نیست');
  else{const c1=Math.round(o.cost*1000)/10,bad=c1>25;
    c=cell('هزینه کل',nf1.format(c1)+'٪',bad?'بالاتر از ۲۵٪':'در حد مجاز',bad?'mt-bad':'mt-good',`هزینه کل: ${nf1.format(c1)}٪|قرمز: بالاتر از ۲۵٪ · سبز: ۲۵٪ یا کمتر|میانگین وزنی ${nf0.format(o.costN)} ویزیتور`)}
  if(o.avg==null)a=cell('میانگین فاکتور','-','داده‌ای نیست','mt-na','میانگین فاکتور|برای این انتخاب مقداری در فایل نیست');
  else{const a1=Math.round(o.avg*10)/10,k=a1<10?'bad':a1<15?'mid':'good';
    a=cell('میانگین فاکتور',nf1.format(a1),k==='bad'?'کمتر از ۱۰':k==='mid'?'بین ۱۰ تا ۱۵':'۱۵ و بالاتر','mt-'+k,`میانگین فاکتور روزانه: ${nf1.format(a1)}|قرمز: زیر ۱۰ · زرد: ۱۰ تا ۱۵ · سبز: ۱۵ به بالا|میانگین ${nf0.format(o.invN)} از ${nf0.format(o.total)} ویزیتور. ویزیتور بدون فاکتور ثبت‌شده حساب نشده است.`)}
  return `<div class="sdet">${h.kpis.map(k=>`<div><small>${k[0]}</small><b class="num">${k[1]}</b></div>`).join('')}${c}${a}</div>`;
}
// summaryHtmlSales: کارت خلاصه (حلقه درصد، متن پیام و فهرست نزدیک به تارگت) برای صفحات فروش.
function summaryHtmlSales(){
  const rs=scopeRows(ignOf()),h=heroOf(rs);
  // نزدیک به تارگت: ردیف‌هایی که بین ۶۰٪ تا ۱۰۰٪ هستند، به ترتیب نزدیک‌ترین به تارگت، حداکثر ۴ مورد.
  const near=rs.filter(r=>r.sales<r.target&&r.sales/r.target>=0.6).sort((a,b)=>b.sales/b.target-a.sales/a.target).slice(0,4);
  const nearH=near.length?near.map(r=>`<div class="bl2" role="button" tabindex="0" data-act="v:${r.code}" data-tip="${r.visitor}|${r.product}|فروش: ${n(r.sales)} از ${n(r.target)}"><div><b>${r.visitor}</b><small>${r.product} · ${n(r.target-r.sales)} واحد تا تارگت</small></div><em class="num">${pc(r.sales/r.target)}</em></div>`).join(''):'<p class="empty">موردی بین ۶۰ تا ۱۰۰٪ نیست.</p>';
  return `<div class="st-${stOf(h.p)}"><div class="donut">${ringSvg(h.p,42,10)}<div class="c"><b class="num">${h.big}</b><small>${h.cap}</small></div></div></div>
    <h2 class="sum-t">خلاصه</h2><p class="sum-s">${scopeTitle(st.view==='compare')}</p>
    ${sdetHtml(h)}
    <p class="smsg">${h.msg}</p>
    <h3 class="sh">نزدیک به تارگت</h3><div>${nearH}</div>`;
}

// vChart: نمودار ستونی عمودی؛ items لیست {label,pct,act,tip,on} و dom حداکثر محور (مثلاً ۱٫۵ = ۱۵۰٪) است.
// ارتفاع هر ستون نسبت به dom به درصد حساب می‌شود؛ خطوط افقی راهنما: خط برنامه (PACE) و تارگت ۱۰۰٪.
// وقتی محصولی انتخاب شده، ستون‌های دیگر کم‌رنگ (dim) می‌شوند. کلیک با data-act و راهنما با data-tip انجام می‌شود.
function vChart(items,dom){
  // برچسب‌های محور عمودی هر ۵۰٪ (۰٫۵) گذاشته می‌شود.
  const ticks=[];for(let t=0;t<=dom+1e-9;t+=0.5)ticks.push(t);
  const sel=st.product!=='all';
  return `<div class="vscroll"><div class="vchart">
    <div class="yax">${ticks.map(t=>`<span class="num" style="bottom:${t/dom*100}%">${pc(t)}</span>`).join('')}</div>
    <div class="plot">${ticks.map(t=>`<i class="gl" style="bottom:${t/dom*100}%"></i>`).join('')}
      <i class="ln p" style="bottom:${PACE/dom*100}%"></i><i class="ln" style="bottom:${1/dom*100}%"></i>
      <div class="cols">${items.map(x=>{const h=Math.min(x.pct,dom)/dom*100;return `<div class="slot st-${stOf(x.pct)}${sel&&!x.on?' dim':''}" role="button" tabindex="0" data-act="${x.act}" data-tip="${x.tip}" aria-label="${x.label}: ${pc(x.pct)}"><span class="val num" style="bottom:calc(${h}% + 4px)">${pc(x.pct)}</span><i class="bar" style="height:${h}%"></i></div>`}).join('')}</div></div>
    <div class="names">${items.map(x=>`<span>${x.label}</span>`).join('')}</div></div></div>`;
}

/* ---------- overview ---------- */
// viewOverview: دو پنل؛ ۱) تحقق به تفکیک محصول (نمودار ستونی عمودی) ۲) تحقق به تفکیک ویزیتور (نوارهای افقی با barRow).
// کلیک روی هر ستون/ردیف، فیلتر کل صفحه را عوض می‌کند و کلیک دوباره آن را برمی‌دارد.
function viewOverview(){
  // برای هر محصول جمع فروش و تارگت؛ محصولی که تارگت ندارد (t=0) حذف می‌شود.
  const prs=PRODUCTS.map(p=>({p,a:agg(scopeRows(['product']).filter(r=>r.product===p))})).filter(x=>x.a.t>0);
  // domOf حداکثر محور را از بیشترین درصد به دست می‌آورد تا ستون‌ها از کادر بیرون نزنند.
  const dP=domOf(prs.map(x=>x.a.pct));
  // پنل محصولات: ستون‌ها با vChart کشیده می‌شوند و tip متن راهنمای هر ستون است.
  const panelP=`<section class="panel"><h3>به تفکیک محصول</h3><p class="sub">روی ستون هر محصول بزنید تا کل صفحه روی همان محصول فیلتر شود. دوباره بزنید تا فیلتر برداشته شود.</p>
    ${barLegend()}
    ${vChart(prs.map(x=>({label:x.p,pct:x.a.pct,act:'p:'+x.p,on:st.product===x.p,a:x.a,
      tip:`${x.p}|فروش: ${n(x.a.s)} از ${n(x.a.t)}|${x.a.rem>0?'کسری: '+n(x.a.rem):'بالاتر از تارگت: '+n(x.a.over)}`})),dP)}<p class="vscroll-hint">برای دیدن همه محصولات، نمودار را به چپ و راست بکشید.</p></section>`;

  // ویزیتورهای شعبه انتخابی؛ درصد هر ویزیتور: در حالت «همه محصولات» میانگین تحقق محصولات، وگرنه تحقق همان محصول. نزولی مرتب می‌شود.
  const vs=visitors.filter(v=>st.branch==='all'||v.branch===st.branch).map(v=>{
    const vr=rows.filter(r=>r.code===v.code&&(st.product==='all'||r.product===st.product));
    return {v,pct:st.product==='all'?meanPct(vr):agg(vr).pct,a:agg(vr)}}).sort((x,y)=>y.pct-x.pct);
  const dV=domOf(vs.map(x=>x.pct));
  // پنل ویزیتورها: نوارهای افقی (barRow) با رنگ هم‌معنی نمودار بالا.
  const panelV=`<section class="panel"><h3>به تفکیک ویزیتور</h3><p class="sub">${st.product==='all'?'درصد هر ویزیتور، میانگین تحقق همه محصولاتش است.':'تحقق هر ویزیتور در '+st.product+'.'} روی یک ویزیتور بزنید تا فیلتر شود. رنگ‌ها مثل نمودار بالا هستند.</p>
    ${vs.map(x=>barRow({label:x.v.name,sub:st.product==='all'?'شعبه '+x.v.branch:`${n(x.a.s)} از ${n(x.a.t)} · شعبه ${x.v.branch}`,pct:x.pct,dom:dV,act:'v:'+x.v.code,on:st.visitor===x.v.code,
      tip:`${x.v.name}|شعبه ${x.v.branch}|${st.product==='all'?'میانگین تحقق: '+pc(x.pct):'فروش: '+n(x.a.s)+' از '+n(x.a.t)}`})).join('')}</section>`;
  return panelP+panelV;
}

/* ---------- compare ---------- */
// viewCompare: صفحه مقایسه ویزیتورها شامل رتبه‌بندی، نقشه حرارتی ویزیتور×محصول و مقایسه مستقیم (head-to-head).
function viewCompare(){
  const vis=visitors.filter(v=>st.branch==='all'||v.branch===st.branch);
  // رتبه‌بندی: ویزیتورها بر اساس درصد تحقق به صورت نزولی مرتب می‌شوند.
  const rk=vis.map(v=>{const vr=rows.filter(r=>r.code===v.code&&(st.product==='all'||r.product===st.product));return{v,pct:st.product==='all'?meanPct(vr):agg(vr).pct,a:agg(vr)}}).sort((a,b)=>b.pct-a.pct);
  const dR=domOf(rk.map(x=>x.pct));
  // پنل رتبه‌بندی؛ انتخاب با data-act='c:کد' برای افزودن/حذف از فهرست مقایسه (st.cmp) است.
  const rank=`<section class="panel"><h3>رتبه‌بندی ویزیتورها: ${st.product==='all'?'میانگین همه محصولات':st.product}</h3>
    <p class="sub">محصول و شعبه را از بالای صفحه عوض کنید. ویزیتورها را برای مقایسه مستقیم (تا ۳ نفر) انتخاب کنید.</p>${barLegend()}
    ${rk.map((x,i)=>barRow({label:`${nf0.format(i+1)}. ${x.v.name}`,sub:st.product==='all'?'شعبه '+x.v.branch:`${n(x.a.s)} از ${n(x.a.t)} · ${x.v.branch}`,pct:x.pct,dom:dR,act:'c:'+x.v.code,on:st.cmp.includes(x.v.code),
      tip:`${x.v.name}|شعبه ${x.v.branch}|تحقق: ${pc(x.pct)}|${st.cmp.includes(x.v.code)?'انتخاب‌شده برای مقایسه':'برای مقایسه کلیک کنید'}`})).join('')}</section>`;

  // نقشه حرارتی: ستون‌ها محصولات و ردیف‌ها ویزیتورها (گروه‌بندی شعبه) هستند؛ هر خانه درصد تحقق و رنگ آن وضعیت نسبت به خط برنامه است.
  const hv=visitors.filter(v=>st.branch==='all'||v.branch===st.branch);
  let cells=`<div class="h"></div>${PRODUCTS.map(p=>`<div class="h">${p}</div>`).join('')}<div class="h">میانگین</div>`;
  BRANCHES.filter(b=>st.branch==='all'||b===st.branch).forEach(b=>{
    cells+=`<div class="br">شعبه ${b}</div>`;
    hv.filter(v=>v.branch===b).forEach(v=>{
      cells+=`<div class="n">${v.name}</div>`;
      const vr=rows.filter(r=>r.code===v.code);
      PRODUCTS.forEach(p=>{const r=vr.find(x=>x.product===p);
        if(!r){cells+='<div class="cell">-</div>';return}
        // q نسبت فروش به تارگت همان خانه است؛ stOf وضعیت رنگ را مشخص می‌کند و عدد همیشه کنار رنگ نوشته می‌شود (دسترس‌پذیری).
        const q=r.sales/r.target;
        cells+=`<div class="cell st-${stOf(q)} num" data-tip="${v.name}|${p}|فروش: ${n(r.sales)} از ${n(r.target)}|${label(q)}">${pc(q)}</div>`});
      const m=meanPct(vr);cells+=`<div class="cell avg num">${pc(m)}</div>`})});
  const heat=`<section class="panel"><h3>نقشه حرارتی ویزیتور در محصول</h3><p class="sub">هر خانه درصد تحقق یک ویزیتور در یک محصول است. رنگ، وضعیت نسبت به خط برنامه را نشان می‌دهد و عدد همیشه کنار آن نوشته شده است.</p>
    <div class="hm"><div class="hmg" style="grid-template-columns:minmax(150px,1.6fr) repeat(${PRODUCTS.length},minmax(64px,1fr)) minmax(70px,.9fr)">${cells}</div></div></section>`;

  // دکمه‌های انتخاب ویزیتور برای مقایسه؛ هر ویزیتور انتخاب‌شده رنگ سری خودش (--s1..--s3) را می‌گیرد.
  const picks=visitors.map(v=>{const i=st.cmp.indexOf(v.code);
    return `<button type="button" class="pk" aria-pressed="${i>=0}" data-act="c:${v.code}" ${i>=0?`style="border-color:var(--s${i+1})"`:''}>${i>=0?`<span class="dot" style="background:var(--s${i+1})"></span> `:''}${v.name}<small>${v.branch}</small></button>`}).join('');
  // مقایسه مستقیم: با کمتر از ۲ ویزیتور پیام راهنما و در غیر این صورت نوارهای هر محصول برای هر ویزیتور نمایش داده می‌شود.
  let h2h='';
  if(st.cmp.length<2){h2h=`<p class="empty">حداقل دو ویزیتور را انتخاب کنید.</p>`}
  else{
    const sel=st.cmp.map(c=>visitors.find(v=>v.code===c));
    // get: نسبت فروش به تارگت یک ویزیتور در یک محصول؛ اگر ردیفی نباشد صفر برمی‌گرداند.
    const get=(c,p)=>{const r=rows.find(x=>x.code===c&&x.product===p);return r?r.sales/r.target:0};
    const all=[];PRODUCTS.forEach(p=>sel.forEach(v=>all.push(get(v.code,p))));
    // dom مشترک برای همه نوارها تا مقایسه عادلانه باشد؛ wins شمار محصولاتی است که هر ویزیتور در آن‌ها بالاترین درصد را دارد.
    const dom=domOf(all);const wins={};sel.forEach(v=>wins[v.code]=0);
    // برای هر محصول برنده (بالاترین درصد) پیدا و به شمار برد او اضافه می‌شود؛ برچسب «برتر» کنار برنده می‌آید.
    const win={};PRODUCTS.forEach(p=>{let best=-1,bc=null;sel.forEach(v=>{const q=get(v.code,p);if(q>best){best=q;bc=v.code}});win[p]=bc;wins[bc]++});
    // کارت‌های خلاصه برد هر ویزیتور و سپس نوارهای هر محصول. خط عمودی تیره (mk) نشان‌دهنده تارگت ۱۰۰٪ است.
    h2h=`<div class="wins">${sel.map((v,i)=>`<div class="win" style="--c:var(--s${i+1})"><b class="num">${nf0.format(wins[v.code])} از ${nf0.format(PRODUCTS.length)}</b><small>${v.name}: محصولی که در آن بالاتر است. میانگین تحقق ${pc(meanPct(rows.filter(r=>r.code===v.code)))}</small></div>`).join('')}</div>`+
    PRODUCTS.map(p=>`<div class="grp"><b>${p}</b><div class="hb">${sel.map((v,i)=>{const q=get(v.code,p),r=rows.find(x=>x.code===v.code&&x.product===p);
      return `<div class="hr" style="--c:var(--s${i+1})" data-tip="${v.name}|${p}|فروش: ${n(r.sales)} از ${n(r.target)}"><div class="bt"><div class="f" style="width:${Math.min(100,q/dom*100)}%"></div><i class="mk" style="inset-inline-start:${1/dom*100}%"></i></div><span class="num">${pc(q)}${win[p]===v.code?'<span class="crown">برتر</span>':''}</span></div>`}).join('')}</div></div>`).join('');
  }
  const h2hP=`<section class="panel"><h3>مقایسه مستقیم تا ۳ ویزیتور</h3><p class="sub">خط عمودی تیره، تارگت ۱۰۰٪ است. رنگ هر ویزیتور با نقطه کنار نامش در فهرست زیر مشخص شده.</p>
    <div class="pick">${picks}</div>${h2h}</section>`;
  return rank+heat+h2hP;
}

/* ---------- target ---------- */
// viewTarget: صفحه شکاف تارگت. برای هر محصول: کسری تا تارگت، لازم در روز، سرعت فعلی و پیش‌بینی پایان ماه.
function viewTarget(){
  const prods=st.product==='all'?PRODUCTS:[st.product];
  // کارت هر محصول؛ ring حلقه درصد کوچک و pill برچسب وضعیت است.
  const cards=prods.map(p=>{const rs=scopeRows(['product']).filter(r=>r.product===p);if(!rs.length)return'';
    // cur سرعت فروش روزانه تا امروز (فروش ÷ روز سپری‌شده E)؛ need فروش روزانه لازم برای رسیدن به تارگت (کسری ÷ روز مانده R)؛
    // proj پیش‌بینی نهایی ماه با ادامه همین سرعت (cur × T ÷ تارگت).
    const a=agg(rs),cur=a.s/E,need=a.rem/R,proj=(cur*T)/a.t;
    return `<article class="pc st-${stOf(a.pct)}${a.pct>=1?' done':''}"><div class="top"><div class="mini">${ring(a.pct,40,12)}<b class="num">${pc(a.pct)}</b></div>
      <div><h3>${p}</h3><div class="sm num">${n(a.s)} از ${n(a.t)} واحد</div>${pill(a.pct)}</div></div>
      <div class="need"><div><small>${a.rem>0?'کسری تا تارگت':'بالاتر از تارگت'}</small><b class="num">${n(a.rem>0?a.rem:a.over)}</b></div><div><small>لازم در روز</small><b class="num">${n(need)}</b></div>
      <div><small>سرعت فعلی در روز</small><b class="num">${n(cur)}</b></div><div><small>پیش‌بینی پایان ماه</small><b class="num">${pc(proj)}</b></div></div>
      <p class="say">${pushMsg(a)}</p></article>`}).join('');

  const rs=scopeRows();
  // فهرست «نزدیک به تارگت» (۶۰٪ تا زیر ۱۰۰٪، حداکثر ۸) و «تارگت‌زن‌ها» (۱۰۰٪ به بالا، حداکثر ۸)، هر دو به ترتیب نسبت فروش به تارگت.
  const near=rs.filter(r=>r.sales<r.target&&r.sales/r.target>=0.6).sort((a,b)=>b.sales/b.target-a.sales/a.target).slice(0,8);
  const champ=rs.filter(r=>r.sales>=r.target).sort((a,b)=>b.sales/b.target-a.sales/a.target).slice(0,8);
  const nearH=near.length?near.map(r=>`<div class="li" role="button" tabindex="0" data-act="v:${r.code}" data-tip="${r.visitor}|${r.product}|فروش: ${n(r.sales)} از ${n(r.target)}"><div><b>${r.visitor}</b><small>${r.product} · شعبه ${r.branch}</small></div><div class="r num">${n(r.target-r.sales)} واحد<small>روزی ${n((r.target-r.sales)/R)} · ${pc(r.sales/r.target)}</small></div></div>`).join(''):'<p class="empty">موردی بین ۶۰ تا ۱۰۰٪ نیست.</p>';
  const chH=champ.length?champ.map(r=>`<div class="li" role="button" tabindex="0" data-act="v:${r.code}" data-tip="${r.visitor}|${r.product}|فروش: ${n(r.sales)} از ${n(r.target)}"><div><b>${r.visitor}</b><small>${r.product} · شعبه ${r.branch}</small></div><div class="r num">${pc(r.sales/r.target)}<small>${n(r.sales-r.target)} واحد بالاتر</small></div></div>`).join(''):'<p class="empty">هنوز کسی در این بخش تارگت را نزده است.</p>';

  return `<section class="panel"><h2>${scopeTitle()}</h2><p class="sub">تا پایان اکتبر ${nf0.format(R)} روز مانده. «لازم در روز» یعنی برای رسیدن به تارگت، هر روز چقدر باید بفروشید. «سرعت فعلی» میانگین فروش روزانه ${nf0.format(E)} روز گذشته است.</p>
    <div class="cards">${cards}</div></section>
    <div class="lists"><section class="panel"><h3>نزدیک به تارگت</h3><p class="sub">ویزیتور و محصول‌هایی که بین ۶۰ تا ۱۰۰٪ هستند. با چند فروش دیگر تارگت می‌خورد.</p>${nearH}</section>
    <section class="panel"><h3>تارگت‌زن‌ها</h3><p class="sub">بیشترین تحقق در محدوده انتخاب‌شده.</p>${chH}</section></div>`;
}

// ==========================================================================
// صفحه پورسانت (Commission)
// داده از D.comm می‌آید: شعب، سرپرست هر شعبه، ویزیتورها و اجزای پورسانت هر گروه محصول.
// محاسبه: پورسانت هر ویزیتور = جمع اجزای گروه‌ها + بسته‌بندی قوطی + بسته‌بندی شیشه؛
// «پورسانت نهایی» (final) مقدار ثبت‌شده در فایل اکسل است و تفاوتش با جمع اجزا به صورت
// «کسورات و تعدیل» (adj = final − sum) نشان داده می‌شود. پورسانت سرپرست در فایل ۱٫۳ × میانگین
// پورسانت نهایی ویزیتورهای شعبه است. مبالغ فایل به ریال است؛ ریال ÷ ۱۰ = تومان و برای نمایش
// به میلیون تومان (÷ ۱۰٬۰۰۰٬۰۰۰) تبدیل می‌شود.
// ==========================================================================
/* ---------- commission ---------- */
// قالب‌بندی: nf2 عدد با حداکثر دو رقم اعشار فارسی. mf مبلغ ریال را به میلیون تومان می‌برد (x÷1e7، چون ریال÷۱۰=تومان و تومان÷۱e6=میلیون)؛
// زیر یک میلیون دو رقم اعشار و بالاتر یک رقم اعشار نشان می‌دهد. fullN ریال را به تومان کامل (÷۱۰) با واژه «تومان» می‌نویسد.
// isN بررسی می‌کند مقدار عدد معتبر است (نه متن، نه NaN/Infinity، مثلاً #N/A اکسل).
const nf2=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2}),mf=x=>{const v=x/1e7;return Math.abs(v)<1?nf2.format(v):nf1.format(v)},fullN=x=>nf0.format(Math.round(x/10))+' تومان',isN=x=>typeof x==='number'&&isFinite(x);
// آیکن‌های اختصاصی این صفحه (کیف پول، مدال، تاج) به جدول مشترک IC_ اضافه می‌شود.
Object.assign(IC_,{wallet:'<path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V7zM4 7l11-3v3M16 14h2"/>',award:'<circle cx="12" cy="9" r="5"/><path d="M9 13.5L8 21l4-2 4 2-1-7.5"/>',crown:'<path d="M4 8l4 4 4-6 4 6 4-4-2 10H6L4 8z"/>'});
// compList: فهرست اجزای پورسانت = گروه‌های محصول (رنگ --k1..--k6) به‌علاوه بسته‌بندی قوطی (can) و شیشه (glass).
function compList(){
  const gs=(D.comm&&D.comm.groups)||[];
  return gs.map((g,i)=>({k:g,t:g,c:i<6?`var(--k${i+1})`:'var(--muted)'})).concat([{k:'can',t:'بسته‌بندی قوطی',c:'var(--k7)'},{k:'glass',t:'بسته‌بندی شیشه',c:'var(--k8)'}]);
}
// amtsOf: مبلغ‌های یک ویزیتور را برمی‌گرداند؛ a مبلغ هر گروه، c قوطی، l شیشه. sum جمع همه اجزا، fin مبلغ نهایی فایل
// (null اگر خطای #N/A باشد)، adj تفاوت نهایی با جمع و known یعنی نهایی معتبر است.
function amtsOf(v){
  const gs=D.comm.groups,parts={},canBy={},glBy={};let sum=0,can=0,glass=0;
  gs.forEach(g=>{const x=v.g[g],a=x&&isN(x.a)?x.a:0;parts[g]=a;sum+=a;
    if(x&&isN(x.c)&&x.c){can+=x.c;canBy[g]=x.c}
    if(x&&isN(x.l)&&x.l){glass+=x.l;glBy[g]=x.l}});
  parts.can=can;parts.glass=glass;sum+=can+glass;
  const fin=isN(v.final)?v.final:null;
  return{parts,sum,fin,adj:fin==null?null:fin-sum,canBy,glBy,known:fin!=null};
}
// commScope: شعبه‌های داخل فیلتر فعلی (همه یا یک شعبه).
const commScope=()=>D.comm.branches.filter(b=>st.branch==='all'||b.name===st.branch);
// commVisitors: فهرست تخت {شعبه، ویزیتور، مبالغ} برای شعبه‌های داده‌شده.
const commVisitors=bs=>{const o=[];bs.forEach(b=>b.visitors.forEach(v=>o.push({b,v,a:amtsOf(v)})));return o};
// commMode: جزء انتخاب‌شده برای فیلتر (st.comp)؛ اگر معتبر نباشد حالت «all» یعنی همه اجزا.
const commMode=comps=>comps.some(c=>c.k===st.comp)?st.comp:'all';
// noComm: پیام زمانی که داده پورسانت وجود ندارد یا خوانده نشده (D.commWarn دلیل خطا).
const noComm=()=>`<section class="panel"><h3>پورسانت</h3><p class="empty">${D.commWarn?'اطلاعات پورسانت خوانده نشد: '+D.commWarn:'اطلاعات پورسانت در این داده نیست.'} فایل اکسلی را بارگزاری کنید که شیت‌های «پورسانت» هر چهار شعبه را دارد.</p></section>`;

// statsHtml: کارت‌های آمار بالای صفحه؛ در صفحه قیمت/پوشش/NC خالی، در پورسانت commStats و در بقیه آمار فروش.
function statsHtml(){return st.view==='price'||st.view==='cov'||st.view==='nc'?'':st.view==='commission'?commStats():statsHtmlSales()}
// summaryHtml: انتخاب کارت خلاصه سمت صفحه بر اساس نمای فعلی.
function summaryHtml(){return st.view==='nc'?ncSummary():st.view==='cov'?covSummary():st.view==='price'?priceSummary():st.view==='commission'?commSummary():summaryHtmlSales()}

// commStats: چهار کارت؛ جمع پورسانت نهایی، میانگین هر ویزیتور، پورسانت سرپرستان و بیشترین پورسانت.
// ویزیتوری که نهایی‌اش نامعلوم است در جمع و میانگین حساب نمی‌شود و فقط تعدادش اعلام می‌شود.
function commStats(){
  if(!D.comm)return'';
  const bs=commScope(),vs=commVisitors(bs),kn=vs.filter(x=>x.a.known),miss=vs.length-kn.length;
  const tot=kn.reduce((s,x)=>s+x.a.fin,0),avg=kn.length?tot/kn.length:0;
  const sups=bs.map(b=>b.sup).filter(s=>isN(s.final)),supTot=sups.reduce((s,x)=>s+x.final,0);
  const top=kn.slice().sort((a,b)=>b.a.fin-a.a.fin)[0];
  const card=(i,v,t,extra)=>`<div class="stat"><span class="si">${ic(IC_[i])}</span><b class="num">${v}</b><small>${t}</small>${extra?`<small class="warnc">${extra}</small>`:''}</div>`;
  return card('wallet',kn.length?mf(tot):'-','جمع پورسانت نهایی ویزیتورها (میلیون تومان)',miss?nf0.format(miss)+' ویزیتور بدون اطلاعات':'')
    +card('users',kn.length?mf(avg):'-','میانگین هر ویزیتور (میلیون تومان)')
    +card('crown',sups.length?mf(supTot):'-',(bs.length>1?'پورسانت سرپرستان':'پورسانت سرپرست')+' (میلیون تومان)',sups.length<bs.length?nf0.format(bs.length-sups.length)+' سرپرست نامشخص':'')
    +card('award',top?mf(top.a.fin):'-',top?'بیشترین: '+top.v.name:'بیشترین پورسانت');
}

// commSummary: دونات ترکیب پورسانت (سهم هر جزء از جمع) + فهرست اجزا + ۴ ویزیتور برتر.
function commSummary(){
  if(!D.comm)return'';
  // اگر ویزیتوری انتخاب شده باشد فقط او، وگرنه همه ویزیتورهای محدوده.
  const comps=compList(),mode=commMode(comps),bs=commScope(),vs=commVisitors(bs);
  const sel=st.visitor!=='all'?vs.find(x=>x.v.code===st.visitor):null,set=sel?[sel]:vs;
  // tot جمع هر جزء، ssum جمع همه اجزا، fin جمع نهایی‌ها و adj جمع تعدیل‌ها.
  const tot={};let ssum=0,fin=0,adj=0;
  set.forEach(x=>{comps.forEach(c=>{tot[c.k]=(tot[c.k]||0)+(x.a.parts[c.k]||0)});ssum+=x.a.sum;if(x.a.known){fin+=x.a.fin;adj+=x.a.adj}});
  // هر جزء با مبلغ بزرگ‌تر از صفر یک کمان دونات می‌شود؛ r شعاع و C محیط دایره است.
  const segs=comps.filter(c=>tot[c.k]>0),r=42,C=2*Math.PI*r;let off=0;
  // طول کمان = سهم جزء × محیط. فاصله کوچک g بین کمان‌ها گذاشته می‌شود و با dashoffset کمان‌ها پشت سر هم قرار می‌گیرند.
  // وقتی یک جزء انتخاب شده، بقیه کم‌رنگ (opacity ۰٫۲۵) می‌شوند.
  const arcs=segs.map(c=>{const len=tot[c.k]/ssum*C,g=segs.length>1?1.5:0,d=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${c.c}" stroke-width="10" stroke-dasharray="${Math.max(len-g,0.01)} ${C}" stroke-dashoffset="${-off}" opacity="${mode==='all'||mode===c.k?1:.25}"/>`;off+=len;return d}).join('');
  // مرکز دونات: پورسانت نهایی به میلیون تومان.
  const donut=`<div class="donut"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/>${arcs}</svg><div class="c"><b class="num" style="font-size:27px">${ssum>0?mf(fin):'۰'}</b><small>میلیون تومان<br>پورسانت نهایی</small></div></div>`;
  const title=(st.branch==='all'?'همه شعب':'شعبه '+st.branch)+(sel?' · '+sel.v.name:'');
  // فهرست اجزا؛ کلیک (data-act='k:...') همان جزء را فیلتر می‌کند. ردیف «کسورات و تعدیل» فقط وقتی اختلاف ≥ ۱ باشد می‌آید.
  const list=segs.length?segs.map(c=>`<div class="cl${mode===c.k?' on':''}" role="button" tabindex="0" data-act="k:${c.k}" data-tip="${c.t}|${fullN(tot[c.k])}|${nf0.format(Math.round(tot[c.k]/ssum*100))}٪ از جمع اجزا"><span class="dot" style="background:${c.c}"></span><b>${c.t}</b><em class="num">${mf(tot[c.k])}</em><small class="num">${nf0.format(Math.round(tot[c.k]/ssum*100))}٪</small></div>`).join('')
    +(Math.abs(adj)>=1?`<div class="cl adj" data-tip="کسورات و تعدیل|تفاوت پورسانت نهایی با جمع اجزا در فایل"><span class="dot" style="background:var(--muted)"></span><b>کسورات و تعدیل</b><em class="num">${adj<0?'−':'+'}${mf(Math.abs(adj))}</em><small></small></div>`:''):'<p class="empty">پورسانتی برای این انتخاب ثبت نشده است.</p>';
  // چهار ویزیتور با بیشترین پورسانت نهایی (فقط آن‌هایی که نهایی‌شان معلوم است).
  const top=vs.filter(x=>x.a.known).sort((a,b)=>b.a.fin-a.a.fin).slice(0,4).map(x=>`<div class="bl2" role="button" tabindex="0" data-act="v:${x.v.code}" data-tip="${x.v.name}|شعبه ${x.b.name}|${fullN(x.a.fin)}"><div><b>${x.v.name}</b><small>شعبه ${x.b.name}</small></div><em class="num">${mf(x.a.fin)}</em></div>`).join('');
  return `${donut}<h2 class="sum-t">ترکیب پورسانت</h2><p class="sum-s">${title}</p><div class="clist">${list}</div><h3 class="sh">بیشترین پورسانت</h3><div>${top||'<p class="empty">داده‌ای نیست.</p>'}</div>`;
}

// commDetail: جزئیات یک ویزیتور؛ ردیف هر جزء با نوار نسبی، تحقق گروه، کسورات و پورسانت نهایی، رتبه در شعبه و سهم از جمع شعبه.
function commDetail(comps,vs){
  const x=vs.find(y=>y.v.code===st.visitor);
  if(!x)return `<section class="panel"><h3>جزئیات ویزیتور</h3><p class="empty">برای این ویزیتور در شیت‌های پورسانت ردیفی پیدا نشد.</p></section>`;
  // maxP بزرگ‌ترین مبلغ جزء است تا نوارها نسبت به آن مقیاس شوند.
  const {v,b,a}=x,gs=D.comm.groups,maxP=Math.max(1,...comps.map(c=>a.parts[c.k]||0));
  // رتبه در شعبه: ویزیتورهای معتبر نزولی مرتب و جایگاه همین ویزیتور پیدا می‌شود؛ nk تعداد ویزیتورهای معتبر شعبه.
  const rank=b.visitors.map(u=>amtsOf(u)).filter(u=>u.known).sort((p,q)=>q.fin-p.fin).findIndex(u=>u.fin===a.fin)+1,nk=b.visitors.filter(u=>isN(u.final)).length;
  // bsum جمع پورسانت نهایی شعبه برای محاسبه سهم ویزیتور.
  const bsum=b.visitors.reduce((s,u)=>s+(isN(u.final)?u.final:0),0);
  // یک ردیف برای هر جزء؛ برای قوطی/شیشه به‌جای درصد تحقق، تفکیک مبلغ بر اساس گروه محصول نمایش داده می‌شود.
  const rowsH=comps.map(c=>{
    const amt=a.parts[c.k]||0,g=v.g[c.k];let sub='',pill='';
    if(g&&isN(g.p))pill=`<span class="pp st-${stOf(g.p)}"><i></i>تحقق ${pc(g.p)}</span>`;
    if(c.k==='can'||c.k==='glass'){const by=c.k==='can'?a.canBy:a.glBy,ks=Object.keys(by);sub=ks.length?ks.map(k=>`${k}: ${mf(by[k])}`).join(' · '):'برای اورجینال و هی جو؛ این ماه چیزی ثبت نشده';}
    return `<div class="dr${mode(c)}" role="button" tabindex="0" data-act="k:${c.k}" data-tip="${c.t}|${fullN(amt)}"><span class="dot" style="background:${c.c}"></span><span class="nm">${c.t} ${pill}</span><b class="am num">${mf(amt)}</b><span class="bar2"><i style="width:${amt/maxP*100}%;background:${c.c}"></i></span>${sub?`<small>${sub}</small>`:''}</div>`;
  }).join('');
  // کلاس «on» برای جزء انتخاب‌شده.
  function mode(c){return st.comp===c.k?' on':''}
  // ردیف کسورات و تعدیل (منفی) فقط اگر اختلاف قابل‌توجه باشد.
  const adjH=a.known&&Math.abs(a.adj)>=1?`<div class="dr adj"><span class="dot" style="background:var(--muted)"></span><span class="nm">کسورات و تعدیل <small style="display:inline">(تفاوت با جمع اجزا در فایل)</small></span><b class="am num" style="color:var(--bad-t)">−${mf(Math.abs(a.adj))}</b></div>`:'';
  // پورسانت نهایی؛ در صورت خطای #N/A در فایل پیام خطا نشان داده می‌شود.
  const finH=a.known?`<div class="dfin"><span>پورسانت نهایی</span><b class="num" style="font-size:24px">${mf(a.fin)} <small style="font-size:12px;font-weight:500">میلیون تومان</small></b></div>`:`<div class="dfin"><span>پورسانت نهایی</span><b style="color:var(--serious)">در فایل خطا دارد (#N/A)</b></div>`;
  return `<section class="panel det"><div class="dh"><div><h3>${v.name}</h3><p class="sub" style="margin:0">شعبه ${b.name} · سرپرست: ${b.sup.name}${a.known?` · رتبه ${nf0.format(rank)} از ${nf0.format(nk)} در شعبه`:''}</p></div>${a.known&&bsum?`<div class="tsum"><small>سهم از جمع پورسانت شعبه</small><b class="num">${nf0.format(Math.round(a.fin/bsum*100))}٪</b></div>`:''}</div>
    <div class="dl">${rowsH}${adjH}</div>${finH}</section>`;
}

// commTable: جدول جزئیات به میلیون تومان؛ ردیف هر ویزیتور، سپس جمع ویزیتورهای شعبه و ردیف سرپرست.
// پس‌زمینه هر خانه با color-mix متناسب با نسبت مبلغ به بیشینه همان ستون پررنگ می‌شود (نقشه حرارتی).
function commTable(bs,comps,mode){
  // colMax بیشینه هر ستون برای شدت رنگ؛ حداقل ۱ تا تقسیم بر صفر نشود.
  const all=commVisitors(bs),colMax={};comps.forEach(c=>{colMax[c.k]=Math.max(1,...all.map(x=>x.a.parts[c.k]||0))});
  // وقتی یک جزء انتخاب شده، ستون‌های دیگر کم‌رنگ می‌شوند (کلاس cdim).
  const dim=c=>mode!=='all'&&mode!==c.k?' cdim':'';
  const head=`<tr><th>ویزیتور</th>${comps.map(c=>`<th class="${dim(c).trim()}"><span class="dot" style="background:${c.c}"></span> ${c.t}</th>`).join('')}<th>تعدیل</th><th>نهایی</th></tr>`;
  let body='';
  // برای هر شعبه: سطر عنوان، ردیف ویزیتورها (نزولی بر اساس نهایی)، جمع و سرپرست.
  bs.forEach(b=>{
    body+=`<tr class="gr"><td colspan="${comps.length+3}">شعبه ${b.name} · سرپرست: ${b.sup.name}</td></tr>`;
    // ویزیتورهای بدون نهایی (-1) آخر لیست می‌افتند؛ tadj و tfin جمع تعدیل و نهایی شعبه‌اند.
    const tot={},rowsV=b.visitors.map(v=>({v,a:amtsOf(v)})).sort((p,q)=>(q.a.fin??-1)-(p.a.fin??-1));let tadj=0,tfin=0;
    rowsV.forEach(({v,a})=>{
      // سلول هر جزء؛ در همین حلقه جمع ستون (tot) هم ساخته می‌شود.
      const cells=comps.map(c=>{const m=a.parts[c.k]||0;tot[c.k]=(tot[c.k]||0)+m;
        return `<td class="c${dim(c)}" style="${m>0?`background:color-mix(in srgb,${c.c} ${Math.round(m/colMax[c.k]*55)}%,var(--surface))`:''}">${m>0?mf(m):'<span class="z">۰</span>'}</td>`}).join('');
      if(a.known){tadj+=a.adj;tfin+=a.fin}
      // ردیف ویزیتور؛ ستون تعدیل با علامت − یا + و ستون نهایی (یا «نامشخص»).
      body+=`<tr class="vr${st.visitor===v.code?' on':''}" role="button" tabindex="0" data-act="v:${v.code}"><td>${v.name}</td>${cells}<td>${a.known?(Math.abs(a.adj)<1?'<span class="z">۰</span>':(a.adj<0?'−':'+')+mf(Math.abs(a.adj))):'-'}</td><td class="fin">${a.known?mf(a.fin):'<span class="z">نامشخص</span>'}</td></tr>`;
    });
    // ردیف جمع ویزیتورهای شعبه.
    body+=`<tr class="tot"><td>جمع ویزیتورها</td>${comps.map(c=>`<td class="${dim(c).trim()}">${mf(tot[c.k]||0)}</td>`).join('')}<td>${Math.abs(tadj)<1?'۰':(tadj<0?'−':'+')+mf(Math.abs(tadj))}</td><td class="fin">${mf(tfin)}</td></tr>`;
    // ردیف سرپرست؛ فقط پورسانت نهایی او (۱٫۳ × میانگین نهایی ویزیتورهای شعبه در فایل) نمایش داده می‌شود.
    body+=`<tr class="sr"><td>سرپرست: ${b.sup.name}</td>${comps.map(()=>'<td><span class="z">-</span></td>').join('')}<td><span class="z">-</span></td><td class="fin">${isN(b.sup.final)?mf(b.sup.final):'<span class="z">نامشخص</span>'}</td></tr>`;
  });
  return `<div class="tw"><table class="ctable">${head}${body}</table></div>`;
}

// viewCommission: صفحه اصلی پورسانت؛ مقدمه و راهنمای رنگ، کارت هر شعبه با نوار تقسیم‌بندی هر ویزیتور، جزئیات، جدول و نکته‌های محاسبه.
function viewCommission(){
  if(!D.comm)return noComm();
  // cm جزء انتخاب‌شده (در حالت all تعریف‌نشده).
  const comps=compList(),mode=commMode(comps),cm=comps.find(c=>c.k===mode),bs=commScope(),vsAll=commVisitors(bs);
  // val مقداری که طول نوار را تعیین می‌کند: در حالت all جمع اجزا، وگرنه مبلغ همان جزء.
  const val=a=>mode==='all'?a.sum:(a.parts[mode]||0);
  // mx بزرگ‌ترین مقدار برای مقیاس نوارها؛ در حالت all پورسانت نهایی سرپرستان هم لحاظ می‌شود تا نوار آن‌ها بیرون نزند.
  let mx=1;vsAll.forEach(x=>{mx=Math.max(mx,val(x.a))});if(mode==='all')bs.forEach(b=>{if(isN(b.sup.final))mx=Math.max(mx,b.sup.final)});
  // g0 نخستین گروه محصول؛ تحقق آن زیر نام هر ویزیتور نمایش داده می‌شود.
  const g0=D.comm.groups[0];
  // راهنمای رنگ اجزا و سرپرست.
  const leg=`<div class="cleg">${comps.map(c=>`<span><i class="sw" style="background:${c.c}"></i>${c.t}</span>`).join('')}<span><i class="sw" style="background:var(--accent)"></i>سرپرست (پورسانت نهایی)</span></div>`;
  // پنل مقدمه؛ عنوان و توضیح بسته به حالت (همه یا یک جزء) عوض می‌شود.
  const intro=`<section class="panel"><h3>${mode==='all'?'پورسانت ویزیتورها و سرپرستان':'پورسانت '+cm.t}</h3><p class="sub">${mode==='all'?'هر نوار، پورسانت یک ویزیتور را به اجزایش تقسیم می‌کند. عدد کنار نوار، پورسانت نهایی همان ویزیتور است. روی یک ردیف بزنید تا جزئیات ویزیتور باز شود.':'فقط سهم '+cm.t+' نشان داده می‌شود. دوباره روی همان گروه بزنید تا همه اجزا برگردند.'}</p>${leg}</section>`;
  // یک پنل برای هر شعبه (تیم).
  const teams=bs.map(b=>{
    // ترتیب ردیف‌ها: در حالت all بر اساس پورسانت نهایی و در غیر این صورت بر اساس مبلغ جزء انتخاب‌شده، نزولی.
    const rowsV=b.visitors.map(v=>({v,a:amtsOf(v)})).sort((p,q)=>mode==='all'?((q.a.fin??-1)-(p.a.fin??-1)):((q.a.parts[mode]||0)-(p.a.parts[mode]||0)));
    const kn=rowsV.filter(x=>x.a.known),tot=kn.reduce((s,x)=>s+x.a.fin,0),miss=rowsV.length-kn.length,sup=b.sup;
    // vRow: ردیف یک ویزیتور؛ نوار از قطعه‌هایی (sg) با flex متناسب با مبلغ هر جزء ساخته می‌شود.
    const vRow=x=>{
      const {v,a}=x,on=st.visitor===v.code,dim=st.visitor!=='all'&&!on,o=v.g[g0],sub=o&&isN(o.p)?`${g0}: تحقق ${pc(o.p)}`:'';
      let bar,txt;
      if(!a.known){bar='<span class="na">پورسانت این ویزیتور در فایل خطا دارد (#N/A)</span>';txt='<b>-</b>'}
      else{
        // قطعه‌های نوار: در حالت all یک قطعه به‌ازای هر جزء با مبلغ مثبت، در حالت تک‌جزء فقط یک قطعه. عرض کل نوار نسبت به mx است.
        const segs=mode==='all'?comps.filter(c=>a.parts[c.k]>0).map(c=>`<i class="sg" style="flex:${a.parts[c.k]} 1 0;background:${c.c}" data-tip="${v.name}|${c.t}: ${fullN(a.parts[c.k])}|${nf0.format(Math.round(a.parts[c.k]/a.sum*100))}٪ از جمع اجزا"></i>`).join('')
          :(a.parts[mode]>0?`<i class="sg" style="flex:1 1 0;background:${cm.c}"></i>`:'');
        bar=`<div class="sgs" style="width:${val(a)/mx*100}%">${segs}</div>`;
        txt=`<b class="num">${mf(mode==='all'?a.fin:(a.parts[mode]||0))}</b><small>میلیون تومان</small>`;
      }
      return `<div class="crow${on?' on':''}${dim?' dim':''}" role="button" tabindex="0" data-act="v:${v.code}" data-tip="${v.name}|پورسانت نهایی: ${a.known?fullN(a.fin):'نامشخص'}|برای جزئیات کلیک کنید"><div class="bl"><b>${v.name}</b><small>${sub}</small></div><div class="ctr">${bar}</div><div class="bv">${txt}</div></div>`;
    };
    // ردیف سرپرست (فقط در حالت all) با نوار پورسانت نهایی؛ اگر در فایل خطا باشد پیام «محاسبه نشده» می‌آید.
    const supRow=mode==='all'?`<div class="crow sup" data-tip="${sup.name}|سرپرست شعبه ${b.name}|${isN(sup.final)?'پورسانت: '+fullN(sup.final):'نامشخص'}|در فایل: ۱٫۳ × میانگین پورسانت نهایی ویزیتورها"><div class="bl"><b>${sup.name}</b><small>سرپرست</small></div><div class="ctr">${isN(sup.final)?`<div class="sgs" style="width:${sup.final/mx*100}%"><i class="sg sup"></i></div>`:'<span class="na">در فایل محاسبه نشده است (#N/A)</span>'}</div><div class="bv">${isN(sup.final)?`<b class="num">${mf(sup.final)}</b><small>میلیون تومان</small>`:'<b>-</b>'}</div></div>`:'';
    return `<section class="panel team"><div class="th"><div><h3>شعبه ${b.name}</h3><p class="sub" style="margin:0">سرپرست: ${sup.name} · ${nf0.format(b.visitors.length)} ویزیتور</p></div><div class="tsum"><small>جمع پورسانت نهایی ویزیتورها</small><b class="num">${mf(tot)}</b><small>میلیون تومان${miss?' · '+nf0.format(miss)+' ویزیتور بدون اطلاعات':''}</small></div></div>${supRow}${rowsV.map(vRow).join('')}</section>`;
  }).join('');
  // جزئیات ویزیتور فقط وقتی ویزیتوری انتخاب شده نمایش داده می‌شود.
  const detail=st.visitor!=='all'?commDetail(comps,vsAll):'';
  // جدول جزئیات به میلیون تومان.
  const table=`<section class="panel"><h3>جدول جزئیات</h3><p class="sub">مبلغ‌ها به میلیون تومان. هر چه رنگ خانه پررنگ‌تر باشد، آن ویزیتور در آن ستون پورسانت بیشتری گرفته است.</p>${commTable(bs,comps,mode)}</section>`;
  // نکته‌های محاسبه: توضیح تبدیل ریال به تومان (÷۱۰)، فرمول پورسانت سرپرست (۱٫۳ × میانگین)، تعدیل و رفتار #N/A.
  const note=`<section class="panel note"><h3>نکته‌های محاسبه</h3><ul><li>مبلغ‌ها در فایل اکسل به ریال است. در این صفحه به تومان (تقسیم بر ۱۰) تبدیل شده و به میلیون تومان نمایش داده می‌شود.</li><li>پورسانت سرپرست در فایل برابر ۱٫۳ × میانگین پورسانت نهایی ویزیتورهای شعبه است.</li><li>پورسانت نهایی هر ویزیتور در فایل معمولاً کمی کمتر از جمع اجزای آن است. این تفاوت با عنوان «کسورات و تعدیل» نشان داده می‌شود.</li><li>بسته‌بندی قوطی و شیشه فقط برای اورجینال و هی جو ثبت می‌شود.</li><li>ویزیتوری که در شیت پورسانت خطای #N/A دارد، در جمع‌ها حساب نمی‌شود و «نامشخص» نوشته می‌شود.</li></ul></section>`;
  return intro+detail+teams+table+note;
}

// ==========================================================================
// صفحه لیست قیمت + ماشین‌حساب قیمت
// داده از D.price (شیت «anbar» اکسل) می‌آید؛ همه قیمت‌ها به ریال است.
// - ستون «خروجی» (out) فقط در نمای مدیریت دیده می‌شود و در نمای تیم (D.team) پنهان است؛
//   در حالت تیم حتی کلید out از داده حذف می‌شود (stripOut) و مرتب‌سازی روی آن هم لغو می‌شود.
// - منطق انقضا و موجودی: کالایی که تا انقضایش ۹۰ روز یا کمتر مانده «نزدیک انقضا» حساب می‌شود؛
//   برای آن موجودی انبار در راهنمای تاریخ نشان داده می‌شود و منقضی‌ها با برچسب «منقضی» مشخص می‌شوند.
// - ماشین‌حساب (آینه شیت calculator): سفارش اصلی + دو ردیف اشانتیون؛ درصد هزینه = ارزش اشانتیون ÷ ارزش کل؛
//   اگر از ۲۵٪ بیشتر باشد هشدار می‌دهد.
// ==========================================================================
/* ---------- price list + calculator ---------- */
// escH: فرار از کاراکترهای HTML برای جلوگیری از تزریق و به‌هم‌ریختگی قالب؛ null به رشته خالی تبدیل می‌شود.
const escH=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// fp: قالب قیمت؛ عدد گرد‌شده با جداکننده انگلیسی «,» (ارقام فارسی می‌ماند) و برای مقدار نامعتبر «—».
const fp=x=>isN(x)?nf0.format(Math.round(x)).replace(/[٬,]/g,','):'—';
// faDig: ارقام فارسی و عربی را به لاتین تبدیل می‌کند تا جستجو و ورودی عددی یکسان کار کنند.
const faDig=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
// pNorm: نرمال‌سازی متن جستجو؛ یکسان‌سازی ی/ک و همزه‌ها و ارقام و حروف کوچک تا جستجو تحمل تفاوت نگارش داشته باشد.
const pNorm=s=>faDig(normFa(s)).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').toLowerCase();
// parseNum: متن ورودی (با ارقام فارسی و جداکننده) را به عدد صحیح تبدیل می‌کند؛ سقف ۹۹٬۹۹۹٬۹۹۹ و در صورت نامعتبر بودن null.
const parseNum=s=>{const t=faDig(s).replace(/[,٬\s]/g,'');return /^\d+$/.test(t)?Math.min(+t,99999999):null};
// آیکن‌های این صفحه (برچسب، ماشین‌حساب، جستجو، بعلاوه، منها، بستن، کپی، هشدار، بازگشت) به جدول IC_ اضافه می‌شوند.
Object.assign(IC_,{tag:'<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.3"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7.5h8M8.5 12h1M12 12h1M15.5 12h.01M8.5 16h1M12 16h1M15.5 16h.01"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',warn:'<path d="M12 4l9 16H3L12 4zM12 10v4M12 17.5v.01"/>',undo:'<path d="M4 9h11a5 5 0 010 10H9M4 9l4-4M4 9l4 4"/>'});
// وضعیت لیست قیمت: q متن جستجو، sort کلید ستون مرتب‌سازی (null = بدون ترتیب) و dir جهت (۱ صعودی، ‎-۱ نزولی).
const PL={q:'',sort:null,dir:1};
// pcols: ستون‌های قابل نمایش؛ ستون «خروجی» (out) در نمای تیم (D.team) حذف می‌شود و فقط مدیریت آن را می‌بیند.
const pcols=()=>PCOLS.filter(c=>c[0]!=='out'||!D.team);
// stripOut: کپی آیتم‌ها بدون فیلد out تا در نمای تیم داده خروجی اصلاً در حافظه نباشد.
const stripOut=p=>p&&p.map(it=>{const o=Object.assign({},it);delete o.out;return o});
// تعریف ستون‌ها: [کلید، عنوان، راهنما، نوع]؛ نوع ۰ متن، ۱ تعداد، ۲ قیمت و ۳ تاریخ.
const PCOLS=[['code','کد کالا','',0],['name','نام کالا','',0],['box','بطر','تعداد در هر باکس',1],['prod','قیمت تولید','',2],['cons','مصرف کننده','',2],['costBtl','تمام شده به بطر','',2],['costBox','تمام شده به باکس','',2],['unit','قیمت واحد','',2],['stock','موجودی','',2],['newp','قیمت جدید','',2],['total','ق جدید+موجودی','',2],['out','خروجی','',2],['exp','تاریخ انقضاء','',3]];
// jFmt: قالب‌دهنده تاریخ شمسی (تقویم persian) با ارقام لاتین، بر پایه UTC تا منطقه زمانی تاریخ را جابه‌جا نکند.
const jFmt=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'UTC'});
// toFa: ارقام لاتین را به فارسی تبدیل می‌کند.
const toFa=t=>String(t).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
// dShow: تاریخ میلادی ISO را به شمسی (سال/ماه/روز) تبدیل می‌کند؛ بدون تاریخ «—» و در خطا همان متن اصلی.
const dShow=iso=>{if(!iso)return '—';try{const p=Object.fromEntries(jFmt.formatToParts(new Date(iso+'T00:00:00Z')).map(x=>[x.type,x.value]));return toFa(p.year+'/'+p.month+'/'+p.day)}catch(_){return iso}};
// daysLeft: تعداد روز مانده تا تاریخ انقضا نسبت به امروز (نیمه‌شب محلی)؛ منفی یعنی منقضی شده، null یعنی تاریخ ندارد.
const daysLeft=iso=>iso?Math.floor((Date.parse(iso+'T00:00:00Z')-Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/864e5):null;
// plRows: ردیف‌های فیلترشده و مرتب‌شده. جستجو چند‌کلمه‌ای است و همه کلمات باید در نام یا کد باشند؛ مقدار تهی (null) در مرتب‌سازی همیشه آخر می‌رود.
function plRows(){
  let a=D.price.slice();
  const toks=pNorm(PL.q).split(/\s+/).filter(Boolean);
  if(toks.length)a=a.filter(it=>{const h=pNorm(it.name+' '+it.code);return toks.every(t=>h.includes(t))});
  if(PL.sort){const k=PL.sort;a.sort((x,y)=>{const p=x[k],q=y[k];if(p==null&&q==null)return 0;if(p==null)return 1;if(q==null)return -1;
    return (typeof p==='string'?p.localeCompare(q,'fa'):p-q)*PL.dir})}
  return a;
}
// hl: برجسته‌کردن کلمات جستجو با <mark>. فقط وقتی کار می‌کند که متن نرمال‌شده هم‌طول متن اصلی باشد تا اندیس‌ها درست بمانند.
function hl(text){
  const t=escH(text),toks=pNorm(PL.q).split(/\s+/).filter(Boolean);if(!toks.length)return t;
  /* highlight on the normalized text only when lengths match 1:1 */
  const n=pNorm(text);if(n.length!==text.length)return t;
  const mark=new Array(text.length).fill(false);
  toks.forEach(tk=>{let i=-1;while((i=n.indexOf(tk,i+1))>=0){for(let j=i;j<i+tk.length;j++)mark[j]=true}});
  let o='',open=false;for(let i=0;i<text.length;i++){if(mark[i]&&!open){o+='<mark>';open=true}if(!mark[i]&&open){o+='</mark>';open=false}o+=escH(text[i])}
  return o+(open?'</mark>':'');
}
// plBody: بدنه جدول؛ هر ردیف یک کالا با دکمه افزودن به ماشین‌حساب. اگر نتیجه‌ای نباشد پیام خالی نشان می‌دهد.
function plBody(){
  const a=plRows();
  if(!a.length)return `<tr class="plempty"><td colspan="${pcols().length+1}">کالایی با «${escH(PL.q)}» پیدا نشد. بخشی از نام یا کد کالا را بنویسید.</td></tr>`;
  return a.map(it=>{
    // سلول‌ها بر اساس نوع ستون ساخته می‌شوند: نام و کد (با برجسته‌سازی)، تاریخ انقضا (نوع ۳)، تعداد (نوع ۱) و قیمت (بقیه).
    const cells=pcols().map(([k,l,tt,t])=>{
