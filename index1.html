      // تاریخ انقضا: راهنمای data-tip تاریخ میلادی را نشان می‌دهد و اگر ۹۰ روز یا کمتر مانده و موجودی معلوم باشد موجودی انبار را هم اضافه می‌کند
      // (کالای نزدیک انقضا که هنوز موجودی دارد مهم است). اگر روز مانده منفی باشد برچسب «منقضی» می‌آید.
      // قیمت‌های صفر کم‌رنگ (z) و ستون‌های مصرف‌کننده و تمام‌شده به باکس پررنگ (kp) هستند.
      const x=it[k];let c;
      if(k==='name')c=`<td class="pn" data-l="${l}">${hl(it.name)}</td>`;
      else if(k==='code')c=`<td class="pcode" data-l="${l}">${hl(String(it.code))}</td>`;
      else if(t===3)c=`<td data-l="${l}" ${x?`data-tip="تاریخ انقضاء|تاریخ میلادی: ${x.replace(/-/g,'/')}${daysLeft(x)!=null&&daysLeft(x)<=90&&isN(it.stock)?'|موجودی انبار: '+nf0.format(it.stock):''}"`:''}>${dShow(x)}${x&&daysLeft(x)!=null&&daysLeft(x)<0?' <span class="pxp">منقضی</span>':''}</td>`;
      else if(t===1)c=`<td data-l="${l}">${isN(x)?nf0.format(x):'—'}</td>`;
      else c=`<td data-l="${l}" class="${isN(x)?(x===0?'z':''):'z'}${k==='costBox'||k==='cons'?' kp':''}">${isN(x)?fp(x):'—'}</td>`;
      return c}).join('');
    return `<tr>${cells}<td class="pa"><button type="button" class="padd" data-calc-add="${escH(it.name)}" aria-label="افزودن ${escH(it.name)} به ماشین‌حساب" data-tip="افزودن به ماشین‌حساب">${ic(IC_.calc,18)}<span class="pal">ماشین‌حساب</span></button></td></tr>`}).join('');
}
// plCount: شمار کالاهای نمایش‌داده‌شده نسبت به کل (برای شمارنده کنار جستجو).
function plCount(){const n=plRows().length,t=D.price.length;return n===t?`${nf0.format(t)} کالا`:`${nf0.format(n)} از ${nf0.format(t)} کالا`}
// noPrice: پیام نبودن لیست قیمت (شیت «anbar» در فایل نیست).
const noPrice=()=>`<section class="panel"><h3>لیست قیمت</h3><p class="empty">${D.priceWarn?'لیست قیمت خوانده نشد: '+D.priceWarn:'لیست قیمت در این داده نیست.'} فایل اکسلی را بارگزاری کنید که شیت «anbar» را دارد.</p></section>`;
// viewPrice: صفحه لیست قیمت؛ سربرگ (عنوان، دکمه ماشین‌حساب، جستجو) و جدول قابل مرتب‌سازی.
function viewPrice(){
  if(!D.price)return noPrice();
  // اگر نمای تیم باشد و مرتب‌سازی روی ستون «خروجی» مانده باشد لغو می‌شود تا ستون پنهان اثر نگذارد.
  if(D.team&&PL.sort==='out')PL.sort=null;
  // سرستون‌ها؛ aria-sort وضعیت مرتب‌سازی را برای دسترس‌پذیری و فلش ▲/▼ را برای کاربر نشان می‌دهد.
  const th=pcols().map(([k,l,tt])=>`<th data-sort="${k}" ${tt?`data-tip="${tt}"`:''} aria-sort="${PL.sort===k?(PL.dir>0?'ascending':'descending'):'none'}"><span>${l}</span><i>${PL.sort===k?(PL.dir>0?'▲':'▼'):''}</i></th>`).join('');
  return `<section class="panel plhead">
    <div class="plt"><div><h2>لیست قیمت محصولات</h2><p class="sub">همه قیمت‌ها به ریال است. برای مرتب‌سازی روی عنوان هر ستون بزنید.</p></div>
    <button type="button" class="calcbtn" data-calc-open>${ic(IC_.calc,20)}<span>ماشین‌حساب</span></button></div>
    <div class="plsearch"><span class="si2">${ic(IC_.search,20)}</span><input id="plQ" type="search" inputmode="search" autocomplete="off" placeholder="جستجوی نام یا کد کالا…" value="${escH(PL.q)}" aria-label="جستجوی کالا"><span class="cnt" id="plCnt" aria-live="polite">${plCount()}</span></div>
  </section>
  <section class="panel pltw"><div class="tw plscroll"><table class="pltable"><thead><tr>${th}<th class="pa"></th></tr></thead><tbody id="plBody">${plBody()}</tbody></table></div></section>`;
}
// priceStats: این صفحه کارت آمار ندارد.
function priceStats(){return ''}
// priceSummary: کارت خلاصه؛ تعداد کالا، دکمه ماشین‌حساب و ۵ کالای با نزدیک‌ترین تاریخ انقضا.
function priceSummary(){
  if(!D.price)return'';
  // ۵ کالای دارای تاریخ انقضا به ترتیب نزدیک‌ترین (مقایسه رشته‌ای ISO معادل مقایسه زمانی است).
  const withExp=D.price.filter(x=>x.exp).sort((a,b)=>a.exp<b.exp?-1:1).slice(0,5);
  // رنگ روز مانده: منقضی قرمز (bad)، ۹۰ روز یا کمتر زرد (mid)، وگرنه عادی؛ موجودی انبار در راهنمای شناور هم هست.
  const dl=withExp.map(x=>{const d=daysLeft(x.exp);return `<div class="xl" role="button" tabindex="0" data-tip="${escH(x.name)}|${d<0?'منقضی شده':'انقضا: '+nf0.format(d)+' روز دیگر'}|موجودی انبار: ${isN(x.stock)?nf0.format(x.stock):'نامشخص'}"><span>${escH(x.name)}</span><em class="${d<0?'bad':d<=90?'mid':''}">${d<0?'منقضی':nf0.format(d)+' روز'}</em></div>`}).join('');
  return `<div class="sumh"><h3>خلاصه لیست قیمت</h3></div>
    <div class="sumbig"><b>${nf0.format(D.price.length)}</b><small>کالا در لیست</small></div>
    <button type="button" class="calcbtn wide" data-calc-open>${ic(IC_.calc,20)}<span>باز کردن ماشین‌حساب</span></button>
    <h3 class="sh2">نزدیک‌ترین تاریخ انقضا</h3><div class="xlist">${dl||'<p class="empty">تاریخی ثبت نشده.</p>'}</div>
    <p class="foot" style="text-align:start;margin-top:10px">تعداد روزِ باقی‌مانده تا امروز حساب می‌شود.</p>`;
}

// وضعیت ماشین‌حساب: سه ردیف؛ هر ردیف نام کالا (n) و تعداد باکس (q).
/* --- calculator (mirrors sheet «calculator») --- */
// ساختار ماشین‌حساب: دو بخش «سفارش اصلی» (i=0) و «اشانتیون» (i=1) که هر دو چندکالایی‌اند.
// CS.lines[i]: «کالای در حال انتخاب» بخش i (جستجو + تعداد، قبل از زدن دکمه‌ی افزودن).
// CS.main / CS.free: فهرست کالاهای ثبت‌شده‌ی هر بخش [{n:نام کالا, q:تعداد باکس}]. کالا با دکمه‌ی «افزودن» زیر فیلد جستجو ردیف می‌شود و با ✕ حذف می‌شود.
const CS={lines:[{q:null,n:null},{q:null,n:null}],main:[],free:[]};
const SEC=['main','free'];                         // نام فهرست هر بخش به ترتیب اندیس
const CTITLES=['سفارش اصلی','اشانتیون'];            // عنوان بخش‌ها
const secList=i=>CS[SEC[i]];                       // فهرست کالاهای بخش i
// itemOf: یافتن کالا با نام دقیق از لیست قیمت.
const itemOf=n=>n?D.price.find(x=>x.name===n):null;
// calcLine: محاسبه یک ردیف؛ مقادیر نامعتبر صفر فرض می‌شوند. boxP قیمت باکس = قیمت بطر × تعداد در باکس و amount مبلغ ردیف = تمام‌شده به باکس × تعداد باکس.
function calcLine(l){
  const it=itemOf(l.n);if(!it)return null;const z=v=>isN(v)?v:0,q=isN(l.q)?l.q:0;
  const per=z(it.box),btl=z(it.costBtl);
  return{it,qty:q,stock:z(it.stock),per,btl,boxP:btl*per,amount:z(it.costBox)*q};
}
// calcAll: محاسبه کل ماشین‌حساب (معادل شیت calculator) با چند کالا در هر دو بخش؛ فرمول‌ها همان فرمول‌های قبلی‌اند و فقط ورودی جمعِ همه‌ی کالاهای هر بخش است.
// M / F = ردیف‌های محاسبه‌شده‌ی سفارش اصلی / اشانتیون (null یعنی کالا دیگر در لیست قیمت نیست)؛ L[i] فقط پیش‌نمایش کالای در حال انتخاب است و در جمع‌ها نمی‌آید.
function calcAll(){
  const sum=(...a)=>a.reduce((s,x)=>s+(isN(x)?x:0),0);
  const M=CS.main.map(calcLine),F=CS.free.map(calcLine),L=CS.lines.map(calcLine);
  const q0=sum(...M.map(x=>x?x.qty:0)),q1=sum(...F.map(x=>x?x.qty:0));
  // درصد اشانتیون = تعداد باکس اشانتیون ÷ (جمع تعداد باکس سفارش اصلی + اشانتیون).
  const den=q0+q1,freePct=den?q1/den:null;
  // مبلغ هر بخش = جمع (تمام‌شده‌ی باکس × تعداد) همه‌ی کالاهای آن بخش.
  const a0=M.some(Boolean)?sum(...M.map(x=>x?x.amount:0)):null,a1=F.some(Boolean)?sum(...F.map(x=>x?x.amount:0)):null;
  const amt=[a0,a1],aden=sum(a0,a1);
  // درصد هزینه = مبلغ اشانتیون ÷ جمع کل مبالغ؛ سقف مجاز ۲۵٪ است.
  const costPct=aden?sum(a1)/aden:null;
  // تخفیف = درصد هزینه × مبلغ سفارش اصلی؛ مبلغ خالص = مبلغ سفارش اصلی − تخفیف.
  const disc=(costPct!=null&&a0!=null)?costPct*a0:null;
  const net=(disc!=null)?a0-disc:null;
  // قیمت هر کالای سفارش اصلی پس از تخفیف: باکس = تمام‌شده‌ی باکس × (۱ − درصد هزینه)، بطر = قیمت باکس ÷ تعداد بطر در باکس (برای کالای تکی دقیقاً همان مبلغ خالص ÷ تعداد است).
  M.forEach(x=>{if(!x)return;x.boxNet=costPct!=null?x.it.costBox*(1-costPct):null;x.btlNet=(x.boxNet!=null&&x.per)?x.boxNet/x.per:null});
  // قیمت یک باکس/بطر در پنل نتیجه فقط وقتی یک کالا در سفارش اصلی است معنا دارد؛ برای چند کالا قیمت هر کالا در ردیف خودش دیده می‌شود.
  const one=M.filter(Boolean).length===1?M.find(Boolean):null;
  const boxP=one?one.boxNet:null,btlP=one?one.btlNet:null;
  /* stock check: جمع تعداد درخواستی هر کالا در هر دو بخش با موجودی مقایسه می‌شود */
  const need={};[CS.main,CS.free].forEach(a=>a.forEach(l=>{if(l.n&&isN(l.q))need[l.n]=(need[l.n]||0)+l.q}));
  return{L,M,F,q0,q1,freePct,costPct,disc,net,boxP,btlP,amt,need,one};
}
// pctF: قالب درصد با یک رقم اعشار؛ برای null «—».
const pctF=x=>x==null?'—':nf1.format(x*100)+'٪';
// calcSecHtml: کارت یک بخش (سفارش اصلی یا اشانتیون): یک ردیف فشرده (جستجوی کالا + تعداد + دکمه‌ی افزودن)، یک خط پیش‌نمایش کالای انتخاب‌شده، و زیرش فهرست کالاهای افزوده‌شده (#mlist{i}).
// جریان کار: کالا را جستجو و انتخاب کنید ← تعداد باکس ← «افزودن» (یا Enter) ← کالا به فهرست زیر اضافه و فیلدها برای کالای بعدی خالی می‌شود.
function calcSecHtml(i){
  const l=CS.lines[i];
  return `<section class="cc cmain" data-i="${i}">
    <div class="cch"><span class="cn">${nf0.format(i+1)}</span><h4>${CTITLES[i]}</h4><button type="button" class="cclr" data-cclr="${i}" aria-label="پاک‌کردن همه‌ی کالاهای ${CTITLES[i]}" data-tip="پاک‌کردن همه‌ی کالاهای ${CTITLES[i]}">${ic(IC_.undo,16)}</button></div>
    <div class="cin cinm">
      <div class="cf cprod"><label for="cp${i}">نوع کالا</label>
        <div class="combo"><span class="si2">${ic(IC_.search,18)}</span><input id="cp${i}" class="cpi" type="text" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="cl${i}" placeholder="جستجو و انتخاب کالا…" value="${escH(l.n||'')}" data-i="${i}"><button type="button" class="cx" data-cx="${i}" aria-label="پاک‌کردن کالا" ${l.n?'':'hidden'}>${ic(IC_.x,14)}</button>
          <ul class="clb" id="cl${i}" role="listbox" hidden></ul></div></div>
      <div class="cqa">
        <div class="cf cq"><label for="cq${i}">تعداد (باکس)</label>
          <div class="step"><button type="button" data-step="${i}:1" aria-label="افزایش">${ic(IC_.plus,16)}</button><input id="cq${i}" class="cqi" inputmode="numeric" autocomplete="off" placeholder="۰" value="${l.q==null?'':nf0.format(l.q).replace(/[٬,]/g,'')}" data-i="${i}"><button type="button" data-step="${i}:-1" aria-label="کاهش">${ic(IC_.minus,16)}</button></div></div>
        <button type="button" class="madd" data-madd="${i}">${ic(IC_.plus,16)}<span>افزودن</span></button></div>
    </div>
    <div class="cro cpv" id="cro${i}"></div>
    <div class="mlist" id="mlist${i}"></div></section>`;
}
// mainRender: ساختار فهرست کالاهای بخش i را می‌سازد (فقط هنگام افزودن/حذف/باز شدن مودال)؛ مبلغ‌ها و قیمت‌ها را mainFill پر می‌کند تا هنگام تایپ تعداد، فوکوس input نپرد.
function mainRender(i){
  if(i==null){mainRender(0);mainRender(1);return}
  const el=document.getElementById('mlist'+i);if(!el)return;
  el.innerHTML=secList(i).length?secList(i).map((l,k)=>`<div class="mrow" data-sec="${i}" data-mi="${k}">
      <div class="mn" title="${escH(l.n)}"><span>${escH(l.n)}</span></div>
      <div class="mst"><button type="button" data-mstep="${i}:${k}:-1" aria-label="کاهش">${ic(IC_.minus,14)}</button><input class="mqi" data-sec="${i}" data-mi="${k}" inputmode="numeric" autocomplete="off" aria-label="تعداد باکس ${escH(l.n)}" value="${nf0.format(l.q).replace(/[٬,]/g,'')}"><button type="button" data-mstep="${i}:${k}:1" aria-label="افزایش">${ic(IC_.plus,14)}</button><em>باکس</em></div>
      <button type="button" class="mdel" data-mdel="${i}:${k}" aria-label="حذف ${escH(l.n)}" data-tip="حذف از ${CTITLES[i]}">${ic(IC_.x,15)}</button>
      <div class="mpr" data-mpr="${i}:${k}"></div></div>`).join(''):'';
}
// mainFill: قیمت یک باکس و یک بطر، مبلغ ردیف، (برای سفارش اصلی) قیمت پس از تخفیف و هشدار موجودی را در هر ردیف هر دو فهرست می‌نویسد.
function mainFill(R){
  [0,1].forEach(i=>secList(i).forEach((l,k)=>{
    const row=document.querySelector(`.mrow[data-sec="${i}"][data-mi="${k}"]`),pr=document.querySelector(`[data-mpr="${i}:${k}"]`),x=(i?R.F:R.M)[k];if(!row||!pr)return;
    if(!x){pr.innerHTML='<span class="mwn">کالا در لیست قیمت نیست.</span>';return}
    const over=R.need[l.n]!=null&&R.need[l.n]>x.stock;row.classList.toggle('warn',over);
    // موجودی انبار همین کالا (به باکس) در ردیف نمایش داده می‌شود؛ اگر کمتر از تعداد درخواستی باشد ردیف هشدار می‌گیرد.
    pr.innerHTML=`<span class="mst2">موجودی <b>${fp(x.stock)}</b></span><span>باکس <b>${fp(x.boxP)}</b></span><span>بطر <b>${fp(x.btl)}</b></span><span class="mam">${i?'ارزش':'مبلغ'} <b>${fp(x.amount)}</b></span>`
      +(!i&&x.boxNet!=null?`<span class="mdc">با تخفیف: باکس <b>${fp(x.boxNet)}</b> · بطر <b>${fp(x.btlNet)}</b></span>`:'')
      +(over?`<span class="mwn">${ic(IC_.warn,13)}جمع تعداد (${nf0.format(R.need[l.n])}) از موجودی (${fp(x.stock)}) بیشتر است</span>`:'');
  }));
}
// mainAdd: کالای در حال انتخاب بخش i را (با تعداد) به فهرست همان بخش می‌افزاید؛ اگر همان کالا قبلاً هست تعدادها جمع می‌شوند. سپس فیلدها خالی می‌شوند تا کالای بعدی را وارد کنید.
function mainAdd(i){
  const l=CS.lines[i],q=isN(l.q)?l.q:0,inp=document.getElementById('cp'+i);
  if(!l.n||!itemOf(l.n)||q<=0){if(inp){inp.focus();const c=inp.closest('.combo');if(c){c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),400)}}return}
  const arr=secList(i),ex=arr.find(x=>x.n===l.n);if(ex)ex.q+=q;else arr.push({n:l.n,q});
  CS.lines[i]={q:null,n:null};
  inp.value='';document.getElementById('cq'+i).value='';document.querySelector(`[data-cx="${i}"]`).hidden=true;comboClose(i);
  mainRender(i);calcRefresh();
  // تمرکز برمی‌گردد به فیلد جستجو برای کالای بعدی، ولی فهرست پیشنهاد خودکار باز نمی‌شود (روی ردیف‌های تازه‌اضافه‌شده را نمی‌پوشاند)؛ با تایپ یا کلیک باز می‌شود.
  CS.quiet=true;inp.focus();CS.quiet=false;
}
// calcFill: خط پیش‌نمایش کالای در حال انتخاب هر بخش (موجودی، تعداد در باکس، قیمت‌ها)؛ فقط یک خط فشرده تا جا کم بگیرد. قیمت کالاهای افزوده‌شده در ردیف‌های فهرست است.
function calcFill(i,R){
  const x=R.L[i],el=document.getElementById('cro'+i);if(!el)return;
  if(!x){el.innerHTML=`<p class="chint">${CS.lines[i].n?'کالا در لیست نیست.':'کالا را جستجو کنید، تعداد باکس را بزنید و «افزودن» را بزنید؛ می‌توانید چند کالا اضافه کنید.'}</p>`;return}
  // over: اگر جمع تعداد درخواستی همین کالا (در هر دو بخش، به‌علاوه‌ی تعداد در حال انتخاب) از موجودی بیشتر باشد هشدار می‌دهد.
  const pend=(R.need[x.it.name]||0)+x.qty,over=pend>x.stock;
  el.innerHTML=`<p class="chint pv${over?' warn':''}"><span>موجودی <b>${fp(x.stock)}</b> باکس</span><span>هر باکس <b>${nf0.format(x.per)}</b> بطر</span><span>قیمت باکس <b>${fp(x.boxP)}</b></span><span>قیمت بطر <b>${fp(x.btl)}</b> ریال</span>${over?`<span class="mwn">${ic(IC_.warn,13)}از موجودی بیشتر است</span>`:''}</p>`;
}
// calcResult: پنل نتیجه؛ درصد هزینه، گیج با سقف ۲۵٪ (مقیاس ۰ تا ۵۰٪) و درصد اشانتیون، تخفیف، مبلغ خالص و (برای یک کالا) قیمت باکس و بطر.
function calcResult(R){
  // over یعنی بالاتر از ۲۵٪ (قرمز)؛ has یعنی داده کافی برای محاسبه هست.
  const over=R.costPct!=null&&R.costPct>0.25,has=R.costPct!=null;
  const w=has?Math.min(100,R.costPct*100/50*100):0;   /* gauge 0–50% */
  const row=(l,v,u,c)=>`<div class="rr ${c||''}"><span>${l}</span><b>${v}</b>${u?`<em>${u}</em>`:''}</div>`;
  return `<div class="rpc ${has?(over?'bad':'good'):''}">
      <div class="rph"><span>درصد هزینه</span><b>${pctF(R.costPct)}</b></div>
      <div class="gauge" role="img" aria-label="درصد هزینه نسبت به سقف ۲۵٪"><i style="width:${w}%"></i><u style="inset-inline-start:50%"></u></div>
      <div class="gl"><span>۰٪</span><span style="position:absolute;inset-inline-start:50%;transform:translateX(50%)">سقف ۲۵٪</span><span>۵۰٪</span></div>
      <p class="rmsg">${!has?'سفارش و اشانتیون را وارد کنید.':over?`${ic(IC_.warn,16)}هزینه از سقف مجاز ۲۵٪ بیشتر است؛ اشانتیون را کمتر کنید.`:'در محدوده مجاز (حداکثر ۲۵٪) است.'}</p></div>
    <div class="rl">${row('درصد اشانتیون',pctF(R.freePct),'')}
      ${row('جمع باکس سفارش اصلی',R.q0?nf0.format(R.q0):'—','باکس')}
      ${row('قیمت فاکتور',fp(R.amt[0]),'ریال')}
      ${row('تخفیف',fp(R.disc),'ریال')}
      ${row('مبلغ پس از تخفیف',fp(R.net),'ریال','hi')}
      ${R.one?row('قیمت یک باکس',fp(R.boxP),'ریال','hi')+row('قیمت یک بطر',fp(R.btlP),'ریال','hi'):''}</div>`;
}
// calcSummaryText: متن خلاصه‌ی محاسبه برای کپی در کلیپ‌بورد؛ فقط اطلاعات سفارش اصلی (کالاها با تعداد باکس) و جمع‌های فاکتور. اشانتیون و قیمت‌های پس از تخفیف داخل پرانتز عمداً در متن کپی نمی‌آیند.
function calcSummaryText(R){
  const m=CS.main.map(l=>`- ${l.n} × ${nf0.format(l.q)} باکس`);
  return ['محاسبه قیمت',m.length?'سفارش اصلی:':null,...m,'درصد هزینه: '+pctF(R.costPct),'قیمت فاکتور: '+fp(R.amt[0])+' ریال','تخفیف: '+fp(R.disc)+' ریال','مبلغ پس از تخفیف: '+fp(R.net)+' ریال'].filter(Boolean).join('\n');
}
// calcRefresh: همه چیز را دوباره حساب می‌کند و پیش‌نمایش‌ها، ردیف‌های فهرست‌ها، پنل نتیجه و نوار بالای مودال را به‌روز می‌کند.
function calcRefresh(){
  const R=calcAll();[0,1].forEach(i=>calcFill(i,R));mainFill(R);
  const r=document.getElementById('calcRes');if(r)r.innerHTML=calcResult(R);
  const b=document.getElementById('calcBar');if(b){const over=R.costPct!=null&&R.costPct>0.25;b.className='cbar '+(R.costPct==null?'':over?'bad':'good');
    b.innerHTML=`<span>درصد هزینه <b>${pctF(R.costPct)}</b></span><span>قیمت فاکتور <b>${fp(R.amt[0])}</b></span>`}
  return R;
}
// calcOpen: باز کردن مودال ماشین‌حساب؛ اگر add داده شود آن کالا به سفارش اصلی افزوده می‌شود.
function calcOpen(add){
  if(!D.price)return;
  // دکمه‌ی + در جدول لیست قیمت: کالا مستقیم به فهرست سفارش اصلی افزوده می‌شود (اگر بود، یک باکس به تعدادش اضافه می‌شود).
  if(add){const it=itemOf(add);if(it){const ex=CS.main.find(x=>x.n===it.name);if(ex)ex.q+=1;else CS.main.push({n:it.name,q:1})}}
  let m=document.getElementById('calcModal');if(m)m.remove();
  m=document.createElement('div');m.id='calcModal';m.className='cmodal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','ماشین‌حساب قیمت');
  m.innerHTML=`<div class="cbox"><div class="chd"><span class="ico">${ic(IC_.calc,22)}</span><div><h3>ماشین‌حساب قیمت</h3><p>کالا و تعداد باکس را وارد کنید؛ قیمت‌ها به ریال حساب می‌شود.</p></div>
      <button type="button" class="cclose" data-calc-close aria-label="بستن">${ic(IC_.x,20)}</button></div>
    <div class="cbar" id="calcBar"></div>
    <div class="cbody"><div class="ccards">${calcSecHtml(0)}${calcSecHtml(1)}</div>
      <aside class="cres"><h4>نتیجه</h4><div id="calcRes"></div>
        <div class="cact"><button type="button" class="b1" data-ccopy>${ic(IC_.copy,16)}<span>کپی خلاصه</span></button><button type="button" class="b2" data-creset>${ic(IC_.undo,16)}<span>پاک‌کردن همه</span></button></div></aside></div></div>`;
  document.body.appendChild(m);document.body.classList.add('noscroll');mainRender();calcRefresh();
  const f=m.querySelector(CS.lines[0].n?'#cq0':'#cp0');if(f)f.focus();
}
// calcClose: بستن مودال و آزادکردن اسکرول صفحه.
function calcClose(){const m=document.getElementById('calcModal');if(m)m.remove();document.body.classList.remove('noscroll')}
// comboList: فهرست پیشنهاد کالا برای ورودی؛ فیلتر چندکلمه‌ای روی نام و کد و حداکثر ۶۰ مورد.
function comboList(i,q){
  const ul=document.getElementById('cl'+i),inp=document.getElementById('cp'+i);
  const toks=pNorm(q).split(/\s+/).filter(Boolean);
  const a=D.price.filter(it=>!toks.length||toks.every(t=>pNorm(it.name+' '+it.code).includes(t))).slice(0,60);
  ul.innerHTML=a.length?a.map((it,k)=>`<li role="option" id="co${i}_${k}" data-pick="${i}" data-name="${escH(it.name)}"><span>${escH(it.name)}</span><small>${escH(it.code)} · ${fp(it.costBox)}</small></li>`).join(''):'<li class="none">کالایی پیدا نشد</li>';
  ul.hidden=false;inp.setAttribute('aria-expanded','true');ul.dataset.act='-1';
}
// comboClose: بستن فهرست پیشنهاد و به‌روز کردن aria-expanded.
function comboClose(i){const ul=document.getElementById('cl'+i),inp=document.getElementById('cp'+i);if(ul){ul.hidden=true}if(inp)inp.setAttribute('aria-expanded','false')}
// comboPick: انتخاب کالا؛ تعداد پیش‌فرض ۱ می‌شود و تمرکز به فیلد تعداد می‌رود.
function comboPick(i,name){
  CS.lines[i].n=name;if(!isN(CS.lines[i].q)||CS.lines[i].q===0)CS.lines[i].q=1;
  const inp=document.getElementById('cp'+i),q=document.getElementById('cq'+i);inp.value=name;q.value=String(CS.lines[i].q).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  document.querySelector(`[data-cx="${i}"]`).hidden=false;comboClose(i);calcRefresh();q.focus();q.select();
}
// رویداد input (واگذاری رویداد): جستجوی لیست قیمت، جستجوی کالای ماشین‌حساب و تعداد باکس.
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='plQ'){PL.q=t.value;$('#plBody').innerHTML=plBody();$('#plCnt').textContent=plCount();return}
  if(t.classList&&t.classList.contains('cpi')){const i=+t.dataset.i;comboList(i,t.value);
    if(CS.lines[i].n&&t.value!==CS.lines[i].n){CS.lines[i].n=null;calcRefresh()}
    document.querySelector(`[data-cx="${i}"]`).hidden=!t.value;return}
  if(t.classList&&t.classList.contains('cqi')){const i=+t.dataset.i,n=parseNum(t.value);CS.lines[i].q=t.value.trim()===''?null:n;calcRefresh()}
  // تعداد باکس یک کالای ثبت‌شده در سفارش اصلی: فقط قیمت‌ها به‌روز می‌شوند (فهرست دوباره ساخته نمی‌شود تا فوکوس نپرد).
  if(t.classList&&t.classList.contains('mqi')){const i=+t.dataset.sec,k=+t.dataset.mi,n=parseNum(t.value);secList(i)[k].q=isN(n)&&n>0?n:0;calcRefresh()}
});
// با فوکوس روی فیلد کالا فهرست پیشنهاد باز و متن انتخاب می‌شود.
document.addEventListener('focusin',e=>{const t=e.target;if(CS.quiet)return;if(t.classList&&t.classList.contains('cpi')){comboList(+t.dataset.i,CS.lines[+t.dataset.i].n===t.value?'':t.value);t.select()}});
// کیبورد: Escape ابتدا فهرست باز را و سپس مودال را می‌بندد؛ فلش‌ها و Enter برای حرکت و انتخاب در فهرست پیشنهاد.
document.addEventListener('keydown',e=>{
  const t=e.target;
  // Enter در فیلد تعداد هر بخش (سفارش اصلی/اشانتیون) = افزودن کالا به فهرست همان بخش.
  if(e.key==='Enter'&&/^cq[01]$/.test(t.id)&&document.getElementById('calcModal')){e.preventDefault();mainAdd(+t.id.slice(2));return}
  if(e.key==='Escape'&&document.getElementById('calcModal')){const open=[...document.querySelectorAll('.clb')].find(u=>!u.hidden);if(open){comboClose(+open.id.slice(2))}else calcClose();e.stopPropagation();return}
  if(t.classList&&t.classList.contains('cpi')){
    const i=+t.dataset.i,ul=document.getElementById('cl'+i);if(ul.hidden){if(e.key==='ArrowDown'){comboList(i,'');e.preventDefault()}return}
    const li=[...ul.querySelectorAll('li[data-pick]')];if(!li.length)return;let a=+ul.dataset.act;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();a=e.key==='ArrowDown'?Math.min(li.length-1,a+1):Math.max(0,a-1);ul.dataset.act=a;li.forEach((x,k)=>x.classList.toggle('on',k===a));li[a].scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();const p=li[a>=0?a:0];if(p)comboPick(i,p.dataset.name)}
  }
},true);
// mousedown: کلیک بیرون از combobox فهرست‌ها را می‌بندد و انتخاب آیتم قبل از از‌دست‌رفتن فوکوس انجام می‌شود.
document.addEventListener('mousedown',e=>{if(!e.target.closest('.combo'))[0,1].forEach(comboClose);const p=e.target.closest('[data-pick]');if(p){e.preventDefault();comboPick(+p.dataset.pick,p.dataset.name)}});
// رویداد click: باز/بستن ماشین‌حساب، مرتب‌سازی ستون، دکمه‌های +/−، پاک‌کردن و کپی خلاصه.
document.addEventListener('click',e=>{
  const t=e.target;
  const open=t.closest('[data-calc-open]');if(open){calcOpen();return}
  const add=t.closest('[data-calc-add]');if(add){calcOpen(add.dataset.calcAdd);return}
  if(t.closest('[data-calc-close]')||t.classList.contains('cmodal')){calcClose();return}
  // مرتب‌سازی با کلیک روی سرستون: صعودی، سپس نزولی، سپس بدون ترتیب.
  const th=t.closest('th[data-sort]');if(th){const k=th.dataset.sort;if(PL.sort===k){if(PL.dir>0)PL.dir=-1;else{PL.sort=null;PL.dir=1}}else{PL.sort=k;PL.dir=1}render();return}
  // دکمه‌های +/−: تعداد باکس هرگز منفی نمی‌شود.
  const st_=t.closest('[data-step]');if(st_){const [i,d]=st_.dataset.step.split(':').map(Number),l=CS.lines[i];l.q=Math.max(0,(isN(l.q)?l.q:0)+d);document.getElementById('cq'+i).value=String(l.q).replace(/\d/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x]);calcRefresh();return}
  const cx=t.closest('[data-cx]');if(cx){const i=+cx.dataset.cx;CS.lines[i].n=null;const inp=document.getElementById('cp'+i);inp.value='';cx.hidden=true;calcRefresh();inp.focus();return}
  // دکمه‌ی افزودن، +/− و حذف هر کالای فهرست (برای هر دو بخش؛ اندیس بخش در data-attribute است).
  const ma=t.closest('[data-madd]');if(ma){mainAdd(+ma.dataset.madd);return}
  const ms=t.closest('[data-mstep]');if(ms){const [i,k,d]=ms.dataset.mstep.split(':').map(Number),l=secList(i)[k];l.q=Math.max(1,(isN(l.q)?l.q:0)+d);const inp=document.querySelector(`.mqi[data-sec="${i}"][data-mi="${k}"]`);if(inp)inp.value=String(l.q).replace(/\d/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x]);calcRefresh();return}
  const md=t.closest('[data-mdel]');if(md){const [i,k]=md.dataset.mdel.split(':').map(Number);secList(i).splice(k,1);mainRender(i);calcRefresh();return}
  const cl=t.closest('[data-cclr]');if(cl){const i=+cl.dataset.cclr;CS[SEC[i]]=[];mainRender(i);CS.lines[i]={q:null,n:null};document.getElementById('cp'+i).value='';document.getElementById('cq'+i).value='';document.querySelector(`[data-cx="${i}"]`).hidden=true;calcRefresh();return}
  if(t.closest('[data-creset]')){CS.lines=[{q:null,n:null},{q:null,n:null}];CS.main=[];CS.free=[];calcOpen();return}
  // کپی خلاصه: با clipboard API و در صورت نبود یا خطا با textarea و execCommand جایگزین.
  const cc=t.closest('[data-ccopy]');if(cc){const txt=calcSummaryText(calcAll()),sp=cc.querySelector('span');
    const done=()=>{sp.textContent='کپی شد ✓';setTimeout(()=>{sp.textContent='کپی خلاصه'},1600)};
    try{navigator.clipboard.writeText(txt).then(done,()=>{fb()})}catch(_){fb()}
    function fb(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(_){sp.textContent='کپی نشد'}ta.remove()}}
});

/*
 * 60_coverage.js — صفحه «پوشش»
 * پوشش = نسبت مشتریان فعالی که از هر گروه محصول حداقل یک خرید دارند به کل مشتریان فعال.
 * داده از D.cov می‌آید: فهرست سرپرست‌ها، هر سرپرست چند ویزیتور و هر ویزیتور شمارش کل/خریدار/گروه‌ها.
 * نمایش با نمودارهای دونات SVG ساخته می‌شود (بدون کتابخانه‌ی نمودار) تا فایل تک‌صفحه‌ای سبک بماند.
 * انتخاب فعلی (همه / یک سرپرست / یک ویزیتور) در شیء CV نگهداری می‌شود و با کلیک روی چیپ‌ها تغییر می‌کند.
 * این فایل همچنین خلاصه‌ی ستون کناری (covSummary) را می‌سازد.
 */
/* ---------- coverage (پوشش) ---------- */
// آیکون دونات برای منوی «پوشش» به جدول آیکون‌ها اضافه می‌شود (IC_ در فایل‌های قبلی تعریف شده است).
Object.assign(IC_,{pie:'<path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1112 3"/>'});
// وضعیت انتخاب صفحه‌ی پوشش: sup نام سرپرست یا 'all'، vis کد ویزیتور یا null.
const CV={sup:'all',vis:null};
// رنگ هر گروه محصول: شش گروه اول رنگ‌های اختصاصی تم (--k1..--k6) و بقیه خاکستری، تا در حالت تیره/روشن خوانا بماند.
const cvCol=i=>i<6?`var(--k${i+1})`:'var(--muted)';
// جمع پوشش همه‌ی سرپرست‌ها: مجموع مشتری فعال، خریداران و تعداد هر گروه را جمع می‌زند و درصدها را از جمع کل محاسبه می‌کند
// (نه میانگین درصدها؛ چون میانگین‌گیری از درصدها وزن تعداد مشتریان هر ویزیتور را نادیده می‌گیرد).
const cvAllT=()=>{const cv=D.cov,t={total:0,buyers:0,g:{}};cv.groups.forEach(x=>t.g[x.k]={n:0});
  cv.sups.forEach(s=>{t.total+=s.tot.total;t.buyers+=s.tot.buyers;cv.groups.forEach(x=>t.g[x.k].n+=s.tot.g[x.k].n)});
  cv.groups.forEach(x=>t.g[x.k].p=t.total?t.g[x.k].n/t.total:null);t.overall=t.total?t.buyers/t.total:null;return t};
// دونات: p کسر بین ۰ و ۱ است، size اندازه و sw ضخامت حلقه. حلقه‌ی پس‌زمینه (track) کامل رسم می‌شود و حلقه‌ی رنگی با
// stroke-dasharray فقط به اندازه‌ی C*p پر می‌شود (C محیط دایره). اگر p تهی باشد (مشتری فعالی نیست) خط تیره نشان داده می‌شود.
// پارامتر tip متن راهنمای شناور (tooltip) است و با | به عنوان و توضیح تقسیم می‌شود.
function cvDonut(p,color,size,sw,label,tip,big){
  const r=(size-sw)/2,C=2*Math.PI*r,f=p==null?0:Math.max(0,Math.min(1,p));
  return `<div class="cvd${big?' big':''}" style="width:${size}px;height:${size}px" data-tip="${escH(tip)}" tabindex="0">
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
    ${f>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="${f>=1?'butt':'round'}" stroke-dasharray="${(C*f).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`:''}</svg>
    <div class="cvc"><b class="num">${p==null?'—':nf1.format(p*100)+'٪'}</b>${label?`<small>${label}</small>`:''}</div></div>`;
}
// ساخت متن tooltip دونات: «عنوان|توضیح: n از total مشتری فعال».
const cvTip=(title,n,total,what)=>`${title}|${what}: ${nf0.format(n)} از ${nf0.format(total)} مشتری فعال`;
// cvSel انتخاب فعلی را به شکل {t:عنوان، sub:زیرعنوان، d:داده} برمی‌گرداند. اولویت: ویزیتور، سپس سرپرست، در غیر این صورت کل.
// اگر انتخاب ذخیره‌شده دیگر در داده‌ی جدید (مثلاً بعد از بارگذاری فایل تازه) نباشد به حالت «همه» برمی‌گردد.
function cvSel(){
  const cv=D.cov;
  if(CV.vis!=null){for(const s of cv.sups){const v=s.visitors.find(x=>String(x.code)===String(CV.vis));if(v)return{t:v.name,sub:'ویزیتور · '+s.name,d:v}}CV.vis=null}
  if(CV.sup!=='all'){const s=cv.sups.find(x=>x.name===CV.sup);if(s)return{t:'سرپرست '+s.name,sub:nf0.format(s.visitors.length)+' ویزیتور',d:s.tot};CV.sup='all'}
  return{t:'همه سرپرست‌ها',sub:nf0.format(cv.sups.reduce((a,s)=>a+s.visitors.length,0))+' ویزیتور',d:cvAllT()};
}
// پیام جایگزین وقتی شیت پوشش در فایل گزارش نبوده یا خوانده نشده است.
const noCov=()=>`<section class="panel"><h3>پوشش</h3><p class="empty">${D.covWarn?'اطلاعات پوشش خوانده نشد: '+D.covWarn:'اطلاعات پوشش در این داده نیست.'} فایل اکسلی را بارگزاری کنید که شیت «covrage» دارد.</p></section>`;
// ردیف دونات‌های کوچک گروه‌ها (برای کارت هر ویزیتور).
function cvMini(d,gs,sz){return gs.map((g,i)=>{const x=d.g[g.k];return `<div class="cvm">${cvDonut(x.p,cvCol(i),sz,sz>50?7:5,'',cvTip(g.t,x.n,d.total,'مشتری دارای '+g.t),false)}<span>${escH(g.t)}</span></div>`}).join('')}
// صفحه‌ی اصلی پوشش: چیپ‌های انتخاب سرپرست، کارت اصلی (دونات بزرگ پوشش کلی + دونات هر گروه)،
// مقایسه‌ی سرپرست‌ها و فهرست ویزیتورها که بر اساس بیشترین پوشش کلی مرتب می‌شوند (بدون مشتری آخر فهرست می‌رود).
function viewCov(){
  const cv=D.cov;if(!cv)return noCov();
  const sel=cvSel(),d=sel.d,gs=cv.groups;
  const chips=`<div class="chips" role="group" aria-label="انتخاب سرپرست"><button type="button" class="chip" data-cv="sup:all" aria-pressed="${CV.sup==='all'&&CV.vis==null}">همه</button>${cv.sups.map(s=>`<button type="button" class="chip" data-cv="sup:${escH(s.name)}" aria-pressed="${CV.sup===s.name&&CV.vis==null}">${escH(s.name)}</button>`).join('')}</div>`;
  const hero=`<section class="panel cvhero"><div class="cvh1"><div><h2>${escH(sel.t)}</h2><p class="sub">${escH(sel.sub)} · ${nf0.format(d.total)} مشتری فعال</p></div>${CV.vis!=null?`<button type="button" class="chip" data-cv="clr">بازگشت به سرپرست</button>`:''}</div>
    <div class="cvhg"><div class="cvmain">${cvDonut(d.overall,'var(--accent)',190,20,'پوشش کلی',cvTip('پوشش کلی',d.buyers,d.total,'مشتری خرید کرده'),true)}<p>${nf0.format(d.buyers)} از ${nf0.format(d.total)} مشتری خرید کرده‌اند</p></div>
    <div class="cvgr">${gs.map((g,i)=>{const x=d.g[g.k];return `<div class="cvg">${cvDonut(x.p,cvCol(i),104,12,'',cvTip(g.t,x.n,d.total,'مشتری دارای '+g.t))}<b>${escH(g.t)}</b><small>${nf0.format(x.n)} مشتری</small></div>`}).join('')}</div></div></section>`;
  const supSec=`<section class="panel"><h3>مقایسه سرپرست‌ها</h3><p class="sub">پوشش کلی هر سرپرست؛ برای دیدن جزئیات روی هر کدام بزنید.</p><div class="cvsups">${cv.sups.map(s=>`<div class="cvs${CV.sup===s.name&&CV.vis==null?' on':''}" role="button" tabindex="0" data-cv="sup:${escH(s.name)}">${cvDonut(s.tot.overall,'var(--accent)',116,13,'پوشش کلی',cvTip('سرپرست '+s.name,s.tot.buyers,s.tot.total,'مشتری خرید کرده'))}<b>${escH(s.name)}</b><small>${nf0.format(s.visitors.length)} ویزیتور · ${nf0.format(s.tot.total)} مشتری</small><div class="cvmr">${cvMini(s.tot,gs,34)}</div></div>`).join('')}</div></section>`;
  let vs=[];cv.sups.forEach(s=>{if(CV.sup==='all'||CV.sup===s.name)s.visitors.forEach(v=>vs.push({s,v}))});
  vs.sort((a,b)=>(b.v.overall==null?-1:b.v.overall)-(a.v.overall==null?-1:a.v.overall));
  const vSec=`<section class="panel"><h3>ویزیتورها${CV.sup!=='all'?' · سرپرست '+escH(CV.sup):''}</h3><p class="sub">مرتب از بیشترین پوشش کلی. برای دیدن جزئیات یک ویزیتور روی کارت او بزنید.</p><div class="cvvs">${vs.map(({s,v},i)=>`<div class="cvv${String(CV.vis)===String(v.code)?' on':''}${v.total?'':' off'}" role="button" tabindex="0" data-cv="vis:${escH(v.code)}">
      <div class="cvvh"><span class="cvr">${nf0.format(i+1)}</span><div><b>${escH(v.name)}</b><small>${escH(s.name)} · ${nf0.format(v.total)} مشتری</small></div></div>
      ${v.total?`<div class="cvvb">${cvDonut(v.overall,'var(--accent)',92,11,'کلی',cvTip(v.name,v.buyers,v.total,'مشتری خرید کرده'))}<div class="cvmr two">${cvMini(v,gs,44)}</div></div>`:`<p class="empty">مشتری فعالی ثبت نشده</p>`}</div>`).join('')}</div></section>`;
  return chips+hero+supSec+vSec;
}
// خلاصه‌ی ستون کناری: پوشش کلی و سه ویزیتور با بیشترین و کمترین پوشش (ویزیتور بدون مشتری حذف می‌شود).
function covSummary(){
  const cv=D.cov;if(!cv)return'';
  const t=cvAllT(),all=[];cv.sups.forEach(s=>s.visitors.forEach(v=>{if(v.total)all.push(v)}));all.sort((a,b)=>b.overall-a.overall);
  const li=(v)=>`<div class="xl"><span>${escH(v.name)}</span><em>${pctF(v.overall)}</em></div>`;
  return `<div class="sumh"><h3>خلاصه پوشش</h3></div>
    <div class="sumbig"><b>${pctF(t.overall)}</b><small>پوشش کلی (${nf0.format(t.buyers)} از ${nf0.format(t.total)} مشتری)</small></div>
    <h3 class="sh2">بیشترین پوشش</h3><div class="xlist">${all.slice(0,3).map(li).join('')}</div>
    <h3 class="sh2">کمترین پوشش</h3><div class="xlist">${all.slice(-3).reverse().map(li).join('')}</div>
    <p class="foot" style="text-align:start;margin-top:10px">پوشش = تعداد مشتریِ دارای محصول ÷ کل مشتریان فعال. ویزیتورِ بدون مشتری در رتبه‌بندی نیامده.</p>`;
}
// واگذاری رویداد (event delegation): همه‌ی عناصر با data-cv با یک شنونده‌ی سندی مدیریت می‌شوند،

// انتخاب ویزیتور، سرپرست او را هم خودکار انتخاب می‌کند تا چیپ‌ها و فهرست هماهنگ بمانند.
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-cv]');if(!t)return;const [k,...r]=t.dataset.cv.split(':'),v=r.join(':');
  if(k==='sup'){CV.sup=v;CV.vis=null}else if(k==='vis'){CV.vis=String(CV.vis)===v?null:v;if(CV.vis!=null){const s=D.cov.sups.find(s=>s.visitors.some(x=>String(x.code)===v));if(s)CV.sup=s.name}}else if(k==='clr')CV.vis=null;

// دسترس‌پذیری: عناصر role=button با کلید Enter/Space مثل کلیک عمل می‌کنند.
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-cv]')){e.preventDefault();e.target.click()}});

/*
 * 70_nocells.js — صفحه «مشتری خرید نکرده» (شیت Nocells)
 * فهرست مشتریانی که مدتی است خرید نکرده‌اند: جدول صفحه‌بندی‌شده، فیلتر سرپرست/ویزیتور (آبشاری)، جستجو با هایلایت،
 * چیپ‌های بازه‌ی زمانی و دونات خلاصه در ستون کناری. دکمه‌های نقشه، شیت نقشه در 80_map.js را باز می‌کنند.
 * رنگ‌بندی ردیف‌ها: زرد برای ۶۰ تا ۹۰ روز بدون خرید (mid)، قرمز برای بیش از ۹۰ روز (bad)،
 * سبز برای کمتر از ۶۰ روز (ok) و خاکستری برای مشتری بدون هیچ فاکتور (none).
 * مهم: «روزهای خرید نکرده» تا تاریخ گزارش (D.iso) شمرده می‌شود نه تاریخ امروز، تا عدد با فایل گزارش یکسان باشد.
 */
/* ---------- customers who did not buy («مشتری خرید نکرده») + map sheet ---------- */
Object.assign(IC_,{pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',mapi:'<path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>'});
// وضعیت صفحه: سرپرست/ویزیتور انتخابی، متن جستجو، فیلتر بازه، شماره صفحه و ترتیب (پیش‌فرض: بیشترین روز در ابتدا).
const NS={sup:'all',vis:'all',q:'',f:'all',page:1,sort:'days',dir:-1};
// اندازه‌ی صفحه‌ی جدول و آستانه‌های رنگ: از ۶۰ روز زرد (NMID) و بالاتر از ۹۰ روز قرمز (NBAD).
const NPAGE=50,NMID=60,NBAD=90;
// ترتیب ستون‌های جدول؛ با ترتیب آرایه‌ی هر ردیف در D.nc.rows هم‌خوان است (به‌جز days که محاسبه می‌شود).
const NCK=['code','name','shop','addr','mob','act','grade','sup','vis','date','days','inv','avg','qty','lon','lat'];
// رنگ هر وضعیت (برای دونات و نقطه‌های نقشه) و برچسب فارسی آن.
const NCOL={mid:'#fab219',bad:'#d03b3b',ok:'#3fae49',none:'#8b8e9b'};
const BN={mid:'۲ تا ۳ ماه',bad:'بیش از ۳ ماه',ok:'کمتر از ۲ ماه',none:'بدون فاکتور'};
// کش ردیف‌های پردازش‌شده: تا وقتی D.nc و تاریخ گزارش عوض نشده، محاسبه‌ی دوباره انجام نمی‌شود (سرعت جستجو/فیلتر).
let NC_C={src:null,iso:null,rows:[]};
// تاریخ گزارش به «روز» (از ۱۹۷۰) تبدیل می‌شود تا تفاضل روزها بدون خطای ساعت تابستانی/منطقه‌ی زمانی باشد؛
// اگر تاریخ گزارش معتبر نبود به امروز برمی‌گردد.
const ncToday=()=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(D.iso||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3])/864e5:Math.floor(Date.now()/864e5)};
// نام ویزیتور با پسوند «- کد» را به شکل «نام (کد)» نشان می‌دهد.
const nVisL=v=>String(v||'').replace(/\s*-\s*(\d+)$/,' ($1)');
// ncAll: تبدیل ردیف‌های خام به شیء: محاسبه‌ی days (تا تاریخ گزارش، حداقل صفر)، وضعیت رنگی b و رشته‌ی جستجوی نرمال‌شده h
// (حروف عربی/فارسی و ارقام یکسان می‌شوند تا جستجو حساس به املا نباشد).
function ncAll(){
  if(!D.nc)return[];
  if(NC_C.src===D.nc&&NC_C.iso===D.iso)return NC_C.rows;
  const t=ncToday();
  const rows=D.nc.rows.map((a,i)=>{
    const days=a[15]==null?null:Math.max(0,t-a[15]);
    const b=days==null?'none':days>NBAD?'bad':days>=NMID?'mid':'ok';
    return{i,code:a[0],name:a[1],shop:a[2],addr:a[3],mob:a[4],act:a[5],grade:a[6],sup:a[7],vis:a[8],date:a[9],inv:a[10],avg:a[11],qty:a[12],lon:a[13],lat:a[14],gd:a[15],days,b,
      h:pNorm([a[0],a[1],a[2],a[3],a[4],a[7],a[8],a[9]].join(' '))};
  });
  NC_C={src:D.nc,iso:D.iso,rows};return rows;
}
// دامنه‌ی انتخابی بر اساس سرپرست و ویزیتور؛ هم جدول و هم شمارش چیپ‌ها و دونات از همین دامنه تغذیه می‌شوند.
function ncScope(){return ncAll().filter(r=>(NS.sup==='all'||r.sup===NS.sup)&&(NS.vis==='all'||r.vis===NS.vis))}
// ncList: فهرست نهایی = دامنه + فیلتر بازه + جستجو (همه‌ی واژه‌ها باید در متن باشند) + مرتب‌سازی.
// مقدار تهی (بدون فاکتور) همیشه آخر می‌ماند و در تساوی ترتیب اصلی حفظ می‌شود تا جدول پایدار باشد.
function ncList(useQ=true){
  let a=ncScope();
  if(NS.f!=='all')a=a.filter(r=>r.b===NS.f);
  const toks=useQ?pNorm(NS.q).split(/\s+/).filter(Boolean):[];
  if(toks.length)a=a.filter(r=>toks.every(t=>r.h.includes(t)));
  const k=NS.sort,d=NS.dir;
  const kk=k==='days'?'days':k==='date'?'gd':k;
  a=a.slice().sort((x,y)=>{const p=x[kk],q=y[kk];if(p==null&&q==null)return x.i-y.i;if(p==null)return 1;if(q==null)return -1;
    const c=typeof p==='string'?p.localeCompare(q,'fa'):p-q;return c?c*d:x.i-y.i});
  return a;
}
// هایلایت عبارت جستجو با <mark>؛ فقط وقتی طول متن نرمال‌شده با اصلی برابر باشد تا اندیس‌ها جابه‌جا نشوند. متن همیشه escape می‌شود.
function hlN(text){
  const s=String(text==null?'':text),toks=pNorm(NS.q).split(/\s+/).filter(Boolean);if(!toks.length||!s)return escH(s);
  const n=pNorm(s);if(n.length!==s.length)return escH(s);
  const m=new Array(s.length).fill(0);toks.forEach(k=>{let p=n.indexOf(k);while(p>=0){for(let j=p;j<p+k.length;j++)m[j]=1;p=n.indexOf(k,p+k.length)}});
  let o='',on=false;for(let j=0;j<s.length;j++){if(m[j]&&!on){o+='<mark>';on=true}if(!m[j]&&on){o+='</mark>';on=false}o+=escH(s[j])}
  return on?o+'</mark>':o;
}
// نمایش تعداد روز و قرص رنگی آن در جدول.
const ncDaysTxt=r=>r.days==null?'—':nf0.format(r.days)+' روز';
const ncPill=r=>`<span class="ncd ncd-${r.b}">${r.days==null?'بدون فاکتور':nf0.format(r.days)+' روز'}</span>`;
// ncLabel: عنوان ستون از برچسب‌های خود فایل (D.nc.labels)؛ برای ستون محاسبه‌ای days عنوان ثابت دارد.
function ncLabel(k,i){const L=D.nc.labels||[];const m={code:0,name:1,shop:2,addr:3,mob:4,act:5,grade:6,sup:7,vis:8,date:9,inv:10,avg:11,qty:12,lon:13,lat:14};return k==='days'?'روز خرید نکرده':(L[m[k]]||k)}
const ncShort=k=>k==='qty'?'خالص فروش و جایزه (کارتن)':ncLabel(k);
// ncCell: ساخت سلول هر ستون. data-l عنوان ستون است تا در موبایل (جدول کارتی) کنار مقدار نمایش داده شود.
function ncCell(r,k){
  const l=escH(ncLabel(k));
  switch(k){
    case 'code':return `<td class="ncc" data-l="${l}">${hlN(r.code)}</td>`;
    case 'name':return `<td class="ncn" data-l="${l}">${hlN(r.name)}</td>`;

    case 'sup':return `<td class="ncw" data-l="${l}">${hlN(r.sup)}</td>`;
    case 'vis':return `<td class="ncw" data-l="${l}">${hlN(nVisL(r.vis))}</td>`;
    case 'date':return `<td data-l="${l}">${r.date?hlN(r.date):'—'}</td>`;
    case 'days':return `<td class="ncdd" data-l="${l}">${ncPill(r)}</td>`;
    case 'inv':case 'qty':return `<td data-l="${l}">${isN(r[k])?nf0.format(r[k]):'—'}</td>`;
    case 'avg':return `<td data-l="${l}">${isN(r.avg)?nf1.format(r.avg):'—'}</td>`;
    case 'lon':case 'lat':return `<td class="z" data-l="${l}" dir="ltr">${isN(r[k])?r[k].toFixed(5):'—'}</td>`;
    default:return `<td data-l="${l}">${hlN(r[k])||'—'}</td>`;
  }
}
// فقط مشتریانی که مختصات دارند روی نقشه می‌روند.
const ncHasXY=r=>isN(r.lon)&&isN(r.lat);
// ncBody: ردیف‌های صفحه‌ی جاری؛ کلاس ncr-* رنگ ردیف را تعیین می‌کند (زرد/قرمز). شماره‌ی صفحه در محدوده نگه داشته می‌شود.
function ncBody(list){
  if(!list.length)return `<tr class="plempty"><td colspan="${NCK.length+1}">مشتری‌ای با این فیلتر و جستجو پیدا نشد. فیلترها را تغییر دهید یا عبارت جستجو را کوتاه‌تر کنید.</td></tr>`;
  const pages=Math.max(1,Math.ceil(list.length/NPAGE));if(NS.page>pages)NS.page=pages;if(NS.page<1)NS.page=1;

}
// ncPager: متن «نمایش x تا y از z» و دکمه‌های صفحه‌بندی.
function ncPager(list){
  const pages=Math.max(1,Math.ceil(list.length/NPAGE)),p=Math.min(NS.page,pages),a=list.length?(p-1)*NPAGE+1:0,b=Math.min(list.length,p*NPAGE);

// گزینه‌های سرپرست: مرتب بر اساس تعداد مشتری (بیشترین اول) با شمارش کنار نام.
function ncSupOpts(){

// گزینه‌های ویزیتور آبشاری‌اند: فقط ویزیتورهای سرپرست انتخاب‌شده؛ اگر ویزیتور انتخابی در آن سرپرست نباشد به «همه» برمی‌گردد.
function ncVisOpts(){

// چیپ‌های فیلتر بازه با شمارش هر بازه در دامنه‌ی سرپرست/ویزیتور (بدون اثر جستجو و فیلتر بازه).

// پیام جایگزین وقتی شیت Nocells در فایل نبوده است.
const noNc=()=>`<section class="panel"><h3>مشتری خرید نکرده</h3><p class="empty">${D.ncWarn?'اطلاعات این بخش خوانده نشد: '+D.ncWarn:'اطلاعات مشتریان خرید نکرده در این داده نیست.'} فایل اکسلی را بارگزاری کنید که شیت «Nocells» دارد.</p></section>`;

// ncRefresh: فقط بدنه و صفحه‌بندی جدول را بازسازی می‌کند (نه کل صفحه)، تا هنگام تایپ در جستجو فوکوس فیلد و مکان‌نما از بین نرود.

/* دونات با برش‌های دلخواه (ظاهر نمودار دایره‌ای) */
/* donut with arbitrary slices (pie look) */
// ncPie: هر برش با یک دایره‌ی stroke-dasharray رسم می‌شود و offset برش بعدی جمع طول برش‌های قبلی است؛ وسط آن عدد مشتریان در خطر.
function ncPie(parts,size,sw,centerB,centerS){
  const r=(size-sw)/2,C=2*Math.PI*r,sum=parts.reduce((a,p)=>a+p.n,0);let off=0;
  const arcs=sum?parts.filter(p=>p.n>0).map(p=>{const len=C*p.n/sum;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})" data-tip="${escH(p.tip)}" style="pointer-events:stroke;cursor:default"/>`;off+=len;return s}).join(''):'';
  return `<div class="cvd big" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${escH(centerS)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>${arcs}</svg><div class="cvc"><b class="num">${centerB}</b><small>${centerS}</small></div></div>`;
}
// ncSummary: خلاصه‌ی ستون کناری (دونات کنار صفحه): مشتریان در خطر = ۶۰ تا ۹۰ روز + بیش از ۹۰ روز،
// درصد در خطر، میانگین روز و پنج مشتری با بیشترین روز. فقط به سرپرست/ویزیتور وابسته است، نه به جستجو و چیپ.
function ncSummary(){
  if(!D.nc)return'';
  const s=ncScope(),c={mid:0,bad:0,ok:0,none:0};s.forEach(r=>c[r.b]++);
  const risk=c.mid+c.bad,tot=s.length,pc=x=>tot?pctF(x/tot):'—';
  const withD=s.filter(r=>r.days!=null),avg=withD.length?withD.reduce((a,r)=>a+r.days,0)/withD.length:null;
  const top=s.filter(r=>r.days!=null).sort((a,b)=>b.days-a.days).slice(0,5);
  const scope=NS.vis!=='all'?'ویزیتور '+nVisL(NS.vis):NS.sup!=='all'?'سرپرست '+NS.sup:'همه سرپرست‌ها و ویزیتورها';
  const parts=[{n:c.mid,c:NCOL.mid,tip:`۲ تا ۳ ماه|${nf0.format(c.mid)} مشتری (${pc(c.mid)} از ${nf0.format(tot)} مشتری)`},{n:c.bad,c:NCOL.bad,tip:`بیش از ۳ ماه|${nf0.format(c.bad)} مشتری (${pc(c.bad)} از ${nf0.format(tot)} مشتری)`}];
  const lg=(k,t)=>`<div class="ncl" data-tip="${t}|${nf0.format(c[k])} مشتری"><i style="background:${NCOL[k]}"></i><span>${t}</span><b class="num">${nf0.format(c[k])}</b><em>${pc(c[k])}</em></div>`;
  const kp=(l,v,t)=>`<div class="nck"${t?` data-tip="${t}"`:''}><b class="num">${v}</b><small>${l}</small></div>`;
  return `<div class="sumh"><h3>خلاصه مشتریان خرید نکرده</h3><p class="sub" style="text-align:center;margin:2px 0 0">${escH(scope)}</p></div>
    <div class="ncpie">${ncPie(parts,176,22,nf0.format(risk),'مشتری در خطر')}</div>
    <div class="nclg">${lg('mid','۲ تا ۳ ماه')}${lg('bad','بیش از ۳ ماه')}</div>
    <div class="nckg">${kp('کل مشتریان محدوده',nf0.format(tot))}${kp('درصد در خطر',pc(risk),'مجموع ۲ تا ۳ ماه و بیش از ۳ ماه')}${kp('میانگین روز خرید نکرده',avg==null?'—':nf0.format(Math.round(avg)))}${kp('کمتر از ۲ ماه',nf0.format(c.ok))}${kp('بدون فاکتور',nf0.format(c.none),'مشتری‌ای که تاریخ فاکتور ندارد')}${kp('بدون مختصات',nf0.format(s.filter(r=>!ncHasXY(r)).length),'روی نقشه نمی‌آیند')}</div>
    <button type="button" class="calcbtn wide" data-nmap-all>${ic(IC_.mapi,20)}<span>نمایش روی نقشه</span></button>
    <h3 class="sh2">بیشترین روز خرید نکرده</h3><div class="xlist">${top.map(r=>`<div class="xl" role="button" tabindex="0" data-ncfind="${escH(r.code)}" data-tip="${escH(r.name)}|کد: ${escH(r.code)}|آخرین فاکتور: ${escH(r.date)}"><span>${escH(r.name)}</span><em class="${r.b==='bad'?'bad':r.b==='mid'?'mid':''}">${nf0.format(r.days)} روز</em></div>`).join('')||'<p class="empty">موردی نیست.</p>'}</div>
    <p class="foot" style="text-align:start;margin-top:10px">نمودار فقط به انتخاب سرپرست و ویزیتور وابسته است. تاریخ مبنا: ${dShow(D.iso)}.</p>`;
}

function nmTileClass(){

// timeout ده‌ثانیه‌ای برای شبکه‌های کند/فیلتر، و gm_authFailure برای کلید رد‌شده که به CARTO سوئیچ می‌کند.
function gmLoad(){
  return new Promise((res,rej)=>{
    if(window.google&&google.maps&&google.maps.Map)return res();
    if(!navigator.onLine)return rej(new Error('offline'));
    const t=setTimeout(()=>rej(new Error('timeout')),10000);
    window.__gmReady=()=>{clearTimeout(t);res()};
    window.gm_authFailure=()=>{NM.authFail=true;if(NM.open&&NM.eng==='g')nmUse('carto',true,'کلید گوگل پذیرفته نشد یا Maps JavaScript API فعال نیست؛ نقشه CARTO نمایش داده شد.')};
    const s=document.createElement('script');s.async=true;s.onerror=()=>{clearTimeout(t);rej(new Error('load'))};
    s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GKEY)+'&language=fa&region=IR&callback=__gmReady';
    document.head.appendChild(s);
  });
}

// ساخت تنبل‌ی نقشه‌ی گوگل: یک OverlayView با یک canvas که همه‌ی نقطه‌ها را یک‌جا می‌کشد (به جای هزاران Marker)،
// و InfoWindow برای پاپ‌آپ. با bounds_changed بازرسم می‌شود و کلیک نقشه به hit-test می‌رود.
function nmEnsureG(){
  if(NM.gm)return;
  NM.gm=new google.maps.Map(document.getElementById('nmG'),{center:{lat:36.55,lng:52.68},zoom:11,mapTypeControl:true,streetViewControl:false,fullscreenControl:false,clickableIcons:false,gestureHandling:'greedy',zoomControl:true,keyboardShortcuts:false});
  NM.gi=new google.maps.InfoWindow({headerDisabled:true,pixelOffset:new google.maps.Size(0,-8)});
  NM.gi.addListener('closeclick',()=>{NM.sel=null;nmGSched()});
  const O=function(){};O.prototype=new google.maps.OverlayView();
  O.prototype.onAdd=function(){const c=document.createElement('canvas');c.style.cssText='position:absolute;pointer-events:none';this.c=c;this.getPanes().overlayLayer.appendChild(c)};
  O.prototype.onRemove=function(){if(this.c&&this.c.parentNode)this.c.parentNode.removeChild(this.c)};
  O.prototype.draw=function(){nmGDraw()};
  NM.ov=new O();NM.ov.setMap(NM.gm);
  NM.gm.addListener('bounds_changed',nmGSched);
  NM.gm.addListener('click',nmGClick);
}
// بازرسم با requestAnimationFrame و ادغام درخواست‌های پشت‌سرهم تا در هر فریم حداکثر یک بار رسم شود.
let nmRaf=0;
function nmGSched(){if(nmRaf)return;nmRaf=requestAnimationFrame(()=>{nmRaf=0;nmGDraw()})}
// رسم canvas: بوم کمی (۲۵٪) بزرگ‌تر از دید فعلی است تا هنگام کشیدن نقشه لبه‌ها خالی نباشد؛
// dpr برای وضوح روی صفحه‌ی پرتراکم (حداکثر ۲). نقاط بیرون از بوم رد می‌شوند و نقطه‌ی انتخاب‌شده حلقه‌ی بزرگ‌تر می‌گیرد.
function nmGDraw(){
  const ov=NM.ov;if(!ov||!ov.c||!NM.gm)return;
  const proj=ov.getProjection(),b=NM.gm.getBounds();if(!proj||!b)return;
  const sw=proj.fromLatLngToDivPixel(b.getSouthWest()),ne=proj.fromLatLngToDivPixel(b.getNorthEast());
  const px=(ne.x-sw.x)*.25,py=(sw.y-ne.y)*.25,x0=sw.x-px,y0=ne.y-py,w=ne.x-sw.x+2*px,h=sw.y-ne.y+2*py;
  if(!(w>0&&h>0))return;
  const c=ov.c,dpr=Math.min(2,window.devicePixelRatio||1);
  c.style.left=x0+'px';c.style.top=y0+'px';c.style.width=w+'px';c.style.height=h+'px';
  c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const r=NM.single?11:6.5;g.lineWidth=NM.single?2.5:1.4;g.strokeStyle='#ffffff';g.globalAlpha=.95;
  for(const p of NM.gp||[]){
    const q=proj.fromLatLngToDivPixel(p.ll),x=q.x-x0,y=q.y-y0;if(x<-14||y<-14||x>w+14||y>h+14)continue;
    g.beginPath();g.arc(x,y,r,0,6.2832);g.fillStyle=NCOL[p.r.b];g.fill();g.stroke();
  }
  if(NM.sel){const q=proj.fromLatLngToDivPixel(NM.sel.ll);g.beginPath();g.arc(q.x-x0,q.y-y0,r+5,0,6.2832);g.lineWidth=3;g.strokeStyle='#ffffff';g.stroke()}
}
// باز کردن پاپ‌آپ یک نقطه‌ی گوگل و علامت‌گذاری آن.
function nmGOpen(p){

// hit-test: چون نقطه‌ها Marker واقعی نیستند، کلیک به پیکسل تبدیل و نزدیک‌ترین نقطه در شعاع ۲۰ پیکسل پیدا می‌شود؛
// کلیک خالی پاپ‌آپ را می‌بندد.
function nmGClick(e){
  const proj=NM.ov&&NM.ov.getProjection();if(!proj||!e.latLng)return;
  const p0=proj.fromLatLngToContainerPixel(e.latLng);let best=null,bd=20*20;
  for(const p of NM.gp||[]){const q=proj.fromLatLngToContainerPixel(p.ll),dx=q.x-p0.x,dy=q.y-p0.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=p}}
  if(best)nmGOpen(best);else{NM.gi.close();NM.sel=null;nmGSched()}
}

// nmRender: رسم نقاط روی موتور فعال. ترتیب رنگ‌ها طوری است که قرمز/زرد روی سبز بیفتند. شمارش هر وضعیت در نوار راهنما نمایش داده می‌شود؛

// nmCopy: کپی مختصات. صفحات file:// اغلب به navigator.clipboard دسترسی ندارند، پس اول روش قدیمی textarea + execCommand('copy') و
// در صورت شکست clipboard API امتحان می‌شود. اگر هیچ‌کدام کار نکرد خود مختصات روی دکمه نشان داده می‌شود تا کاربر دستی کپی کند.
function nmCopy(v,btn){
  const o=btn.dataset.o||btn.textContent;btn.dataset.o=o;
  const ok=()=>{btn.textContent='کپی شد ✓';setTimeout(()=>{btn.textContent=o},1600)};
  const fail=()=>{btn.textContent=v;setTimeout(()=>{btn.textContent=o},6000)};
  let done=false;
  try{const t=document.createElement('textarea');t.value=v;t.setAttribute('readonly','');t.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';(document.getElementById('nmSheet')||document.body).appendChild(t);t.focus();t.select();t.setSelectionRange(0,t.value.length);done=document.execCommand('copy');t.remove()}catch(_){}
  if(done)return ok();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,fail);else fail();
}

/*
 * 85_server.js — اتصال داشبورد به سرور (API پی‌اچ‌پی روی MySQL هاست)
 * بخش‌ها:
 *  ۱) لایه‌ی API: آدرس، نشست (توکن)، فراخوانی با پیام خطای فارسی، پنجره‌ی ورود با «کد پرسنلی + رمز».
 *  ۲) «ارسال به سرور» (فقط نسخه‌ی مدیریت): کل داده‌ی گزارش را برای ذخیره‌ی رمزنگاری‌شده در MySQL می‌فرستد.
 *  ۳) تب «ردیاب» (فقط مدیر): موقعیت زنده‌ی پرسنل (هر ۱۰ ثانیه)، جستجو و فیلتر شعبه/نفر، ردیابی و خط سیر امروز.
 *  ۴) تب «پرسنل» (فقط مدیر): افزودن، ویرایش و حذف کاربران؛ تغییرات مستقیم در دیتابیس اعمال می‌شود.
 *  ۵) نسخه‌ی «مشاهده از سرور» (SRVV=true): ورود با دیتابیس و دریافت گزارش از سرور به‌جای داده‌ی جاسازی‌شده.
 * امنیت: دسترسی واقعی را سرور کنترل می‌کند (توکن + نقش)؛ پنهان‌بودن تب‌ها فقط برای تمیزی رابط است.
 */
/* ---------- server link ---------- */
// SRVV در نسخه‌ی «مشاهده از سرور» توسط tools/build.py به true تبدیل می‌شود؛ در نسخه‌ی مدیریت و مشاهده‌ی رمزگذاری‌شده‌ی قدیمی false است.
const SRVV=true;
// آدرس پایه‌ی API؛ با localStorage کلید hj-api قابل تغییر است (مثلا برای تست).
const SRV_DEF='https://kpi.appleeiran.ir/api';
const srvBase=()=>String(lsGet('hj-api')||SRV_DEF).replace(/\/+$/,'');
// نشست: توکن و مشخصات کاربر در localStorage همین مرورگر می‌ماند و اعتبارش را سرور هر بار بررسی می‌کند.
const SES={tok:lsGet('hj-api-tok')||'',role:lsGet('hj-api-role')||'',name:lsGet('hj-api-name')||''};
const SRV_SESSION_ERR=['SESSION_INVALID','USER_DISABLED','TOKEN_EXPIRED','NO_TOKEN'];
// roleFa: برچسب فارسی سمت.
const roleFa=r=>r==='manager'?'مدیر':r==='supervisor'?'سرپرست':r==='visitor'?'ویزیتور':'';
function sesSet(tok,u){SES.tok=tok;SES.role=u.role;SES.name=u.full_name;lsSet('hj-api-tok',tok);lsSet('hj-api-role',u.role);lsSet('hj-api-name',u.full_name);setMgr(u.role==='manager')}
function sesClear(){SES.tok='';SES.role='';SES.name='';['hj-api-tok','hj-api-role','hj-api-name'].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}});if(SRVV)setMgr(false)}
// شناسه‌ی تصادفی مرورگر برای ثبت در سرور (اختیاری)
function srvDev(){let d=lsGet('hj-dev');if(!d){d=Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('');lsSet('hj-dev',d)}return d}
// srv: فراخوانی API. خطا همیشه Error با پیام فارسی است؛ e.status و e.code هم دارد.
async function srv(method,path,body,q){
  let url=srvBase()+path;
  if(q){const s=new URLSearchParams(q).toString();if(s)url+='?'+s}
  const h={'X-Auth-Token':SES.tok||''};if(body!=null)h['Content-Type']='application/json';
  let r;
  try{r=await fetch(url,{method,headers:h,body:body==null?undefined:(typeof body==='string'?body:JSON.stringify(body)),cache:'no-store'})}
  catch(_){const e=new Error('اتصال به سرور برقرار نشد. اینترنت و آدرس سرور را بررسی کنید.');e.status=0;e.code='NETWORK';throw e}
  let j;try{j=await r.json()}catch(_){const e=new Error('پاسخ نامعتبر از سرور ('+r.status+').');e.status=r.status;e.code='BAD_RESPONSE';throw e}
  if(!r.ok||j.ok===false){
    const e=new Error(j.message||'خطای سرور');e.status=r.status;e.code=j.error;
    if(r.status===401&&SRV_SESSION_ERR.includes(j.error)){sesClear();if(SRVV&&!document.getElementById('srvLogin'))srvBootLogin(e.message)}
    throw e;
  }
  return j;
}

// srvMgr: اجرای یک کار نیازمند «مدیر بودن»؛ اگر وارد نشده یا نشست باطل شده باشد، ابتدا ورود می‌خواهد.
async function srvMgr(fn){
  const ask=()=>srvLogin({title:'ورود مدیر به سرور',hint:'با کد پرسنلی و رمز مدیر وارد شوید.',needManager:true});
  if(!SES.tok||SES.role!=='manager')await ask();
  try{return await fn()}
  catch(e){if(e.status===401&&!SES.tok){await ask();return await fn()}throw e}
}

/* ---------- ارسال به سرور (نسخه‌ی مدیریت) ---------- */
// دکمه‌ی «ارسال به سرور» هم‌زمان با ردیف ذخیره/انتشار نمایان می‌شود (بدون تغییر در کد آن دکمه‌ها).
if(!VIEWER&&!SRVV){
  const pr=$('#pubRow'),sr=$('#srvRow');
  if(pr&&sr){const sync=()=>{sr.hidden=pr.hidden};new MutationObserver(sync).observe(pr,{attributes:true,attributeFilter:['hidden']});sync()}
  const sb=$('#srvBtn');if(sb)sb.addEventListener('click',srvSend);
  // اگر مدیر از قبل با فایل رمزگذاری‌شده‌ی مدیریت وارد شده، تب‌های ردیاب/پرسنل را ببیند؛ در نسخه‌ی بدون رمز بعد از ورود مدیر نمایان می‌شود.
  if(window.__ADM||(SES.tok&&SES.role==='manager'))setMgr(true);
  const lf=$('#loginForm');if(lf)lf.addEventListener('submit',()=>{setTimeout(()=>{if($('#modal').hidden)setMgr(true)},0)});
}
// srvSend: داده‌ی کامل گزارش (نسخه‌ی واقعی + نسخه‌ی تیم) را به سرور می‌فرستد؛ سرور آن را AES-256 رمز می‌کند و در MySQL می‌گذارد.
// نسخه‌ی تیم دقیقا مثل «ذخیره/انتشار» ساخته می‌شود: بدون قیمت خروجی و بدون کدهای پرسنلی.
async function srvSend(){
  const um=m=>{$('#umsg').textContent=m};
  const real=REALD||D;
  if(!real||!real.branches||!real.branches.length){um('اول فایل اکسل را انتخاب کنید.');return}
  const btn=$('#srvBtn');
  try{
    btn.disabled=true;
    const clean=o=>Object.assign({},o,{codes:undefined,alt:undefined,uploadedAt:undefined,team:undefined});
    const team=real.alt
      ?Object.assign(clean(real),{branches:real.alt.branches,comm:real.alt.comm||real.comm,team:true,price:stripOut(real.price)})
      :Object.assign(clean(real),{team:true,price:stripOut(real.price)});
    const body=JSON.stringify({real:clean(real),team,iso:real.iso||''});
    um('در حال ارسال به سرور ('+nf1.format(body.length/1048576)+' مگابایت)…');
    const j=await srvMgr(()=>srv('POST','/report',body));
    um('✓ در سرور ذخیره شد (گزارش شماره '+nf0.format(j.id)+'). از این پس پرسنل با کد پرسنلی و رمز می‌توانند همین گزارش را در برنامه ببینند.'+(j.has_team?'':' توجه: نسخه‌ی تیم ساخته نشد.'));
  }catch(e){
    um(e.cancelled?'ارسال لغو شد.':'ارسال نشد: '+e.message+(e.code==='BAD_REPORT'?' (اگر حجم فایل زیاد است مقدار post_max_size هاست را بالا ببرید.)':''));
  }finally{btn.disabled=false}
}

/* ---------- دسترسی به رندر ---------- */
// srvAfterRender: بعد از هر render صدا زده می‌شود تا نقشه‌ی ردیاب یا لیست پرسنل در صفحه‌ی تازه ساخته شود و موقع ترک تب، تایمر و نقشه پاک شود.
function srvAfterRender(){
  if(st.view!=='track')trkStop();
  if(st.view==='track'||st.view==='staff'){const f=document.querySelector('#view .foot');if(f)f.remove()}
  if(st.view==='track')trkMount();
  if(st.view==='staff')stfMount();
}
const srvLocked=()=>'<p class="empty">این بخش فقط برای مدیران است.</p>';

/* ---------- ردیاب ---------- */
// وضعیت ردیاب: items فهرست زنده، sel شناسه‌ی نفر انتخابی، tracking یعنی خط سیر امروز نمایش داده شود.
const TRK={items:[],q:'',br:'all',who:'all',role:'all',sel:null,tracking:false,map:null,mk:{},line:null,line2:null,flag:null,timer:0,busy:false,err:'',fitted:false,stat:''};
const trkAgo=s=>s<15?'همین الان':s<60?nf0.format(s)+' ثانیه پیش':s<3600?nf0.format(Math.floor(s/60))+' دقیقه پیش':nf0.format(Math.floor(s/3600))+' ساعت پیش';
// فاصله‌ی دو نقطه (متر) با فرمول haversine
function trkDist(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),s=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
const trkBranches=()=>{const s=new Set([...WANTED,...BRANCHES]);TRK.items.forEach(i=>{if(i.branch)s.add(i.branch)});return [...s]};
// وضعیت زنده بودن: تا ۴۵ ثانیه «زنده»، تا ۱۲۰ ثانیه «تازه»، بعدش «قدیمی»
const trkSt=i=>i.age_s<=45?'live':i.age_s<=120?'recent':'old';
function viewTrack(){
  if(!window.__MGR)return srvLocked();
  return `<div class="trk"><div class="trk-bar">
    <input id="trkQ" type="search" placeholder="جستجوی نام یا کد پرسنلی…" aria-label="جستجوی نام">
    <select id="trkBr" aria-label="شعبه"></select><select id="trkWho" aria-label="نام نفرات"></select>
    <select id="trkRole" aria-label="سمت"><option value="all">همه سمت‌ها</option><option value="supervisor">سرپرستان</option><option value="visitor">ویزیتورها</option></select>
    <span class="trk-info" id="trkInfo" role="status"></span></div>
    <div class="trk-body"><div class="trk-list" id="trkList"></div>
    <div class="trk-map"><div id="trkMap"></div><div class="trk-sel" id="trkSel" hidden></div></div></div></div>`;
}
function trkMount(){
  if(!window.__MGR||!document.getElementById('trkMap'))return;
  trkStop();
  TRK.map=L.map('trkMap',{zoomControl:true,minZoom:5}).setView([36.55,52.68],11);
  L.tileLayer(CARTO_URL,{maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(TRK.map);
  setTimeout(()=>{if(TRK.map)TRK.map.invalidateSize()},60);
  $('#trkQ').value=TRK.q;
  $('#trkQ').addEventListener('input',e=>{TRK.q=e.target.value;trkPaint()});
  $('#trkBr').addEventListener('change',e=>{TRK.br=e.target.value;TRK.who='all';trkPaint()});
  $('#trkWho').addEventListener('change',e=>{TRK.who=e.target.value;trkPaint();if(TRK.who!=='all')trkSelect(+TRK.who,true)});
  $('#trkRole').addEventListener('change',e=>{TRK.role=e.target.value;TRK.who='all';trkPaint()});
  $('#trkRole').value=TRK.role;
  $('#trkList').addEventListener('click',e=>{const b=e.target.closest('[data-trk]');if(b)trkSelect(+b.dataset.trk,true)});
  $('#trkSel').addEventListener('click',e=>{
    const a=e.target.closest('[data-ta]');if(!a)return;
    if(a.dataset.ta==='go'){TRK.tracking=!TRK.tracking;if(TRK.tracking)trkLoadRoute(true);else trkClearRoute();trkSelPanel()}
    if(a.dataset.ta==='x')trkDeselect();
  });
  TRK.fitted=false;trkPaint();trkPoll();
  TRK.timer=setInterval(trkPoll,10000);
}
function trkStop(){
  clearInterval(TRK.timer);TRK.timer=0;
  Object.values(TRK.mk).forEach(o=>cancelAnimationFrame(o.raf));
  if(TRK.map){try{TRK.map.remove()}catch(_){}TRK.map=null}
  TRK.mk={};TRK.line=TRK.line2=TRK.flag=null;
}
// trkPoll: هر ۱۰ ثانیه موقعیت زنده‌ی همه را می‌گیرد؛ اگر ردیابی فعال باشد خط سیر هم تازه می‌شود.
async function trkPoll(){
  if(TRK.busy||!TRK.map)return;TRK.busy=true;
  try{
    const j=await srvMgr(()=>srv('GET','/loc/live'));
    if(!TRK.map)return;
    TRK.items=j.items;TRK.err='';trkPaint();
    if(TRK.tracking&&TRK.sel!=null)await trkLoadRoute(false);
  }catch(e){
    if(!TRK.map)return;
    TRK.err=e.message;
    if(e.cancelled){clearInterval(TRK.timer);TRK.timer=0;TRK.err='برای دیدن ردیاب باید وارد شوید.'}
    trkInfo();
  }finally{TRK.busy=false}
}
function trkInfo(){
  const el=$('#trkInfo');if(!el)return;
  if(TRK.err){el.innerHTML=escH(TRK.err)+(TRK.timer?'':' <button type="button" class="trk-retry" id="trkRetry">ورود</button>');const r=$('#trkRetry');if(r)r.onclick=()=>trkMount();el.classList.add('bad');return}
  el.classList.remove('bad');el.textContent=nf0.format(trkFiltered().length)+' نفر روی نقشه · به‌روزرسانی هر ۱۰ ثانیه';
}
// فهرست پس از جستجو و فیلترهای شعبه/سمت/نفر
function trkFiltered(){
  const q=pNorm(TRK.q).trim();
  return TRK.items.filter(i=>(TRK.br==='all'||i.branch===TRK.br)&&(TRK.role==='all'||i.role===TRK.role)&&(TRK.who==='all'||String(i.id)===String(TRK.who))&&(!q||pNorm(i.full_name+' '+i.personnel_code).includes(q)));
}
function trkOpts(){
  const sb=$('#trkBr'),sw=$('#trkWho');if(!sb||!sw)return;
  const h1='<option value="all">همه شعب</option>'+trkBranches().map(b=>`<option value="${escH(b)}">شعبه ${escH(b)}</option>`).join('');
  if(sb.dataset.h!==h1){sb.innerHTML=h1;sb.dataset.h=h1}sb.value=TRK.br;
  const base=TRK.items.filter(i=>(TRK.br==='all'||i.branch===TRK.br)&&(TRK.role==='all'||i.role===TRK.role)).sort((a,b)=>a.full_name.localeCompare(b.full_name,'fa'));
  const h2='<option value="all">همه نفرات</option>'+base.map(i=>`<option value="${i.id}">${escH(i.full_name)}</option>`).join('');
  if(sw.dataset.h!==h2){sw.innerHTML=h2;sw.dataset.h=h2}sw.value=TRK.who;
  if(sw.value!==String(TRK.who)){TRK.who='all';sw.value='all'}
}
function trkMarkerIcon(i){
  const s=trkSt(i),c=i.role==='supervisor'?'sup':'vis';
  return L.divIcon({className:'trkm',html:`<span class="trkd ${c} ${s}${TRK.sel===i.id?' on':''}">${escH((i.full_name||'؟').trim().charAt(0))}</span>`,iconSize:[40,40],iconAnchor:[20,20]});
}
// حرکت نرم نشانگر به موقعیت جدید (مثل ردیابی ماشین در اسنپ)
function trkGlide(o,lat,lng){
  const from=o.m.getLatLng(),t0=performance.now(),DUR=1500;cancelAnimationFrame(o.raf);
  const step=t=>{const k=Math.min(1,(t-t0)/DUR),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;o.m.setLatLng([from.lat+(lat-from.lat)*e,from.lng+(lng-from.lng)*e]);if(k<1)o.raf=requestAnimationFrame(step)};
  o.raf=requestAnimationFrame(step);
}
function trkPaint(){
  if(!TRK.map)return;
  trkOpts();trkInfo();
  const list=trkFiltered().sort((a,b)=>a.age_s-b.age_s);
  const L_=$('#trkList');
  L_.innerHTML=list.length?list.map(i=>`<button type="button" class="trk-it${TRK.sel===i.id?' on':''}" data-trk="${i.id}"><span class="trk-av ${i.role==='supervisor'?'sup':'vis'}">${escH((i.full_name||'؟').trim().charAt(0))}</span>
    <span class="trk-tx"><b>${escH(i.full_name)}</b><small>${roleFa(i.role)}${i.branch?' · '+escH(i.branch):''}</small></span>
    <span class="trk-ago ${trkSt(i)}"><i></i>${trkAgo(i.age_s)}</span></button>`).join(''):`<p class="empty">${TRK.items.length?'نفری با این فیلتر پیدا نشد.':'هنوز موقعیتی برای امروز ثبت نشده است. وقتی پرسنل برنامه را باز کنند و ثبت موقعیت را تأیید کنند اینجا دیده می‌شوند.'}</p>`;
  const ids=new Set(list.map(i=>i.id));
  Object.keys(TRK.mk).forEach(k=>{if(!ids.has(+k)){cancelAnimationFrame(TRK.mk[k].raf);TRK.map.removeLayer(TRK.mk[k].m);delete TRK.mk[k]}});
  list.forEach(i=>{
    const o=TRK.mk[i.id],key=trkSt(i)+(TRK.sel===i.id);
    if(!o){
      const m=L.marker([i.lat,i.lng],{icon:trkMarkerIcon(i),title:i.full_name}).addTo(TRK.map);
      m.on('click',()=>trkSelect(i.id,false));
      TRK.mk[i.id]={m,key,raf:0};
    }else{
      if(o.key!==key){o.m.setIcon(trkMarkerIcon(i));o.key=key}
      const p=o.m.getLatLng();if(Math.abs(p.lat-i.lat)>1e-7||Math.abs(p.lng-i.lng)>1e-7)trkGlide(o,i.lat,i.lng);
    }
  });
  if(!TRK.fitted&&list.length){
    TRK.fitted=true;
    const pts=list.map(i=>[i.lat,i.lng]);
    if(pts.length===1)TRK.map.setView(pts[0],15);else TRK.map.fitBounds(pts,{padding:[50,50],maxZoom:16});
  }
  if(TRK.sel!=null){if(TRK.items.some(i=>i.id===TRK.sel))trkSelPanel();else trkDeselect()}
}
// انتخاب یک نفر: پنل او با دکمه‌ی «ردیابی» نمایان می‌شود (تپ روی نشانگر یا ردیف فهرست)
function trkSelect(id,fly){
  const i=TRK.items.find(x=>x.id===id);if(!i||!TRK.map)return;
  if(TRK.sel!==id){trkClearRoute();TRK.tracking=false}
  TRK.sel=id;
  if(fly)TRK.map.flyTo([i.lat,i.lng],Math.max(TRK.map.getZoom(),15),{duration:.8});
  trkPaint();trkSelPanel();
}
function trkDeselect(){TRK.sel=null;TRK.tracking=false;trkClearRoute();const p=$('#trkSel');if(p)p.hidden=true;trkPaint()}
function trkSelPanel(){
  const p=$('#trkSel'),i=TRK.items.find(x=>x.id===TRK.sel);if(!p||!i)return;
  p.hidden=false;
  p.innerHTML=`<div class="trk-sh"><span class="trk-av ${i.role==='supervisor'?'sup':'vis'}">${escH((i.full_name||'؟').trim().charAt(0))}</span>
    <div><b>${escH(i.full_name)}</b><small>${roleFa(i.role)}${i.branch?' · شعبه '+escH(i.branch):''} · کد ${escH(i.personnel_code)}</small></div>
    <button type="button" class="trk-x" data-ta="x" aria-label="بستن">✕</button></div>
    <div class="trk-ss">آخرین موقعیت: <b>${trkAgo(i.age_s)}</b>${i.speed!=null?` · سرعت: <b>${nf0.format(i.speed*3.6)}</b> کیلومتر بر ساعت`:''}</div>
    ${TRK.tracking?`<div class="trk-ss" id="trkStat">${escH(TRK.stat)}</div>`:''}
    <button type="button" class="ubtn ${TRK.tracking?'':'pub'}" data-ta="go">${TRK.tracking?'توقف ردیابی':'ردیابی (نمایش خط سیر امروز)'}</button>`;
}
function trkClearRoute(){
  if(TRK.map){[TRK.line,TRK.line2,TRK.flag].forEach(l=>{if(l)TRK.map.removeLayer(l)})}
  TRK.line=TRK.line2=TRK.flag=null;TRK.stat='';
}
// trkLoadRoute: مسیر امروز نفر انتخابی را از سرور می‌گیرد و روی نقشه می‌کشد؛ fit=true یعنی نقشه روی کل مسیر زوم شود.
async function trkLoadRoute(fit){
  const id=TRK.sel;if(id==null||!TRK.map)return;
  try{
    const j=await srvMgr(()=>srv('GET','/loc/track',null,{user_id:id}));
    if(!TRK.map||!TRK.tracking||TRK.sel!==id)return;
    trkClearRoute();
    const pts=j.points.map(p=>[p[0],p[1]]);
    if(pts.length<2){TRK.stat=pts.length?'فقط یک نقطه برای امروز ثبت شده است.':'برای امروز مسیری ثبت نشده است.';trkSelPanel();return}
    let m=0;for(let k=1;k<pts.length;k++)m+=trkDist(pts[k-1],pts[k]);
    const sec=j.points[j.points.length-1][3]-j.points[0][3],h=Math.floor(sec/3600),mn=Math.floor(sec%3600/60);
    TRK.stat='مسیر امروز: '+nf1.format(m/1000)+' کیلومتر · '+(h?nf0.format(h)+' ساعت و ':'')+nf0.format(mn)+' دقیقه · '+nf0.format(j.count)+' نقطه';
    TRK.line2=L.polyline(pts,{color:'#fff',weight:9,opacity:.9,lineCap:'round',lineJoin:'round',interactive:false}).addTo(TRK.map);
    TRK.line=L.polyline(pts,{color:'#1769e0',weight:5,lineCap:'round',lineJoin:'round',interactive:false}).addTo(TRK.map);
    TRK.flag=L.circleMarker(pts[0],{radius:8,color:'#fff',weight:3,fillColor:'#2e9e44',fillOpacity:1,interactive:false}).addTo(TRK.map);
    if(fit)TRK.map.fitBounds(TRK.line.getBounds(),{padding:[60,60]});
    trkSelPanel();
  }catch(e){if(!e.cancelled){TRK.stat='خط سیر دریافت نشد: '+e.message;trkSelPanel()}}
}

/* ---------- پرسنل ---------- */
// STF: لیست کاربران از سرور؛ edit شناسه‌ی کاربری که در فرم در حال ویرایش است (یا null برای افزودن)
const STF={items:[],branches:[],q:'',br:'all',role:'all',edit:null,msg:''};
const stfBranches=()=>{const s=new Set([...WANTED,...BRANCHES,...STF.branches]);STF.items.forEach(u=>{if(u.branch)s.add(u.branch)});return [...s]};

      <label>سمت<select id="sfRole"><option value="visitor">ویزیتور</option><option value="supervisor">سرپرست</option><option value="manager">مدیر</option></select></label>

    <div class="stf-list"><h3>لیست پرسنل <small id="stfCnt"></small></h3>
    <div class="trk-bar"><input id="sfQ" type="search" placeholder="جستجوی نام یا کد پرسنلی…" aria-label="جستجو"><select id="sfFBr" aria-label="شعبه"></select>
    <select id="sfFRole" aria-label="سمت"><option value="all">همه سمت‌ها</option><option value="manager">مدیران</option><option value="supervisor">سرپرستان</option><option value="visitor">ویزیتورها</option></select></div>
    <div id="stfRows"></div></div></div>`;
}
async function stfMount(){
  if(!window.__MGR||!$('#stfForm'))return;
  const eyes=document.querySelectorAll('#stfForm [data-eye]');eyes.forEach(b=>{b.innerHTML=EYE_OPEN});
  $('#sfQ').value=STF.q;$('#sfFRole').value=STF.role;
  $('#sfQ').addEventListener('input',e=>{STF.q=e.target.value;stfRows()});

  $('#sfFRole').addEventListener('change',e=>{STF.role=e.target.value;stfRows()});
  $('#sfRole').addEventListener('change',stfRoleUi);
  $('#sfCancel').addEventListener('click',()=>stfReset());
  $('#stfForm').addEventListener('submit',stfSave);
  $('#stfRows').addEventListener('click',e=>{
    const ed=e.target.closest('[data-se]'),dl=e.target.closest('[data-sd]');
    if(ed)stfEdit(+ed.dataset.se);if(dl)stfDel(+dl.dataset.sd);
  });
  stfOpts();stfRoleUi();stfRows();
  try{
    const j=await srvMgr(()=>srv('GET','/users'));
    STF.items=j.items;STF.branches=j.branches||[];STF.msg='';
  }catch(e){if(!$('#stfRows'))return;$('#stfRows').innerHTML=`<p class="empty">${escH(e.cancelled?'برای دیدن لیست پرسنل باید وارد شوید.':e.message)}</p>`;return}
  if(!$('#stfForm'))return;
  stfOpts();stfRows();
}
function stfOpts(){
  const b=stfBranches(),f=$('#sfBr'),ff=$('#sfFBr');if(!f||!ff)return;
  const cur=f.value;f.innerHTML=b.map(x=>`<option value="${escH(x)}">${escH(x)}</option>`).join('');if(cur&&b.includes(cur))f.value=cur;
  ff.innerHTML='<option value="all">همه شعب</option>'+b.map(x=>`<option value="${escH(x)}">${escH(x)}</option>`).join('');ff.value=b.includes(STF.br)?STF.br:'all';
}
// برای «مدیر» شعبه لازم نیست و فیلد آن پنهان می‌شود.
function stfRoleUi(){$('#sfBrW').hidden=$('#sfRole').value==='manager'}
function stfRows(){
  const q=pNorm(STF.q).trim();
  const a=STF.items.filter(u=>(STF.br==='all'||u.branch===STF.br)&&(STF.role==='all'||u.role===STF.role)&&(!q||pNorm(u.full_name+' '+u.personnel_code).includes(q)));
  $('#stfCnt').textContent='('+nf0.format(a.length)+' از '+nf0.format(STF.items.length)+')';
  const MAX=300;

// render: توزیع‌کننده‌ی رندر. فیلترها را همگام می‌کند، آمار/خلاصه را می‌سازد و تابع نمای فعال (st.view) را از جدول صدا می‌زند.
// نماهای پوشش و مشتری خرید نکرده و قیمت نوار فیلتر و آمار بالا را ندارند و پنهان می‌شوند.

// act: اجرای کنش چیپ‌ها (انتخاب/لغو محصول، گروه، ویزیتور یا مقایسه‌ی حداکثر ۳ ویزیتور)؛ کلیک دوباره روی گزینه‌ی فعال آن را برمی‌گرداند به «همه».
function act(a){
  const [k,v]=[a.slice(0,a.indexOf(':')),a.slice(a.indexOf(':')+1)];
  if(k==='p'){st.product=(st.product===v&&v!=='all')?'all':v}
  else if(k==='k'){st.comp=(st.comp===v&&v!=='all')?'all':v}
  else if(k==='v'){const c=+v;st.visitor=st.visitor===c?'all':c}
  else if(k==='c'){const i=st.cmp.indexOf(+v);const c=+v;if(i>=0)st.cmp.splice(i,1);else{if(st.cmp.length>=3)st.cmp.shift();st.cmp.push(c)}}
  render();
}
