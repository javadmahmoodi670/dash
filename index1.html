<!-- اتصال زودهنگام به سرورهای Google Fonts برای بارگذاری سریع‌تر فونت -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- فونت وزیرمتن (وزن‌های ۴۰۰ تا ۸۰۰)؛ پس از این خط استایل‌های برنامه (styles.css) در تگ style می‌آیند -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* === ساختار کلی فایل styles.css === */
/* ۱) توکن‌های رنگ و فونت در :root (تم تیره پیش‌فرض) و بازنویسی آن‌ها در تم روشن با data-theme=light (نزدیک انتهای فایل) */
/* ۲) پوسته سه‌ستونه: سایدبار | بخش اصلی | پنل خلاصه؛ سپس سایدبار، سربرگ، فیلترها، کارت‌ها و آمار */
/* ۳) نمودارها: ستونی، ردیفی افقی، نقشه حرارتی، مقایسه، تارگت، پنل خلاصه، کمیسیون، لیست قیمت و ماشین‌حساب */
/* ۴) تب پوشش (cv*)، استایل‌های کتابخانه Leaflet (نقشه)، تب مشتریان بدون خرید (nc*) و برگه نقشه (nm*) */
/* ۵) تم روشن، رفتار لمسی (tooltip با نگه‌داشتن انگشت) و قواعد واکنش‌گرا برای تبلت و موبایل */
/* نکته RTL: صفحه راست‌به‌چپ است؛ به همین دلیل به‌جای left/right از ویژگی‌های منطقی (inset-inline-*، margin-inline-*، padding-inline-*) استفاده شده تا جهت خودکار برعکس شود */
/* Layout: sidebar (menu) | main (stats, charts) | summary panel. Dark cards on a near-black ground, teal-grey selection, blue focus. */
/* توکن‌های طراحی: همهٔ رنگ‌ها از این متغیرها خوانده می‌شوند؛ با عوض‌شدن مقدارشان در تم روشن، کل رابط بدون تغییر قواعد دیگر تم‌دار می‌شود */
:root{
/* color-scheme باعث می‌شود کنترل‌های بومی مرورگر (اسکرول‌بار، select) هم تیره رندر شوند */
  color-scheme:dark;
  --bg:#15131c; --side:#171821; --surface:#21222d; --surface2:#2f353e; --black:#000;
  --ink:#ffffff; --ink2:#a3a6b3; --muted:#8b8e9b; --line:#2f3140; --track:#2b2d3a;
  --accent:#88b2ac; --on-accent:#000; --primary:#2697ff;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-t:#4ade80; --bad-t:#ff6b6b; --mid-t:#fab219;
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500; --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --tipbg:#f3f4f8; --tipink:#15131c;
  --font:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;
}
/* تنظیمات پایه: box-sizing، جهت RTL، فونت وزیرمتن و رنگ زمینه */
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.7;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
/* حلقهٔ فوکوس فقط برای ناوبری با کیبورد (دسترسی‌پذیری) */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* عنصر دارای hidden همیشه مخفی بماند، حتی اگر display دیگری برایش تعریف شده باشد (به همین دلیل !important) */
[hidden]{display:none!important}
/* ارقام هم‌عرض (tabular) تا ستون‌های عددی زیر هم تراز بمانند */
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* پوسته اصلی: گرید سه‌ستونه (در RTL ستون اول سمت راست است = سایدبار)؛ minmax(0,..) از سرریز محتوای عریض جلوگیری می‌کند */
/* shell */
.app{display:grid;grid-template-columns:minmax(250px,2fr) minmax(0,7fr) minmax(290px,3fr);min-height:100vh}
/* سایدبار و پنل خلاصه چسبان (sticky) و هم‌ارتفاع صفحه‌اند و جداگانه اسکرول می‌شوند */
.side,.summary{position:sticky;top:0;height:100vh;overflow-y:auto;align-self:start}
.side{overflow-x:hidden;background:var(--side);padding:28px 20px;display:flex;flex-direction:column;gap:18px}
.summary{background:var(--surface);padding:28px 20px;display:grid;gap:16px;align-content:start}
.main{padding:18px;min-width:0;display:grid;gap:18px;align-content:start}
/* پرده نیمه‌شفاف پشت منوی کشویی (موبایل)؛ z-index کمتر از منو (40) و بیشتر از محتوا؛ با کلاس on فعال می‌شود */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}

/* سایدبار: برند، منوی تب‌ها، دکمه‌های بارگذاری فایل و تاریخ داده */
/* sidebar */
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 6px}
.logo{width:40px;height:40px;display:grid;place-items:center;flex:none}.logo img{width:40px;height:40px;display:block;object-fit:contain}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.brand small{color:var(--ink2);font-size:12px}
.menu{display:grid;gap:6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:none;background:none;color:var(--ink2);border-radius:6px;padding:8px 13px;font-size:15px}
.mi:hover{background:rgba(255,255,255,.05)}
/* تب فعال با رنگ تأکیدی مشخص می‌شود (aria-selected برای دسترسی‌پذیری و استایل هم‌زمان استفاده شده) */
.mi[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
/* فاصله‌انداز انعطاف‌پذیر: بخش پایینی سایدبار را به پایین می‌چسباند */
.sp{flex:1}
.upl{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-top:1px solid var(--line);padding-top:16px}
/* دکمه‌ها min-width:0 دارند و متنشان کوتاه است تا هیچ‌وقت از عرض سایدبار بیرون نزنند (قبلاً اسکرول افقی می‌شد) */
.urow{display:flex;gap:6px;min-width:0}
.urow>.ubtn{min-width:0;white-space:nowrap}
.ubtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:8px;padding:8px 10px;font-weight:700;font-size:13.5px}
.ubtn:hover{background:rgba(136,178,172,.12)}
/* دکمه‌ی «انتشار»: تمام‌عرض و رنگی (ردیف جدا زیر «بارگذاری» و «ذخیره») تا از دکمه‌های دیگر برجسته باشد */
.ubtn.pub{background:var(--accent);color:var(--on-accent)}
.ubtn.save{background:var(--accent);color:var(--on-accent)}
/* دکمه‌ی ⚙ تنظیم انتشار: کوچک و مربعی */
#pubSet{flex:0 0 38px;padding:8px 0;font-size:16px}
#umsg{overflow-wrap:anywhere}
#umsg{font-size:12.5px;color:var(--ink2);min-height:0}
.asof{color:var(--muted);font-size:12px;padding:0 6px}
/* نسخه‌ی برنامه: کوچک و کم‌رنگ زیر تاریخ؛ راست‌به‌چپ و قابل انتخاب برای کپی */
.ver{color:var(--muted);font-size:11px;padding:0 6px;opacity:.85;overflow-wrap:anywhere;user-select:text}
#upBtn{white-space:normal}

/* سربرگ بالای صفحه و فیلترها (شعبه، ویزیتور، چیپ‌های محصول) */
/* header + filters */
.top{display:flex;align-items:center;gap:12px}
/* دکمه‌های سربرگ (.tbtn و .ic) در دسکتاپ مخفی‌اند و فقط در حالت موبایل نمایش داده می‌شوند */
.ic{width:40px;height:40px;border-radius:10px;border:none;background:var(--surface);color:var(--ink2);display:none;place-items:center;flex:none}
.tbtn{display:none;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13.5px;flex:none}
#menuBtn{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 4px 14px rgba(136,178,172,.25)}
.tbtn:active{transform:scale(.97)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:clamp(19px,3.2vw,26px);font-weight:800;line-height:1.35}
.ttl p{margin:0;color:var(--ink2);font-size:13px;display:flex;gap:4px 14px;flex-wrap:wrap}
.filters{display:grid;gap:12px}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.sel{display:grid;gap:3px;flex:1 1 180px;max-width:280px}
.sel label{font-size:12px;color:var(--ink2)}
select{background:var(--surface);border:1px solid transparent;border-radius:12px;padding:9px 12px;width:100%}
select:focus{border-color:var(--primary);outline:none}
select:disabled{opacity:.5}
select option{background:var(--surface);color:var(--ink)}
/* ردیف چیپ‌های محصول: در عرض کم افقی اسکرول می‌شود به‌جای شکستن خط */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;min-width:0}
.chip{flex:none;border:1px solid transparent;background:var(--surface);border-radius:99px;padding:5px 15px;font-size:13px;color:var(--ink2)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.reset{border:none;background:none;color:var(--primary);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px 4px;flex:none}

/* کارت‌ها: پنل عمومی، کارت‌های آمار (KPI) و گرید دوستونه واکنش‌گرا (auto-fit) */
/* cards */
.panel{background:var(--surface);border-radius:8px;padding:18px;min-width:0}
.panel h2,.panel h3{margin:0 0 2px;font-size:15px;font-weight:700;text-wrap:balance}
.sub{color:var(--ink2);font-size:12.5px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.stat{background:var(--surface);border-radius:8px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.stat .si{color:var(--accent);margin-bottom:10px}
.stat b{font-size:18px;font-weight:700}
.stat small{font-size:13px;color:var(--ink2)}
.mbar{display:block;width:70%;height:5px;border-radius:99px;background:var(--track);margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}

/* راهنمای نمودار (legend) و نشانگر وضعیت (pill)؛ رنگ وضعیت از متغیر --c ست می‌شود */
/* legend + status */
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:12px;align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.lk{width:16px;height:0;border-top:2px solid var(--ink);display:inline-block}
.lk.d{border-top-style:dashed;border-color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.st-good{--c:var(--good)} .st-warn{--c:var(--warn)} .st-serious{--c:var(--serious)} .st-crit{--c:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,var(--surface));white-space:nowrap;color:var(--ink)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* نمودار میله‌ای عمودی: محور Y، شبکه، خطوط هدف/پیش‌بینی و ستون‌ها؛ برای موبایل حداقل عرض دارد و اسکرول افقی می‌شود */
/* vertical bars */
.vscroll{overflow-x:auto;padding-bottom:4px}
.vscroll-hint{display:none;color:var(--muted);font-size:12px;margin:8px 0 0}
.vchart{min-width:460px;padding-top:24px;display:grid;grid-template-columns:44px minmax(0,1fr);grid-template-areas:"y p" ". n";gap:0 8px}
.yax{grid-area:y;position:relative;height:240px}
.yax span{position:absolute;inset-inline-end:0;transform:translateY(50%);font-size:11.5px;color:var(--muted)}
.plot{grid-area:p;position:relative;height:240px;border-bottom:1px solid var(--line)}
.gl{position:absolute;inset-inline:0;border-top:1px solid var(--line);opacity:.55}
/* خط مرجع روی نمودار؛ pointer-events:none تا کلیک و tooltip ستون‌های زیرش را نگیرد */
.ln{position:absolute;inset-inline:0;border-top:2px solid var(--ink);z-index:1;pointer-events:none}
.ln.p{border-top:2px dashed var(--muted)}
.cols,.names{display:flex;gap:10px}
.cols{position:absolute;inset:0}
.names{grid-area:n;padding-top:8px}
.names span{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--ink2);line-height:1.4}
.slot{flex:1;min-width:0;position:relative;height:100%;cursor:pointer;border-radius:6px}
.slot:hover{background:rgba(255,255,255,.04)}
.slot .bar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(66%,46px);background:var(--c);border-radius:6px 6px 0 0;min-height:2px}
.slot .val{position:absolute;left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:700;white-space:nowrap;z-index:2;background:var(--surface);padding:0 4px;border-radius:4px}
.slot.dim .bar{opacity:.4}
/* انیمیشن ارتفاع/عرض فقط وقتی کاربر کاهش حرکت را درخواست نکرده فعال است */
@media(prefers-reduced-motion:no-preference){.slot .bar,.bt .f{transition:height .35s ease,width .35s ease}}

/* ردیف‌های افقی (نوار پیشرفت) برای رتبه‌بندی شعبه/ویزیتور/محصول */
/* horizontal rows */
.brow{display:grid;grid-template-columns:minmax(110px,190px) 1fr 104px;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.brow:hover,.brow.on{background:var(--bg)}
.bl{min-width:0;line-height:1.4}
.bl b{font-weight:500;font-size:13.5px;display:block;overflow-wrap:anywhere}
.bl small{color:var(--ink2);font-size:11.5px}
.bt{position:relative;height:14px;background:var(--track);border-radius:6px}
.bt .f{position:absolute;inset-block:0;inset-inline-start:0;background:var(--c);border-radius:6px;min-width:2px}
.bt .mk{position:absolute;top:-3px;bottom:-3px;width:0;border-inline-start:2px solid var(--ink)}
.bt .mk.p{border-inline-start:2px dashed var(--muted);top:0;bottom:0}
.bv{display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.35}
.bv b{font-size:15px;font-weight:700}
/* در موبایل ردیف به دو سطر تبدیل می‌شود: برچسب و مقدار بالا، نوار پایین (grid-template-areas) */
@media(max-width:640px){.brow{grid-template-columns:1fr auto;grid-template-areas:"l v" "t t"}.brow .bl{grid-area:l}.brow .bt{grid-area:t}.brow .bv{grid-area:v;align-items:flex-end}}

/* نقشه حرارتی (heatmap): رنگ سلول با color-mix از متغیر --c ساخته می‌شود */
/* heatmap */
.hm{overflow-x:auto}
.hmg{display:grid;gap:4px;min-width:760px;align-items:stretch}
.hmg .h{font-size:12px;color:var(--ink2);text-align:center;padding:2px;align-self:end}
.hmg .n{font-size:13px;display:flex;align-items:center;padding-inline-end:6px;line-height:1.3}
.hmg .br{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--accent);padding:10px 0 2px}
.cell{border-radius:6px;text-align:center;padding:6px 2px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--c) 38%,var(--surface));color:var(--ink)}
.cell.avg{background:var(--bg)}

/* بخش مقایسه: انتخاب موارد، گروه‌ها، نوارها و کارت‌های برنده */
/* compare */
.pick{display:flex;flex-wrap:wrap;gap:8px;max-height:190px;overflow:auto;padding:2px;margin-bottom:12px}
.pk{border:1px solid transparent;background:var(--bg);border-radius:99px;padding:3px 13px;font-size:12.5px;color:var(--ink2)}
.pk[aria-pressed="true"]{border-width:2px;font-weight:700;color:var(--ink)}
.pk small{color:var(--muted);margin-inline-start:4px}
.grp{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.grp:first-of-type{border-top:none}
.grp>b{font-weight:700;font-size:13.5px;padding-top:2px}
.hb{display:grid;gap:5px}
.hr{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center}
.hr .bt{height:14px}
.hr span{font-size:12.5px;font-weight:700}
.crown{font-size:11px;color:var(--accent);margin-inline-start:4px}
.wins{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.win{flex:1;min-width:140px;border:2px solid var(--c);border-radius:8px;padding:8px 12px}
.win b{font-size:22px;font-weight:800;display:block;line-height:1.3}
.win small{font-size:12px;color:var(--ink2)}
@media(max-width:560px){.grp{grid-template-columns:1fr;gap:4px}}

/* تب تارگت: کارت‌های پیشرفت با حلقهٔ دایره‌ای (SVG که ۹۰ درجه چرخانده شده تا از بالا شروع شود) و لیست‌ها */
/* target */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:15px}
.pc{background:var(--bg);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.pc.done{outline:1px solid var(--good)}
.pc .top{display:flex;gap:12px;align-items:center}
.mini{position:relative;width:76px;height:76px;flex:none}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini b{position:absolute;inset:0;display:grid;place-content:center;font-size:16px;font-weight:800}
.pc h3{margin:0;font-size:16px;font-weight:700}
.pc .sm{font-size:12.5px;color:var(--ink2)}
.need{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.need div{background:var(--surface);border-radius:8px;padding:6px 10px}
.need small{display:block;font-size:11.5px;color:var(--ink2)}
.need b{font-size:16px;font-weight:700}
.say{font-size:13.5px;margin:0;text-wrap:pretty}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.li:first-of-type{border-top:none}
.li b{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.li small{display:block;color:var(--ink2);font-size:12px}
.li .r{text-align:end;white-space:nowrap;font-weight:700;font-size:15px}
.empty{color:var(--ink2);font-size:13px;padding:8px 0;margin:0}

/* پنل خلاصه (ستون چپ): دونات، جزئیات، پیام‌ها و باکس‌ها */
/* summary panel */
.donut{position:relative;width:200px;height:200px;margin:8px auto 0}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.3}
.donut .c b{font-size:34px;font-weight:800}
.donut .c small{color:var(--ink2);font-size:12.5px}
.sum-t{margin:0;text-align:center;font-size:16px;font-weight:700}
.sum-s{margin:-8px 0 0;text-align:center;color:var(--ink2);font-size:12.5px;text-wrap:balance}
.sdet{background:var(--surface2);border-radius:8px;padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 8px;text-align:center}
.sdet small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.4}
.sdet b{font-size:15px;font-weight:700;color:var(--tc,var(--ink))}
.sdet em{display:block;font-style:normal;font-size:11px;line-height:1.4;color:var(--tc,var(--ink2))}
.sdet .ops{border-top:1px solid var(--line);padding-top:10px}
.mt-bad{--tc:var(--bad-t)} .mt-mid{--tc:var(--mid-t)} .mt-good{--tc:var(--good-t)} .mt-na{--tc:var(--muted)}
.smsg{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;margin:0;text-wrap:pretty}
.sh{margin:6px 0 0;font-size:15px;font-weight:700}
.bl2{background:var(--black);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;margin-top:8px}
.bl2 b{display:block;font-size:12.5px;font-weight:600;line-height:1.5}
.bl2 small{color:var(--ink2);font-size:12px}
.bl2 em{font-style:normal;font-weight:800;font-size:14px;white-space:nowrap}

/* پانویس و نام سازنده */
/* footer */
.foot{color:var(--muted);font-size:12px;text-align:center;margin:0}
.credit{font-weight:700;color:var(--ink2);font-size:13px}

/* پنجرهٔ ورود مدیر: روی همه چیز (z-index:60) با پس‌زمینه تیره؛ ورودی‌ها چپ‌به‌راست‌اند چون نام کاربری و رمز لاتین هستند */
/* login */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px}
.box{background:var(--surface);color:var(--ink);border-radius:12px;padding:22px;width:min(100%,360px);display:grid;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.box h3{margin:0;font-size:18px;font-weight:800}
.box p{margin:0 0 6px;color:var(--ink2);font-size:13px}
.box label{font-size:12.5px;color:var(--ink2)}
.box input{background:var(--bg);border:1px solid transparent;border-radius:10px;padding:9px 12px;width:100%;direction:ltr;text-align:left}
.box input:focus{border-color:var(--primary);outline:none}
.box .err{color:#ff7b7b;font-size:13px;min-height:20px}
.box .row{display:flex;gap:8px}
.box .go{flex:1;border:none;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px;font-weight:700}
.box .no{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:9px 16px}
/* tooltip سراسری: ثابت و بالاتر از همه لایه‌ها (z-index:70)؛ pointer-events:none تا مزاحم ماوس نشود؛ رنگ‌ها وارونهٔ تم هستند تا همیشه خوانا باشد */
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--tipbg);color:var(--tipink);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.6;max-width:260px;box-shadow:0 4px 18px rgba(0,0,0,.4)}

/* تب کمیسیون: راهنما، ردیف‌های تیم، جزئیات ویزیتور، جدول با ستون اول چسبان و لیست‌ها */
/* commission */
.cleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.cleg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.team .th{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.tsum{text-align:end;line-height:1.45}
.tsum b{font-size:20px;font-weight:800;display:block}
.tsum small{color:var(--ink2);font-size:12px;display:block}
.crow{display:grid;grid-template-columns:minmax(110px,190px) 1fr 104px;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.crow:hover,.crow.on{background:var(--bg)}
.crow.dim{opacity:.5}
.crow.sup{background:color-mix(in srgb,var(--accent) 11%,var(--surface));cursor:default;margin-bottom:6px}
.ctr{position:relative;height:18px;background:var(--track);border-radius:6px;min-width:0}
/* نوار تقسیم‌شده به بخش‌ها (segments)؛ گوشه‌های گرد فقط برای اولین و آخرین بخش و با ویژگی‌های منطقی (سازگار با RTL) */
.sgs{display:flex;gap:2px;height:100%;min-width:2px}
.sg{display:block;min-width:2px}
.sg:first-child{border-start-start-radius:6px;border-end-start-radius:6px}
.sg:last-child{border-start-end-radius:6px;border-end-end-radius:6px}
.sg.sup{flex:1;background:var(--accent)}
.na{position:absolute;inset:0;display:flex;align-items:center;padding-inline:10px;font-size:11.5px;color:var(--serious);white-space:nowrap;overflow:hidden}
/* موبایل: ردیف کمیسیون مثل ردیف‌های افقی به دو سطر تبدیل می‌شود */
@media(max-width:640px){.crow{grid-template-columns:1fr auto;grid-template-areas:"l v" "t t"}.crow .bl{grid-area:l}.crow .ctr{grid-area:t}.crow .bv{grid-area:v;align-items:flex-end}}
.warnc{color:var(--serious)!important;font-size:11.5px!important}
.det{display:grid;gap:14px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.dh h3{margin:0;font-size:18px;font-weight:800}
.dl{display:grid;gap:12px}
.dr{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:4px 6px;border-radius:8px;cursor:pointer}
.dr:hover,.dr.on{background:var(--bg)}
.dr.adj{cursor:default}
.dr .nm{font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr .am{font-weight:700;font-size:14px;text-align:end}
.dr .bar2{grid-column:2/4;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.dr .bar2 i{display:block;height:100%;border-radius:99px}
.dr>small{grid-column:2/4;color:var(--ink2);font-size:11.5px}
.pp{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);background:var(--bg);border-radius:99px;padding:0 9px}
.pp i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dfin{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface2);border-radius:8px;padding:12px 14px}
/* جدول کمیسیون: عرض حداقل زیاد و اسکرول افقی؛ ستون اول با position:sticky در ابتدای خط (راست) می‌ماند */
.tw{overflow-x:auto}
.ctable{border-collapse:separate;border-spacing:0 3px;width:100%;min-width:860px;font-size:13px}
.ctable th{font-size:12px;font-weight:500;color:var(--ink2);padding:4px 6px;text-align:center;white-space:nowrap}
.ctable th:first-child,.ctable td:first-child{text-align:start;position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;padding-inline:8px}
.ctable td{padding:7px 6px;text-align:center;font-variant-numeric:tabular-nums}
.ctable td.c{border-radius:6px}
.ctable tr.vr{cursor:pointer}
.ctable tr.vr:hover td:first-child,.ctable tr.vr.on td:first-child{color:var(--accent);font-weight:700}
.ctable td.fin{font-weight:800}
.ctable tr.gr td{color:var(--accent);font-weight:700;font-size:12.5px;padding-top:14px;text-align:start}
.ctable tr.tot td{font-weight:800;border-top:1px solid var(--line)}
.ctable tr.sr td{color:var(--ink2)}
.ctable .z{color:var(--muted)}
.cdim{opacity:.4}
.note ul{margin:6px 0 0;padding-inline-start:20px;color:var(--ink2);font-size:13px;display:grid;gap:4px}
.clist{display:grid;gap:2px}
.cl{display:grid;grid-template-columns:12px 1fr auto 42px;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.cl:hover,.cl.on{background:var(--bg)}
.cl.adj{cursor:default;color:var(--ink2)}
.cl em{font-style:normal;font-weight:700}
.cl small{color:var(--ink2);text-align:end}


/* لیست قیمت و ماشین‌حساب: در این تب فیلترها و آمار عمومی مخفی می‌شوند */
/* price list + calculator */
.filters[hidden],.stats[hidden]{display:none!important}
.plhead{display:grid;gap:14px}
.plt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.plt h2{font-size:18px}.plt .sub{margin:2px 0 0}
.calcbtn{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:14px;border-radius:10px;padding:10px 18px;min-height:44px;box-shadow:0 4px 14px rgba(136,178,172,.25)}
.calcbtn:hover{filter:brightness(1.08)}
.calcbtn.wide{width:100%;justify-content:center}
.plsearch{position:relative;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:0 14px;min-height:52px;gap:10px;transition:border-color .15s}
.plsearch:focus-within{border-color:var(--primary)}
.plsearch .si2,.combo .si2{color:var(--ink2);display:grid;place-items:center;flex:none}
.plsearch input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:15px;padding:12px 0}
.plsearch input::-webkit-search-cancel-button{display:none}
.plsearch .cnt{flex:none;font-size:12.5px;color:var(--ink2);background:var(--surface);border-radius:99px;padding:2px 12px;white-space:nowrap}
.pltw{padding:6px}
/* جدول لیست قیمت: سربرگ چسبان (top:0) و دو ستون اول چسبان در راست؛ z-indexها (2 تا 4) باعث می‌شود سربرگِ ستون چسبان بالاتر از بقیه بماند */
.plscroll{max-height:68vh;overflow:auto;border-radius:6px}
.pltable{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:13px}
.pltable th{position:sticky;top:0;z-index:3;background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12px;padding:10px 8px;text-align:center;white-space:nowrap;cursor:pointer;user-select:none}
.pltable th:hover{color:var(--ink)}
.pltable th i{font-style:normal;font-size:9px;margin-inline-start:4px;color:var(--accent)}
.pltable th.pa{cursor:default;width:46px}
.pltable td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.pltable td.pn{text-align:start;white-space:normal;min-width:230px;font-weight:600}
.pltable td.pcode{color:var(--ink2)}
.pltable th:first-child,.pltable td.pcode{position:sticky;inset-inline-start:0;z-index:2;background:var(--surface);width:70px;min-width:70px;max-width:70px}
.pltable th:first-child{z-index:4;background:var(--surface2)}
.pltable th:nth-child(2),.pltable td.pn{position:sticky;inset-inline-start:70px;z-index:2;background:var(--surface)}
.pltable th:nth-child(2){z-index:4;background:var(--surface2);text-align:start}
.pltable tbody tr:hover td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.pltable td.z{color:var(--muted)}
.pltable td.kp{font-weight:700}
.pltable mark{background:color-mix(in srgb,var(--mid-t) 38%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.pxp{font-size:11px;color:var(--bad-t);border:1px solid var(--bad-t);border-radius:99px;padding:0 6px}
.padd{width:34px;height:34px;display:grid;place-items:center;border:none;border-radius:8px;background:var(--bg);color:var(--accent)}
.padd:hover{background:var(--accent);color:var(--on-accent)}
.plempty td{padding:34px 12px!important;color:var(--ink2);white-space:normal!important}
.sumh h3{margin:0;font-size:16px;font-weight:700;text-align:center}
.sumbig{display:grid;place-items:center;background:var(--bg);border-radius:10px;padding:16px}
.sumbig b{font-size:34px;font-weight:800}.sumbig small{color:var(--ink2)}
.sh2{margin:6px 0 0;font-size:14px;font-weight:700}
.xlist{display:grid;gap:6px}
.xl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;background:var(--bg);border-radius:8px;padding:8px 10px;align-items:center}
.xl span{min-width:0}.xl em{font-style:normal;font-weight:700;white-space:nowrap;color:var(--good-t)}
.xl em.mid{color:var(--mid-t)}.xl em.bad{color:var(--bad-t)}
.pal{display:none}
/* موبایل: جدول به کارت تبدیل می‌شود؛ هر سلول با محتوای data-l (از attr) برچسب‌دار می‌شود و سربرگ جدول مخفی است */
@media(max-width:640px){
  .pltable{min-width:0}.pltable thead{display:none}.pltable,.pltable tbody{display:block}
  .plscroll{max-height:none;overflow:visible}
  .pltable tr{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px}
  .pltable td{display:flex;justify-content:space-between;gap:8px;border:none;padding:3px 0;font-size:12.5px;white-space:normal;position:static;width:auto;min-width:0;max-width:none;background:none}
  .pltable td::before{content:attr(data-l);color:var(--ink2);font-size:11.5px}
  .pltable td.pn{grid-column:1/-1;grid-row:1;display:block;font-size:14.5px;line-height:1.7;padding:2px 0 8px;padding-inline-end:132px;min-height:46px;background:none}
  .pltable td.pn::before{content:none}
  .pltable td.pa{grid-column:1/-1;grid-row:1;justify-self:end;align-self:start;display:block;padding:0;z-index:2;position:relative}
  .pltable td.pa::before{content:none}
  .pltable td.pcode{grid-column:1/-1;grid-row:2;padding-bottom:6px;border-bottom:1px dashed var(--line);margin-bottom:4px;background:none}
  .padd{width:auto;height:44px;padding:0 14px;gap:7px;display:inline-flex;align-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;border-radius:10px}
  .padd:hover{filter:brightness(1.08)}
  .pal{display:inline}
  .pltable tbody tr:hover td{background:none}
  .plsearch .cnt{display:none}
}
/* ماشین‌حساب: پنجرهٔ مودال تمام‌صفحه؛ body.noscroll از اسکرول پس‌زمینه جلوگیری می‌کند */
/* calculator */
body.noscroll{overflow:hidden}
.cmodal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:14px;overflow:auto}
/* جعبه ماشین‌حساب: از dvh استفاده شده تا نوار آدرس موبایل ارتفاع را خراب نکند (vh به‌عنوان جایگزین قبلی) */
.cbox{background:var(--bg);border-radius:16px;width:min(100%,1040px);max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.chd{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.chd .ico{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.chd h3{margin:0;font-size:18px;font-weight:800}.chd p{margin:0;color:var(--ink2);font-size:12.5px}
.chd>div{flex:1;min-width:0}
.cclose{width:40px;height:40px;border:none;border-radius:10px;background:var(--bg);color:var(--ink2);display:grid;place-items:center;flex:none}
.cclose:hover{color:var(--ink)}
.cbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 18px;font-size:13px;color:var(--ink2);background:var(--surface2);border-bottom:1px solid var(--line)}
.cbar b{color:var(--ink);font-size:15px;margin-inline-start:4px}
.cbar.good b:first-of-type{color:var(--good-t)}.cbar.bad{background:color-mix(in srgb,var(--crit) 28%,var(--surface2))}.cbar.bad b:first-of-type{color:var(--bad-t)}
/* دو ستون: کارت‌های ورودی و پنل نتیجه (۳۴۰ پیکسل) */
.cbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 18px;overflow:auto;align-items:start}
.ccards{display:grid;gap:14px;min-width:0}
.cc{background:var(--surface);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.cch{display:flex;align-items:center;gap:10px}
.cch h4{margin:0;font-size:15px;font-weight:700;flex:1}
.cn{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;display:grid;place-items:center}
.cc:nth-child(n+2) .cn{background:var(--k4)}
.cclr{border:none;background:var(--bg);color:var(--ink2);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.cin{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:12px}
.cf{display:grid;gap:4px;min-width:0}.cf label{font-size:12px;color:var(--ink2)}
.combo{position:relative;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:0 10px;gap:8px;min-height:46px}
.combo:focus-within{border-color:var(--primary)}
.combo input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:14px;padding:10px 0;text-overflow:ellipsis}
.cx{border:none;background:var(--surface2);color:var(--ink2);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;padding:0}
.cx[hidden]{display:none}
/* لیست پیشنهادی combo با موقعیت مطلق زیر ورودی و z-index بالا */
.clb{position:absolute;inset-inline:-1.5px;top:calc(100% + 6px);z-index:10;background:var(--surface2);border-radius:10px;margin:0;padding:4px;list-style:none;max-height:260px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.clb[hidden]{display:none}
.clb li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.clb li small{color:var(--ink2);font-size:11.5px;white-space:nowrap}
.clb li:hover,.clb li.on{background:color-mix(in srgb,var(--accent) 22%,var(--surface2))}
.clb li.none{color:var(--ink2);cursor:default}
/* کنترل عددی با دکمه‌های کم/زیاد (stepper) */
.step{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;min-height:46px;overflow:hidden}
.step:focus-within{border-color:var(--primary)}
.step button{border:none;background:var(--surface2);color:var(--ink);width:42px;align-self:stretch;display:grid;place-items:center;flex:none}
.step button:hover{background:var(--accent);color:var(--on-accent)}
.step input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:17px;font-weight:700}
.cro{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ct{background:var(--bg);border-radius:9px;padding:8px 10px;display:grid;gap:0;min-width:0}
.ct small{font-size:11.5px;color:var(--ink2)}.ct b{font-size:14.5px;font-weight:700;white-space:nowrap}.ct em{font-style:normal;font-size:11px;color:var(--muted)}
.ct.amt{background:color-mix(in srgb,var(--accent) 16%,var(--bg))}.ct.amt b{color:var(--accent);font-size:15.5px}
.ct.warn b{color:var(--mid-t)}
.chint{grid-column:1/-1;margin:0;color:var(--muted);font-size:12.5px}
.cwarn{grid-column:1/-1;margin:0;color:var(--mid-t);font-size:12.5px;display:flex;gap:6px;align-items:center}
/* پنل نتیجه روی دسکتاپ چسبان است تا هنگام اسکرول کارت‌ها دیده شود */
.cres{background:var(--surface);border-radius:12px;padding:16px;display:grid;gap:12px;position:sticky;top:0}
.cres h4{margin:0;font-size:15px}
.rpc{background:var(--bg);border-radius:12px;padding:14px;display:grid;gap:8px;border:1.5px solid var(--line)}
.rpc.good{border-color:var(--good)}.rpc.bad{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 16%,var(--bg))}
.rph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--ink2);font-size:13px}
.rph b{font-size:30px;font-weight:800;color:var(--ink)}
.rpc.good .rph b{color:var(--good-t)}.rpc.bad .rph b{color:var(--bad-t)}
/* نمودار گیج: نوار پر شونده و نشانگر (u) برای آستانه */
.gauge{position:relative;height:10px;border-radius:99px;background:var(--track);overflow:visible}
.gauge i{display:block;height:100%;border-radius:99px;background:var(--good-t);transition:width .25s}
.rpc.bad .gauge i{background:var(--bad-t)}
.gauge u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);text-decoration:none}
.gl{position:relative;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);height:16px}
.rmsg{margin:0;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start}
.rpc.bad .rmsg{color:var(--bad-t);font-weight:700}
.rl{display:grid;gap:6px}
.rr{display:flex;align-items:baseline;gap:6px;background:var(--bg);border-radius:9px;padding:9px 12px;font-size:13px}
.rr span{flex:1;color:var(--ink2)}.rr b{font-size:15px;font-weight:700}.rr em{font-style:normal;font-size:11px;color:var(--muted)}
.rr.hi{background:color-mix(in srgb,var(--accent) 14%,var(--bg))}.rr.hi b{color:var(--accent)}
.cact{display:flex;gap:8px}
.cact button{flex:1;display:inline-flex;gap:6px;align-items:center;justify-content:center;border:none;border-radius:10px;min-height:42px;font-weight:700;font-size:13px}
.cact .b1{background:var(--accent);color:var(--on-accent)}.cact .b2{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
/* واکنش‌گرایی ماشین‌حساب: زیر ۸۶۰ تک‌ستونه و پنل نتیجه دیگر چسبان نیست؛ زیر ۵۶۰ مودال به صورت برگهٔ پایین (bottom sheet) تمام‌صفحه می‌شود */
@media(max-width:860px){.cbody{grid-template-columns:1fr}.cres{position:static}}
@media(max-width:560px){.cmodal{padding:0;align-items:end}.cbox{max-height:100dvh;height:100dvh;border-radius:0}.cin{grid-template-columns:1fr}.cro{grid-template-columns:repeat(2,minmax(0,1fr))}.cbody{padding:12px}.ct.amt{grid-column:1/-1}}
/* سربرگ در تبلت/موبایل: دکمه‌ها در یک خط و عنوان با order:5 و عرض کامل در خط بعد */
/* mobile/tablet header: buttons on one line, title below */
@media(max-width:1099px){
  header.top{flex-wrap:wrap;justify-content:space-between;row-gap:12px}
  header.top .ttl{order:5;flex:0 0 100%}
}
/* تب پوشش (cv): کارت اصلی، گیج‌های دایره‌ای، سوپروایزرها و ویزیتورها */

.cvhero{display:grid;gap:14px}.cvh1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.cvh1 h2{margin:0;font-size:19px}
.cvhg{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.cvmain{display:grid;justify-items:center;gap:8px}.cvmain p{margin:0;font-size:13px;color:var(--ink2);text-align:center}
.cvgr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.cvg{display:grid;justify-items:center;gap:3px;background:var(--bg);border-radius:10px;padding:12px 6px;text-align:center}.cvg b{font-size:13px}.cvg small{color:var(--ink2);font-size:12px}
.cvd{position:relative;display:grid;place-items:center;flex:none;border-radius:50%}
.cvd:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cvc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15;pointer-events:none}
.cvc b{font-size:15px;font-weight:800}.cvc small{font-size:11px;color:var(--ink2)}
.cvd.big .cvc b{font-size:34px}.cvd.big .cvc small{font-size:13px}
.cvg .cvc b{font-size:17px}
.cvsups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.cvs{display:grid;justify-items:center;gap:4px;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:14px 8px;cursor:pointer;text-align:center}
.cvs:hover,.cvv:hover{border-color:var(--line)}.cvs.on,.cvv.on{border-color:var(--accent)}.cvs b{font-size:14px}.cvs small{color:var(--ink2);font-size:12px}
.cvmr{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.cvm{display:grid;justify-items:center;gap:2px}.cvm span{font-size:10px;color:var(--ink2);max-width:52px;text-align:center;line-height:1.2}
.cvm .cvc b{font-size:10px}.cvm .cvd[style*="width:34px"] .cvc{display:none}
.cvvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.cvv{background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:12px;cursor:pointer;display:grid;gap:10px}
.cvv.off{opacity:.65}.cvvh{display:flex;gap:10px;align-items:center}.cvvh b{display:block;font-size:14px}.cvvh small{color:var(--ink2);font-size:12px}
.cvr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}

/* === استایل‌های کتابخانه Leaflet (نقشه) - کد شخص ثالث؛ از این‌جا تا بخش «مشتریان بدون خرید» تغییر داده نشود === */
/* required styles */
/* این بخش شامل موقعیت‌دهی لایه‌ها، z-indexهای لایه‌های نقشه (کاشی 200، نشانگر 600، پاپ‌آپ 700، کنترل‌ها 800/1000)، انیمیشن‌ها و کنترل‌هاست */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;

	}

.leaflet-zoom-anim .leaflet-zoom-hide {

	}

.leaflet-interactive {

.leaflet-grab {

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */

/* visual tweaks */

.leaflet-container {

/* general typography */
.leaflet-container {

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	width: 26px;

.leaflet-control-layers {

.leaflet-touch .leaflet-control-attribution,

/* popup */

.leaflet-popup {

.leaflet-popup-tip {
	width: 17px;

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,

.leaflet-div-icon {

	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	user-select: none;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;

	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;

	}

	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

	margin-top: -6px;
	}

	}
.leaflet-tooltip-right:before {

/* چاپ: حفظ رنگ پس‌زمینهٔ کنترل‌های نقشه (بخشی از Leaflet) */
/* Printing */

@media print {
	/* Prevent printers from removing background-images of controls. */
	.leaflet-control {
		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;
		}

/* === تب مشتریان بدون خرید (nc*) و برگهٔ نقشه (nm*) === */
/* customers who did not buy + map sheet */
/* فیلترهای انتخاب، چیپ‌های وضعیت (رنگ‌ها: زرد=متوسط، قرمز=بد، سبز=خوب، خاکستری=بدون سابقه) */
.ncsel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ncf{display:grid;gap:4px;min-width:0}.ncf label{font-size:12.5px;color:var(--ink2);font-weight:600}
.ncf select{width:100%;min-height:46px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:14px;text-overflow:ellipsis}
.ncf select:focus{outline:none;border-color:var(--primary)}
.ncchips{display:flex;flex-wrap:wrap;gap:8px}
.ncchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 14px;min-height:40px;font-size:13px;font-weight:600}
.ncchip b{font-weight:800;font-size:12px;background:var(--surface);border-radius:99px;padding:1px 9px;color:var(--ink2)}
.ncchip i{width:11px;height:11px;border-radius:50%;flex:none}
.ncchip.mid i,.ncl.mid i{background:#fab219}.ncchip.bad i{background:#d03b3b}.ncchip.ok i{background:#3fae49}.ncchip.none i{background:#8b8e9b}
.ncchip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.ncchip:hover{border-color:var(--ink2)}
/* جدول مشتریان: عرض زیاد با اسکرول افقی، سربرگ چسبان و دو ستون اول چسبان (کد و نام) */
.ncscroll{max-height:72vh}
.nctable{border-collapse:separate;border-spacing:0;width:100%;min-width:1900px;font-size:13px}
.nctable th{position:sticky;top:0;z-index:3;background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12px;padding:10px 9px;text-align:center;cursor:pointer;user-select:none;max-width:140px;line-height:1.5;vertical-align:middle}
.nctable th:hover{color:var(--ink)}.nctable th i{font-style:normal;font-size:9px;margin-inline-start:4px;color:var(--accent)}
.nctable th.ncpa{cursor:default;width:58px;min-width:58px}
.nctable td{padding:9px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;background:var(--surface);vertical-align:middle}
.nctable td.nca{text-align:start;min-width:260px;max-width:340px}.nctable td.ncw{min-width:120px}
.nctable td.ncn{text-align:start;min-width:190px;font-weight:700}
.nctable th:first-child,.nctable td.ncc{position:sticky;inset-inline-start:0;z-index:2;width:82px;min-width:82px;color:var(--ink2)}
.nctable th:first-child{z-index:4;background:var(--surface2)}
.nctable th:nth-child(2),.nctable td.ncn{position:sticky;inset-inline-start:82px;z-index:2}
.nctable th:nth-child(2){z-index:4;text-align:start}
.nctable td.z{color:var(--muted);font-size:12px}
.nctable mark{background:color-mix(in srgb,var(--mid-t) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.ncm{color:var(--primary);text-decoration:none;font-weight:600}.ncm:hover{text-decoration:underline}
/* رنگ‌آمیزی ردیف بر اساس وضعیت؛ نوار رنگی کناری با inset box-shadow (بدون تغییر چیدمان) */
.ncr-mid td{background:color-mix(in srgb,#fab219 17%,var(--surface))}
.ncr-bad td{background:color-mix(in srgb,#d03b3b 19%,var(--surface))}
.ncr-mid td.ncc,.ncr-mid td.ncn{box-shadow:inset 3px 0 0 #fab219}.ncr-bad td.ncc,.ncr-bad td.ncn{box-shadow:inset 3px 0 0 #d03b3b}
.ncr-mid:hover td{background:color-mix(in srgb,#fab219 28%,var(--surface))}.ncr-bad:hover td{background:color-mix(in srgb,#d03b3b 30%,var(--surface))}
.ncr-ok:hover td,.ncr-none:hover td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
/* نشان تعداد روز (ncd) با رنگ هر وضعیت */
.ncd{display:inline-block;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:800;white-space:nowrap;border:1.5px solid transparent}
.ncd-mid{background:#fab219;color:#2a1d00}.ncd-bad{background:#d03b3b;color:#fff}
.ncd-ok{background:color-mix(in srgb,#3fae49 20%,transparent);color:var(--good-t);border-color:color-mix(in srgb,#3fae49 55%,transparent)}
.ncd-none{background:var(--track);color:var(--ink2)}
/* دکمهٔ نمایش روی نقشه؛ حالت off وقتی مختصات وجود ندارد */
.ncmap{display:inline-grid;place-items:center;width:36px;height:36px;border:none;border-radius:9px;background:var(--bg);color:var(--accent);cursor:pointer}
.ncmap:hover{background:var(--accent);color:var(--on-accent)}.ncmap.off{opacity:.35;cursor:not-allowed}
.nctable .pal{display:none}
/* صفحه‌بندی، نمودار دایره‌ای و راهنما و KPIهای این تب */
.ncpager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 8px 4px}
.ncpi{font-size:12.5px;color:var(--ink2)}.ncpb{display:flex;align-items:center;gap:6px}
.ncpb button{min-height:38px;min-width:38px;padding:0 12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;font:inherit;font-size:13px}
.ncpb button:disabled{opacity:.4;cursor:default}.ncpb button:not(:disabled):hover{border-color:var(--accent)}
.ncpn{font-size:13px;padding:0 6px}
.ncpie{display:grid;place-items:center;padding:6px 0}
.nclg{display:grid;gap:6px}
.ncl{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px}
.ncl i{width:12px;height:12px;border-radius:50%}.ncl em{font-style:normal;color:var(--ink2);font-size:12px;min-width:46px;text-align:end}
.nckg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nck{background:var(--bg);border-radius:10px;padding:10px 8px;display:grid;justify-items:center;text-align:center;gap:2px}.nck b{font-size:19px}.nck small{color:var(--ink2);font-size:11.5px;line-height:1.4}
.xl[role=button]{cursor:pointer}.xl[role=button]:hover{outline:1.5px solid var(--line)}
/* برگهٔ نقشه (bottom sheet): لایه تمام‌صفحه با z-index:90؛ pointer-events:none تا وقتی بسته است کلیک‌ها را نگیرد و با کلاس on فعال می‌شود */
/* map sheet */
.nmw{position:fixed;inset:0;z-index:90;pointer-events:none}
.nmw.on{pointer-events:auto}
.nmb{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}.nmw.on .nmb{opacity:1}
/* خود برگه از پایین صفحه بالا می‌آید (transform + transition)؛ حداکثر عرض ۱۱۸۰ و وسط‌چین با margin-inline:auto */
.nms{position:absolute;left:0;right:0;bottom:0;margin-inline:auto;width:min(1180px,100%);height:88dvh;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.nmw.on .nms{transform:none}
/* دستگیره (grip) بالای برگه برای کشیدن و بستن؛ touch-action:none تا مرورگر اسکرول نکند */
.nmgrip{display:grid;place-items:center;padding:9px 0 3px;cursor:grab;touch-action:none}.nmgrip i{width:46px;height:5px;border-radius:9px;background:var(--line)}
.nmhd{display:flex;justify-content:space-between;align-items:center;padding:2px 16px 8px}.nmhd h3{margin:0;font-size:17px}
.nmx{width:40px;height:40px;border:none;border-radius:10px;background:var(--bg);color:var(--ink);display:grid;place-items:center}
.nmctl{padding:0 16px;display:grid;gap:10px}
.nmone{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.nminfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px 8px;font-size:12.5px;color:var(--ink2)}
.nmlgs{display:flex;gap:12px;flex-wrap:wrap}.nmlg{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}.nmlg i{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff}.nmlg b{color:var(--ink2);font-weight:700}
/* ظرف نقشه: isolation:isolate یک stacking context جدا می‌سازد تا z-indexهای داخلی Leaflet (تا 1000) از برگه بیرون نزنند */
.nmmapw{position:relative;flex:1;min-height:0;isolation:isolate}
#nmMap{position:absolute;inset:0;background:var(--bg);z-index:0;font-family:inherit}
/* یادداشت روی نقشه (z-index:500) بالاتر از کاشی‌ها و پایین‌تر از دکمه‌ها */
.nmnote{position:absolute;z-index:500;top:10px;inset-inline:10px;margin-inline:auto;width:fit-content;max-width:calc(100% - 20px);background:var(--surface);color:var(--ink);border:1.5px solid var(--warn);border-radius:10px;padding:7px 12px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
/* حالت تیرهٔ نقشه: کاشی‌های روشن با فیلتر invert+hue-rotate تیره می‌شوند در حالی که رنگ‌ها تقریباً سر جای خود می‌مانند (فقط در تم تیره) */
:root:not([data-theme="light"]) #nmMap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
/* پاپ‌آپ Leaflet با رنگ‌های تم و محتوای نشانگر (nmp) */
#nmMap .leaflet-popup-content-wrapper{border-radius:12px;background:var(--surface);color:var(--ink)}
#nmMap .leaflet-popup-tip{background:var(--surface)}
#nmMap .leaflet-popup-content{margin:12px 14px;font-family:inherit;min-width:200px}
.nmp b{display:block;font-size:14.5px;margin-bottom:8px;line-height:1.6}
.nmp>div{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;padding:4px 0;border-top:1px dashed var(--line);align-items:center}
.nmp span{color:var(--ink2)}.nmp em{font-style:normal;font-weight:700;color:var(--ink)}.nmp .ncd{color:inherit}.nmp .ncd-mid{color:#2a1d00}.nmp .ncd-bad{color:#fff}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink2)}
/* موبایل: برگه بلندتر و جدول مشتریان به کارت تبدیل می‌شود (همان الگوی data-l در لیست قیمت) */
@media(max-width:700px){.ncsel{grid-template-columns:1fr}.nms{height:92dvh;border-radius:16px 16px 0 0}.nminfo{padding-top:8px}
  .nctable{min-width:0}.nctable thead{display:none}.nctable,.nctable tbody{display:block}.ncscroll{max-height:none;overflow:visible}
  .nctable tr{display:grid;grid-template-columns:1fr;gap:3px 14px;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
  .nctable td,.ncr-mid td,.ncr-bad td{display:flex;justify-content:space-between;align-items:center;gap:8px;border:none;padding:3px 0;font-size:12.5px;position:static!important;width:auto!important;min-width:0!important;max-width:none!important;text-align:start;background:none!important;box-shadow:none!important}
  .nctable td::before{content:attr(data-l);color:var(--ink2);font-size:11.5px;flex:none;max-width:62%;line-height:1.5}
  .nctable td.ncn{grid-column:1/-1;grid-row:1;display:block;font-size:14.5px;line-height:1.7;padding:2px 0 8px;padding-inline-end:120px;min-height:44px}.nctable td.ncn::before{content:none}
  .nctable td.nca,.nctable td.ncw,.nctable td.ncdd{grid-column:1/-1}
  .nctable td.ncc{grid-column:1/-1;grid-row:2;border-bottom:1px dashed var(--line);margin-bottom:4px;padding-bottom:6px}
  .nctable td.ncpa{position:absolute!important;z-index:6!important;top:10px;inset-inline-end:10px;display:block;padding:0}.nctable td.ncpa::before{content:none}
  .ncr-mid{background:color-mix(in srgb,#fab219 17%,var(--surface))!important;box-shadow:inset 4px 0 0 #fab219}.ncr-bad{background:color-mix(in srgb,#d03b3b 19%,var(--surface))!important;box-shadow:inset 4px 0 0 #d03b3b}
  .ncmap{width:auto;height:44px;padding:0 14px;display:inline-flex;gap:6px;align-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px}.nctable .pal{display:inline}
  .ncmap.off{background:var(--track);color:var(--ink2)}
  .nctable tr.plempty{display:block}
}

.nminfo{align-items:flex-end}.nmbase{min-width:170px}.nmbase select{min-height:38px;font-size:13px}
.nmcache{font-size:11.5px;color:var(--ink2)}.nmlink{background:none;border:none;color:var(--primary);font:inherit;font-size:11.5px;padding:0 4px;text-decoration:underline;cursor:pointer}
/* === برگهٔ نقشه نسخه ۲: پنل کنترل، تمام‌صفحه، پاپ‌آپ گوگل و حالت فشردهٔ موبایل === */
/* map sheet v2: panel, full screen, google popup, compact mobile */
.nmpanel{padding:0 16px;display:grid;gap:10px}
.nmsearch{min-height:44px}
/* دکمه تمام‌صفحه روی نقشه؛ در حالت full (کلاس .nms.full) برگه 100dvh می‌شود و grip و هدر و پنل و اطلاعات مخفی می‌شوند تا نقشه بیشترین فضا را داشته باشد */
.nmfs{position:absolute;z-index:600;top:10px;inset-inline-end:10px;width:42px;height:42px;border:none;border-radius:10px;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:pointer}
.nmfs:hover{background:var(--accent);color:var(--on-accent)}
.nmfs .fi-out{display:none}.nms.full .nmfs .fi-out{display:block}.nms.full .nmfs .fi-in{display:none}
.nmfs.nmfc{display:none;inset-inline-end:60px}.nms.full .nmfs.nmfc{display:grid}
.nms.full{height:100dvh;width:100%;border-radius:0}
.nms.full .nmgrip,.nms.full .nmhd,.nms.full .nmpanel,.nms.full .nminfo{display:none}
.nmw.on .nms.full{transform:none}
.nminfo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between}
.nmbase{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.nmbase select{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:9px;min-height:34px;padding:0 8px;font:inherit;font-size:12.5px}
.nmps{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.nmp b{margin-bottom:4px}.nmpa{margin:0 0 8px;font-size:12.5px;line-height:1.7;color:var(--ink2)}
/* لایهٔ نقشه گوگل (#nmG) هم‌اندازه ظرف و زیر کنترل‌ها */
#nmG{position:absolute;inset:0;z-index:0}
.ncchip.reset{color:var(--ink2);border-style:dashed}.ncchip.reset:hover{color:var(--ink);border-color:var(--accent)}
:root:not([data-theme="light"]) #nmMap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
/* موبایل: چیپ‌ها یک خط افقی اسکرولی با snap؛ پنل حداکثر ۴۶٪ ارتفاع تا نقشه کوچک نشود */
@media(max-width:700px){
  .ncsel{grid-template-columns:1fr 1fr;gap:8px}
  .ncf label{font-size:11px}.ncf select{min-height:40px;font-size:13px;padding:0 8px}
  .ncchips{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .ncchips::-webkit-scrollbar{display:none}
  .ncchip{flex:none;min-height:34px;padding:4px 11px;font-size:12.5px;gap:5px;scroll-snap-align:start}
  .ncchip b{font-size:11px;padding:0 7px}
  .ncchip[aria-pressed="true"]{box-shadow:0 0 0 1px var(--accent) inset}
  .nms{height:97dvh}
  .nmgrip{padding:7px 0 1px}.nmhd{padding:0 12px 6px}.nmhd h3{font-size:15px}.nmx{width:36px;height:36px}
  .nmpanel{padding:0 12px;gap:8px;max-height:46%;overflow:auto}
  .nmsearch{min-height:40px}.nmsearch input{font-size:13.5px}
  .nminfo{padding:6px 12px;gap:4px 10px;font-size:11.5px}.nmlgs{gap:8px}.nmlg i{width:10px;height:10px}
  .nmcache{display:none}.nmbase span{display:none}.nmbase select{min-height:30px;font-size:12px}
  .nmmapw{flex:1 1 50%;min-height:48%}
  .nmfs{width:44px;height:44px}.nmfs.nmfc{inset-inline-end:64px}
}
/* دکمه‌های تمام‌صفحه با right فیزیکی جای‌گذاری می‌شوند چون کنترل‌های نقشه چپ‌به‌راست‌اند و جهت RTL نباید آن‌ها را جابه‌جا کند */
.nmfs{inset-inline-end:auto;right:10px}.nmfs.nmfc,.nms.full .nmfs.nmfc{inset-inline-end:auto;right:62px}
.ncchip.reset{text-decoration:none}
.nms{height:93dvh}
/* دسکتاپ: پنل کنترل افقی و چندستونه */
@media(min-width:701px){
  .nmpanel{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
  .nmpanel .ncsel{flex:2 1 420px}.nmpanel .nmsearch{flex:1 1 260px}.nmpanel .ncchips{flex:1 1 100%}
}
@media(max-width:700px){.nmfs.nmfc,.nms.full .nmfs.nmfc{right:64px}}

/* پاپ‌آپ یکپارچه برای Google InfoWindow و Leaflet: قاب پیش‌فرض گوگل با !important خنثی و با رنگ‌های تم جایگزین شده است؛ دکمهٔ بستن پیش‌فرض مخفی و دکمهٔ خودمان (nmpx) استفاده می‌شود */
/* unified popup (Google InfoWindow + Leaflet popup) */
.gm-style .gm-style-iw-c{background:var(--surface)!important;color:var(--ink)!important;border-radius:14px!important;padding:0!important;box-shadow:0 8px 30px rgba(0,0,0,.5)!important;max-width:320px!important;border:1px solid var(--line)}
.gm-style .gm-style-iw-d{overflow:auto!important;max-height:60vh!important;padding:0!important}
.gm-style .gm-style-iw-tc::after{background:var(--surface)!important}
.gm-style .gm-style-iw-chr,.gm-style .gm-ui-hover-effect{display:none!important}
#nmMap .leaflet-popup-content-wrapper{padding:0}#nmMap .leaflet-popup-content{margin:0;width:auto!important;min-width:230px}
/* محتوای پاپ‌آپ: فاصلهٔ داخلی برای جا دادن دکمهٔ بستن در گوشه */
.nmp{position:relative;padding:14px 14px 12px;min-width:230px;max-width:300px;font-family:inherit;color:var(--ink)}
.nmp b,.nmp .nmps,.nmp .nmpa{padding-inline-start:34px}
.nmp .nmpa{padding-inline-start:0}
.nmpx{position:absolute;top:8px;left:8px;width:30px;height:30px;border:none;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.nmpx:hover{background:var(--crit);color:#fff}
.nmp b{padding-inline-start:0;padding-inline-end:34px}.nmp .nmps{padding-inline-start:0;padding-inline-end:34px}
/* بخش مسیریابی (details/summary): فهرست برنامه‌های نقشه برای رفتن به مشتری */
.nmnav{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.nmnav summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;min-height:40px}
.nmnav summary::-webkit-details-marker{display:none}
.nmnavg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.nmnavg a,.nmnavg button{display:flex;align-items:center;justify-content:center;text-align:center;min-height:38px;padding:6px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;line-height:1.4}
.nmnavg a:first-child{grid-column:1/-1;border-color:var(--accent)}
.nmnavg a:hover,.nmnavg button:hover{border-color:var(--accent)}
/* در حالت ماهواره‌ای فیلتر تیره‌سازی کاشی‌ها حذف می‌شود تا تصویر واقعی دیده شود */
#nmMap.nm-sat .leaflet-tile-pane{filter:none!important}
/* راهنمای موبایل: فقط در عرض کم نمایش داده می‌شود */
.nchint{display:none;margin:-2px 0 0;font-size:11px;color:var(--muted);text-align:center}
@media(max-width:700px){.nchint{display:block}}
.nmp .nmnav summary span,.nmp .nmnav summary{color:var(--on-accent)!important}
/* یادداشت نقشه به پایین منتقل می‌شود تا زیر دکمه‌ها نرود */
.nmnote{top:auto!important;bottom:34px}

/* === تم روشن: با ویژگی data-theme=light روی <html> فعال می‌شود (اسکریپت ابتدای head مقدار ذخیره‌شده در localStorage را قبل از رندر اعمال می‌کند تا چشمک‌زدن رخ ندهد) === */
/* light theme */
/* فقط توکن‌ها بازنویسی می‌شوند؛ بیشتر قواعد بدون تغییر کار می‌کنند و فقط چند استثنا در ادامه آمده */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f3f8; --side:#ffffff; --surface:#ffffff; --surface2:#e8ebf3;
  --ink:#16181f; --ink2:#51566a; --muted:#6c7185; --line:#dde1ec; --track:#e2e6ef;
  --accent:#2c7a71; --on-accent:#ffffff; --primary:#1672d6;
  --good-t:#0f7a2c; --bad-t:#c62828; --mid-t:#9a5b00;
  --tipbg:#16181f; --tipink:#ffffff; --black:#eceff6;
}
/* استثناهای تم روشن: hover، سایه‌ها و رنگ‌هایی که با توکن‌ها قابل پوشش نبودند */
:root[data-theme="light"] .mi:not([aria-selected="true"]):hover,:root[data-theme="light"] .slot:hover{background:rgba(0,0,0,.05)}
:root[data-theme="light"] .box .err{color:#c62828}
:root[data-theme="light"] .scrim{background:rgba(20,22,35,.45)}
:root[data-theme="light"] .calcbtn,:root[data-theme="light"] #menuBtn{box-shadow:0 4px 14px rgba(44,122,113,.25)}
:root[data-theme="light"] .clb,:root[data-theme="light"] .cbox,:root[data-theme="light"] #tip.touch{box-shadow:0 12px 32px rgba(20,22,35,.22)}
/* دکمهٔ تغییر تم: در سایدبار پایین‌چسب؛ نسخهٔ سربرگ (.thm-h) فقط در تبلت/موبایل که سایدبار کشویی است نمایش داده می‌شود */
.mi.thm{margin-top:auto;border:1px solid var(--line);justify-content:flex-start}
.thm-h{display:none;width:44px;padding:0}
@media(max-width:1099px){.thm-h{display:inline-flex}}
/* لمسی: نگه‌داشتن انگشت tooltip را نشان می‌دهد؛ برای همین انتخاب متن، منوی لمسی و هایلایت ضربه روی عناصر دارای data-tip غیرفعال شده تا مرورگر long-press را مصادره نکند */
/* touch: long-press shows the tooltip, nothing gets selected */
[data-tip],[data-tip] *,.panel svg,.vbars,.brow,.slot{-webkit-tap-highlight-color:transparent}
@media(pointer:coarse){[data-tip],[data-tip] *,.panel svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
/* tooltip در حالت لمسی بزرگ‌تر و با سایهٔ پررنگ‌تر؛ عرض حداکثر طوری که از صفحه بیرون نزند */
#tip{max-width:min(300px,calc(100vw - 16px))}
#tip.touch{box-shadow:0 8px 28px rgba(0,0,0,.55);padding:9px 13px;font-size:13px}
/* انتخاب نمای داده (مدیریت/عمومی) در سایدبار */
.vas{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:6px;margin-top:8px;font-size:12px;color:var(--ink2)}
.vseg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.vseg button{min-width:0;border:none;background:none;color:var(--ink2);font:inherit;font-size:12px;font-weight:600;padding:8px 4px;border-radius:8px}
.vseg button.on{background:var(--accent);color:var(--on-accent)}
.vas input{width:100%;min-width:0;box-sizing:border-box;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;font:inherit;font-size:13px;text-align:center}
/* واکنش‌گرایی اصلی: زیر ۱۱۰۰ سایدبار منوی کشویی از سمت راست می‌شود (translateX(100%) در RTL خارج از صفحه است) و دکمهٔ منو ظاهر می‌شود؛ زیر ۸۵۰ پنل خلاصه هم کشوی چپ می‌شود */
/* responsive: <1100 sidebar becomes a drawer, <850 summary becomes a drawer too */
@media(max-width:1099px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:260px;height:100%;z-index:40;transform:translateX(100%);transition:transform .25s}
  .side.open{transform:none}
  .summary{position:static;height:auto;margin:0 18px 18px;border-radius:8px}
  #menuBtn{display:inline-flex}
}
/* زیر ۸۵۰: پنل خلاصه کشوی ثابت از چپ؛ آمار دو ستونه؛ حاشیهٔ بالا با safe-area برای گوشی‌های دارای ناچ */
@media(max-width:849px){
  .vscroll-hint{display:block}
  .summary{position:fixed;top:0;bottom:0;left:0;margin:0;width:min(84vw,360px);height:100%;z-index:40;border-radius:0;transform:translateX(-100%);transition:transform .25s}
  .summary.open{transform:none}
  #sumBtn{display:inline-flex}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .main{padding:14px;padding-top:max(14px,env(safe-area-inset-top,0px))}
}
/* کاهش حرکت: انیمیشن کشوها غیرفعال می‌شود */
@media(prefers-reduced-motion:reduce){.side,.summary,.scrim{transition:none}}

/* ----- دکمه‌ی چشم برای نمایش/پنهان‌کردن رمز (فیلدهای رمز ورود مدیر و رمز نمای مدیریت) ----- */
/* .pw دور فیلد رمز است تا دکمه‌ی چشم با position:absolute روی لبه‌ی چپ همان فیلد بنشیند */
.pw{position:relative;display:block}
.box .pw>input,.vas .pw>input{padding-left:42px;padding-right:42px}
.eye{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:8px;cursor:pointer}
.eye:hover{color:var(--ink)}

/* ----- ماشین‌حساب: سفارش اصلی چندکالایی ----- */
/* ردیف ورودی فشرده: [جستجوی کالا][تعداد + دکمه‌ی افزودن] */
.cinm{grid-template-columns:minmax(0,1fr) auto;align-items:end}
.cqa{display:flex;gap:8px;align-items:end}
.cqa .cq{width:150px}
.madd{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 16px;border:none;border-radius:10px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.madd:hover{filter:brightness(1.08)}
/* لرزش کوتاه فیلد جستجو وقتی کالا/تعداد معتبر نیست و کاربر «افزودن» را می‌زند */
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.combo.shake{animation:shk .35s;border-color:var(--crit)}
/* خط پیش‌نمایش کالای در حال انتخاب (موجودی، تعداد در باکس، قیمت‌ها) */
.cpv{display:block}
.chint.pv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2)}
.chint.pv b{color:var(--ink);font-weight:700}
.chint.pv.warn{color:var(--mid-t)}
/* فهرست کالاهای افزوده‌شده: هر ردیف کم‌جا؛ نام + شمارنده‌ی کوچک + حذف، و زیرش قیمت باکس/بطر */
.mlist{display:grid;gap:6px;min-width:0}
.mlist:empty{display:none}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 10px;align-items:center;background:var(--bg);border-radius:10px;padding:7px 10px;border:1px solid transparent}
.mrow.warn{border-color:var(--warn)}
.mn{min-width:0;font-weight:700;font-size:13.5px}
.mn span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mst{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mst button{border:none;background:var(--surface2);color:var(--ink);width:26px;height:26px;display:grid;place-items:center;padding:0}
.mst button:hover{background:var(--accent);color:var(--on-accent)}
.mqi{width:38px;text-align:center;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-weight:700;font-size:13.5px;padding:0}
.mst em{font-style:normal;font-size:11px;color:var(--muted);padding:0 6px 0 2px}
.mdel{border:none;background:none;color:var(--muted);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;padding:0;cursor:pointer}
.mdel:hover{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.mpr{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--ink2)}
.mpr b{color:var(--ink);font-weight:700}
.mpr .mam b{color:var(--accent)}
.mpr .mdc{color:var(--good-t)}
.mpr .mdc b{color:var(--good-t)}
.mwn{color:var(--mid-t);display:inline-flex;align-items:center;gap:4px}
@media(max-width:560px){.cinm{grid-template-columns:1fr}.cqa .cq{flex:1;width:auto}.mrow{grid-template-columns:minmax(0,1fr) auto}.mst{grid-column:1/2;justify-self:start}.mdel{grid-column:2/3;grid-row:1}}
/* موجودی کالا در ردیف فهرست سفارش اصلی/اشانتیون */
.mpr .mst2 b{color:var(--ink)}

/* === ردیاب، پرسنل و ورود به سرور (85_server.js) === */
/* ورود تمام‌صفحه‌ی نسخه‌ی مشاهده؛ روی همه‌ی محتوا قرار می‌گیرد تا قبل از ورود چیزی دیده نشود */
.srvl{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.srvbox{width:min(100%,380px);padding:26px;gap:10px}
.srvbox h3{text-align:center;font-size:20px}
.srvbox p{text-align:center;min-height:0}
.srvbox .err{text-align:center}
.srvlogo{width:88px;height:88px;border-radius:50%;margin:0 auto 4px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.srvuser{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2);padding:6px 4px}
.srvuser button{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 12px;color:var(--ink)}
.srvuser button:hover{background:rgba(255,255,255,.06)}
/* نوار فیلتر مشترک ردیاب و پرسنل */
.trk-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.trk-bar input,.trk-bar select,.stf-form input,.stf-form select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.trk-bar input{flex:1 1 200px}
.trk-bar select{flex:0 1 150px}
.trk-info{font-size:12.5px;color:var(--ink2);flex:1 1 100%}
.trk-info.bad{color:#ff7b7b}
.trk-retry{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:8px;padding:2px 12px;margin-inline-start:8px}
/* چیدمان ردیاب: فهرست کنار نقشه (در موبایل زیر هم) */
.trk{display:grid;gap:10px}
.trk-body{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;height:calc(100vh - 250px);min-height:460px}
.trk-list{overflow:auto;display:grid;align-content:start;gap:6px;padding-inline-end:2px}
.trk-map{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:320px}
#trkMap{position:absolute;inset:0;background:var(--bg);z-index:0;font-family:inherit}
:root:not([data-theme="light"]) #trkMap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.trk-it{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;transition:background .2s,border-color .2s,transform .15s}
.trk-it:hover{background:var(--surface2)}
.trk-it.on{border-color:var(--accent);background:var(--surface2)}
.trk-it:active{transform:scale(.985)}
.trk-av{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;background:#1769e0}
.trk-av.sup{background:#7b3fe4}.trk-av.mgr{background:#0f8a6b}
.trk-tx{display:grid;min-width:0;flex:1}
.trk-tx b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk-tx small{color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk-ago{flex:none;font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.trk-ago i{width:8px;height:8px;border-radius:50%;background:#8b8e9b}
.trk-ago.live i{background:#2fbf5b;box-shadow:0 0 0 0 rgba(47,191,91,.6);animation:trkdot 1.8s infinite}
.trk-ago.recent i{background:#e5a300}
/* نشانگرهای نقشه */
.trkm{background:none;border:none}
.trkd{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;font-size:16px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);background:#1769e0;--c:23,105,224;transition:transform .2s}
.trkd.sup{background:#7b3fe4;--c:123,63,228}
.trkd.old{background:#8b8e9b;--c:139,142,155}
.trkd.live{animation:trkpulse 2s infinite}
.trkd.on{transform:scale(1.22);border-color:#ffd54a}
@keyframes trkpulse{0%{box-shadow:0 2px 8px rgba(0,0,0,.45),0 0 0 0 rgba(var(--c),.55)}100%{box-shadow:0 2px 8px rgba(0,0,0,.45),0 0 0 16px rgba(var(--c),0)}}
@keyframes trkdot{0%{box-shadow:0 0 0 0 rgba(47,191,91,.6)}100%{box-shadow:0 0 0 7px rgba(47,191,91,0)}}
/* پنل شخص انتخاب‌شده روی نقشه */
.trk-sel{position:absolute;z-index:500;inset-inline:10px;bottom:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.4);max-width:420px;animation:trkin .3s ease-out}
@keyframes trkin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.trk-sh{display:flex;align-items:center;gap:10px}
.trk-sh>div{display:grid;flex:1;min-width:0}
.trk-sh small{color:var(--ink2);font-size:12px}
.trk-x{border:none;background:none;color:var(--ink2);font-size:16px;width:32px;height:32px;border-radius:8px}
.trk-x:hover{background:rgba(255,255,255,.08)}
.trk-ss{font-size:12.5px;color:var(--ink2)}
.trk-sel .ubtn{flex:none;width:100%}
/* پرسنل */
.stf{display:grid;gap:16px}
.stf-form,.stf-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.stf h3{margin:0;font-size:16px;font-weight:800}
.stf h3 small{color:var(--ink2);font-weight:500;font-size:12.5px}
.stf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stf-grid label{display:grid;gap:5px;font-size:12.5px;color:var(--ink2)}
.stf-grid input,.stf-grid select{width:100%;background:var(--bg)}
.stf-act{display:flex;gap:8px;flex-wrap:wrap}
.stf-act .ubtn{flex:0 0 auto;min-width:130px}
.stf .err{color:#ff7b7b;font-size:13px;min-height:18px}
.stf .err.ok{color:var(--good-t)}
.stf-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);border-radius:8px}
.stf-row.on{background:var(--surface2)}
.stf-row em{font-style:normal;color:var(--ink2);font-weight:500;font-size:12px}
.stf-btns{display:flex;gap:6px;flex:none}
.stf-btns .ubtn{flex:none;padding:5px 12px;font-size:12.5px}
.ubtn.dng{border-color:#d03b3b;color:#ff7b7b}
.ubtn.dng:hover{background:rgba(208,59,59,.14)}
@media(max-width:849px){
  .trk-body{grid-template-columns:1fr;height:auto}
  .trk-list{max-height:230px}
  .trk-map{height:62vh;min-height:360px}
  .trk-bar select{flex:1 1 140px}
  .stf-row{flex-wrap:wrap}.stf-btns{width:100%}.stf-btns .ubtn{flex:1}
}
@media(prefers-reduced-motion:reduce){.trkd.live,.trk-ago.live i,.trk-sel{animation:none}}
</style></head>
