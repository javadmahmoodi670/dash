/* راهنمای شناور (tooltip): با ماوس روی عناصر data-tip و در لمس با نگه‌داشتن حدود ۰٫۴ ثانیه */
/* tooltip */
const tip=$('#tip');
let lpT=0,lpX=0,lpY=0,lpEl=null,lpSwallow=0,lpShown=0;
// کلیدهای نرمال‌شده‌ی نام برای تطبیق نام ویزیتور/گروه محصول بین داده‌ی فروش و داده‌ی پوشش (فاصله و نیم‌فاصله حذف می‌شود).
const cvKey=s=>normFa(s).replace(/[\s‌]+/g,'');
const cvPk=s=>{const k=cvKey(s);return k.includes('چیلایف')?'آب':k};
const cvGm=(z,g)=>{const a=cvPk(z),b=cvKey(g.t);return a===b||(a.length>2&&(a.includes(b)||b.includes(a)))};
// tipExtra: به tooltip نمودارهای صفحه‌ی نمای کلی و ویزیتور، اطلاعات پوشش (تعداد مشتری دارای محصول) را اضافه می‌کند؛
// بر اساس ویزیتور، شعبه یا کل انتخاب‌شده. هر خطا بی‌صدا نادیده گرفته می‌شود تا tooltip اصلی خراب نشود.
function tipExtra(p){
  try{const cv=D&&D.cov;if(!cv||!p[0])return p;const k=cvKey(p[0]);let hit=null;
    for(const s of cv.sups)for(const v of s.visitors)if(cvKey(v.name)===k)hit=v;
    if(!hit){
      const g=st.view==='overview'?cv.groups.find(x=>cvGm(p[0],x)):null;
      if(!g)return p;
      const n=nf0.format;let d=null,sc='';
      if(st.visitor!=='all'){
        let v=null;cv.sups.forEach(s=>s.visitors.forEach(x=>{if(String(x.code)===String(st.visitor))v=x}));
        if(!v){const nm=((D.branches||[]).flatMap(b=>b.rows).find(r=>String(r.code)===String(st.visitor))||{}).visitor;cv.sups.forEach(s=>s.visitors.forEach(x=>{if(nm&&cvKey(x.name)===cvKey(nm))v=x}))}
        if(v){d=v;sc='ویزیتور'}
      }else if(st.branch!=='all'){
        const br=(D.branches||[]).find(b=>b.name===st.branch),codes=new Set((br?br.rows:[]).map(r=>String(r.code))),names=new Set((br?br.rows:[]).map(r=>cvKey(r.visitor)));
        let best=null,bc=0;cv.sups.forEach(s=>{const c=s.visitors.filter(v=>codes.has(String(v.code))||names.has(cvKey(v.name))).length;if(c>bc){bc=c;best=s}});
        if(best){d=best.tot;sc='سرپرست '+best.name}
      }else{d=cvAllT();sc='کل'}
      if(!d)return p;
      if(!d.total)return p.concat(['پوشش: مشتری فعالی ثبت نشده']);
      return p.concat([`مشتری دارای ${g.t} (${sc}): ${n(d.g[g.k].n)} تا از ${n(d.total)} مشتری فعال (${pctF(d.g[g.k].n/d.total)})`]);
    }
    if(!hit.total)return p.concat(['پوشش: مشتری فعالی ثبت نشده']);
    const g=cv.groups.find(x=>p.slice(1).some(z=>{if(/[:：]/.test(z))return false;return cvGm(z,x)}));
    const n=nf0.format;
    return p.concat([g?`مشتری دارای ${g.t}: ${n(hit.g[g.k].n)} تا از ${n(hit.total)} مشتری فعال (${pctF(hit.g[g.k].n/hit.total)})`:`مشتری خرید کرده: ${n(hit.buyers)} تا از ${n(hit.total)} مشتری فعال (${pctF(hit.buyers/hit.total)})`]);
  }catch(e){return p}
}
// تغییر تم: آیکون‌ها و متن دکمه، و ذخیره‌ی انتخاب در localStorage. حالت پیش‌فرض تیره است و روشن با data-theme=light.
const THEME_ICONS={sun:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',moon:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>'};
function themeNow(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark'}
function syncThemeUi(){
  const light=themeNow()==='light',lbl=light?'حالت تیره':'حالت روشن',icon=light?THEME_ICONS.moon:THEME_ICONS.sun;
  document.querySelectorAll('[data-theme-toggle]').forEach(b=>{const i=b.querySelector('.ti'),l=b.querySelector('.tl');if(i)i.innerHTML=icon;if(l)l.textContent=lbl;b.setAttribute('aria-label','تغییر به '+lbl);b.setAttribute('title','تغییر به '+lbl)});
}
function setTheme(t){
  if(t==='light')document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('hj-theme',t)}catch(_){}
  syncThemeUi();
}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-theme-toggle]'))setTheme(themeNow()==='light'?'dark':'light')});
syncThemeUi();
// placeTip: متن tooltip را می‌سازد و جایش را طوری تنظیم می‌کند که از لبه‌ی صفحه بیرون نزند (لمسی بالای انگشت).
function placeTip(t,x,y,touch){
  const p=tipExtra(t.dataset.tip.split('|'));tip.innerHTML=`<b>${p[0]}</b>`+p.slice(1).map(z=>`<div>${z}</div>`).join('');tip.classList.toggle('touch',!!touch);tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;let tx,ty;
  if(touch){tx=Math.min(Math.max(8,x-w/2),innerWidth-w-8);ty=y-h-28;if(ty<8)ty=y+28;if(ty+h>innerHeight-8)ty=Math.max(8,innerHeight-h-8)}
  else{tx=x-w-12;ty=y+14;if(tx<8)tx=x+12;if(tx+w>innerWidth-8)tx=innerWidth-w-8;if(ty+h>innerHeight-8)ty=y-h-12}
  tip.style.left=tx+'px';tip.style.top=ty+'px'}
function showTip(e){if(e.pointerType==='touch')return;const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}placeTip(t,e.clientX,e.clientY,false)}
document.addEventListener('pointermove',showTip);document.addEventListener('pointerdown',showTip);
document.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')tip.hidden=true});document.addEventListener('scroll',()=>{if(Date.now()-lpShown>600)tip.hidden=true},true);
/* لمس: نگه‌داشتن حدود ۰٫۴ ثانیه روی نمودار/آیتم = مثل hover؛ تا لمس بعدی می‌ماند */
/* touch: hold ~0.4 s on a chart/item = same as hovering; stays until the next touch */
document.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch')return;
  if(Date.now()-lpShown>350)tip.hidden=true;
  clearTimeout(lpT);const t=e.target.closest&&e.target.closest('[data-tip]');if(!t)return;
  lpX=e.clientX;lpY=e.clientY;lpEl=t;
  lpT=setTimeout(()=>{placeTip(lpEl,lpX,lpY,true);lpShown=Date.now();lpSwallow=Date.now()+1500;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}},380);
});
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&lpT&&Math.hypot(e.clientX-lpX,e.clientY-lpY)>10){clearTimeout(lpT);lpT=0}});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,e=>{if(e.pointerType==='touch'){clearTimeout(lpT);lpT=0;if(lpSwallow)lpSwallow=Date.now()+450}}));
document.addEventListener('click',e=>{if(Date.now()<lpSwallow){e.stopPropagation();e.preventDefault();lpSwallow=0}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-tip],.panel svg'))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(lpT||Date.now()-lpShown<2500){const t=e.target.nodeType===1?e.target:e.target.parentElement;if(t&&t.closest&&t.closest('[data-tip]'))e.preventDefault()}});
document.addEventListener('scroll',()=>{clearTimeout(lpT);lpT=0},true);

/* راه‌اندازی اولیه */
// داده‌ی نمونه‌ی ذخیره‌شده (SNAPSHOT) بارگذاری و نمای اولیه از hash آدرس خوانده می‌شود؛ تغییر hash نما را عوض می‌کند.
/* init */
setData(SNAPSHOT);paintHeader();
const h0=(location.hash||'').slice(1);if(VIEWS.includes(h0))st.view=h0;
addEventListener('hashchange',()=>{const x=(location.hash||'').slice(1);if(VIEWS.includes(x)){st.view=x;render()}});
render();

// جریان مدیر: بارگذاری فایل، ورود و ذخیره فقط در نمایی که VIEWER نباشد وجود دارد؛ نسخه‌ی مشاهده‌گر این بخش را اصلاً اجرا نمی‌کند.
// ورود با نام کاربری/رمز و قفل چند ثانیه‌ای پس از ۵ تلاش ناموفق، قبل از انتخاب فایل لازم است.
if(!VIEWER){
let authed=!!window.__ADM,fails=0,lockUntil=0;setTimeout(syncVas,0);
const umsg=m=>{$('#umsg').textContent=m};
const openLogin=()=>{$('#loginErr').textContent='';$('#modal').hidden=false;$('#uName').focus()};
$('#upBtn').addEventListener('click',()=>{if(authed)$('#file').click();else openLogin()});
$('#cancel').addEventListener('click',()=>{$('#modal').hidden=true});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});
$('#loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  if(Date.now()<lockUntil){$('#loginErr').textContent='چند بار اشتباه وارد شد. چند ثانیه بعد دوباره تلاش کنید.';return}
  if(checkLogin($('#uName').value,$('#uPass').value)){authed=true;fails=0;$('#uPass').value='';$('#modal').hidden=true;umsg('ورود انجام شد. فایل اکسل را انتخاب کنید.');$('#file').click()}
  else{fails++;$('#loginErr').textContent='نام کاربری یا رمز عبور درست نیست.';$('#uPass').value='';if(fails>=5){lockUntil=Date.now()+30000;fails=0}}
});
// خواندن فایل گزارش: اگر شیت قیمت/مشتری خرید نکرده/پوشش/کدها در فایل جدید نباشد، نسخه‌ی قبلی نگه داشته می‌شود تا صفحه خالی نشود.
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f||!authed)return;
  umsg('در حال خواندن فایل…');
  try{
    const d=await parseReport(await f.arrayBuffer());d.uploadedAt=Date.now();
    if(!d.price&&D&&D.price){d.price=D.price;d.priceWarn=(d.priceWarn||'')+' (لیست قیمت قبلی نگه داشته شد)'}
    if(!d.nc&&D&&D.nc){d.nc=D.nc;d.ncWarn=(d.ncWarn||'')+' (اطلاعات قبلی مشتریان خرید نکرده نگه داشته شد)'}
    if(!d.cov&&D&&D.cov){d.cov=D.cov;d.covWarn=(d.covWarn||'')+' (اطلاعات پوشش قبلی نگه داشته شد)'}
    if(!d.codes&&D&&D.codes){d.codes=D.codes;d.codesWarn=(d.codesWarn||'')+' (کدهای قبلی نگه داشته شد)'}
    REALD=null;setData(d);syncVas();paintHeader();render();$('#saveBtn').hidden=false;$('#pubBtn').hidden=false;$('#pubRow').hidden=false;
    umsg('داشبورد به‌روز شد. با دکمه «ذخیره» نسخه مخصوص مشاهده را بسازید.'+(d.commWarn?' توجه: '+d.commWarn:'')+(d.priceWarn?' توجه: '+d.priceWarn:'')+(d.covWarn?' توجه: '+d.covWarn:'')+(d.ncWarn?' توجه: '+d.ncWarn:'')+(d.codesWarn?' توجه: '+d.codesWarn:'')+(d.alt?' نمای تیم فروش از شیت‌های (فیک) خوانده شد.':'')+(d.altWarn?' توجه: '+d.altWarn:''));
  }catch(err){umsg('خطا: '+(err&&err.message?err.message:err))}
  finally{e.target.value=''}
});
// ذخیره: نسخه‌ی HTML تک‌فایل و رمزگذاری‌شده می‌سازد. اگر داده‌ی واقعی و نمای تیمی (alt) هر دو وجود داشته باشد،
// دو نسخه ساخته می‌شود: رمز مدیر داده‌ی واقعی را باز می‌کند و رمز(کدپرسنلی) ها نمای تیمی (بدون قیمت) را؛ این همان جابه‌جایی «واقعی/تیمی» است.
// buildSealed: منطق مشترک «ذخیره» و «انتشار»؛ نسخه‌ی(های) مشاهده را می‌سازد، رمزنگاری می‌کند و متن نهایی HTML را برمی‌گرداند (یا در صورت خطا null).
async function buildSealed(){
  const real=REALD||D;
  const codes=[...new Set((real.codes||[]).map(pwNorm).filter(Boolean))];
  if(!codes.length){umsg('ذخیره نشد: ستون «کد پرسنلی» در شیت DataBase فایل اکسل پیدا نشد.');return null}
  let payloads,specs;
  if(real.alt){
    const rc=pwNorm($('#realPw').value);
    if(rc.length<4){umsg('رمز نمای مدیریت دست‌کم ۴ نویسه باشد.');return null}
    const team=Object.assign({},real,{branches:real.alt.branches,comm:real.alt.comm||real.comm,team:true,price:stripOut(real.price)});
    payloads=[buildSavedHtml(real),buildSavedHtml(team)];
    specs=[{pw:rc,i:0}].concat(codes.filter(c=>c!==rc).map(c=>({pw:c,i:1})));
  }else{payloads=[buildSavedHtml(Object.assign({},real,{team:true,price:stripOut(real.price)}))];specs=codes.map(c=>({pw:c,i:0}))}
  umsg('در حال رمزگذاری…');
  return sealHtml(payloads,specs,{iso:real.iso});
}
// ذخیره: نسخه‌ی HTML تک‌فایل و رمزگذاری‌شده می‌سازد و دانلود می‌کند. اگر داده‌ی واقعی و نمای تیمی (alt) هر دو وجود داشته باشد،
// دو نسخه ساخته می‌شود: رمز مدیر داده‌ی واقعی را باز می‌کند و رمز(کدپرسنلی) ها نمای تیمی (بدون قیمت) را؛ این همان جابه‌جایی «واقعی/تیمی» است.
$('#saveBtn').addEventListener('click',async()=>{
  if(!authed)return;
  try{
    const out=await buildSealed();if(!out)return;
    const blob=new Blob([out],{type:'text/html;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='sales-dashboard-'+(D.iso||'updated')+'.html';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    umsg((REALD||D).alt?'نسخه رمزگذاری‌شده ساخته شد. رمز نمای مدیریت داده واقعی را باز می‌کند و کدهای پرسنلی نمای تیم فروش را.':'نسخه رمزگذاری‌شده ساخته شد (در پوشه دانلودها). هر کد پرسنلیِ شیت DataBase رمز مشاهده است.');
  }catch(err){umsg('ذخیره نشد: '+(err&&err.message?err.message:err))}
});
// ---------- انتشار آنلاین روی GitHub Pages ----------
// چرا: GitHub Pages سرور ندارد، پس برای «جایگزین‌شدن» فایل قبلی از API رسمی GitHub (Contents API) استفاده می‌کنیم:
// فایل index.html مخزن را با همان مسیر و با sha فعلی آن بازنویسی می‌کنیم (PUT). نتیجه: آدرس ثابت می‌ماند و فقط یک نسخه‌ی جدید commit می‌شود.
// تنظیمات (owner/repo، شاخه، مسیر فایل و توکن) فقط در localStorage همین مرورگر می‌ماند و جایی ارسال نمی‌شود جز به api.github.com.
// توکن باید «Fine-grained» و فقط برای همین یک مخزن با دسترسی Contents: Read and write باشد.
// کلید نسخه‌ی ۲: تنظیمات قدیمی (که ممکن بود مسیر index.html داشته باشد) نادیده گرفته می‌شوند
const GH_KEY='hj-gh2';
const ghCfg=()=>{try{return JSON.parse(localStorage.getItem(GH_KEY)||'null')}catch(_){return null}};
// تبدیل متن به base64 با پشتیبانی از UTF-8 (به‌صورت تکه‌تکه تا برای فایل‌های بزرگ stack نشکند)
function b64utf8(str){const u=new TextEncoder().encode(str);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
// ghAsk: تنظیمات را از کاربر می‌پرسد (بار اول، یا با Shift+کلیک روی دکمه برای تغییر)
function ghAsk(old){
  const repo=(prompt('مخزن GitHub برای انتشار (به شکل نام‌کاربری/نام‌مخزن):',old&&old.repo||'')||'').trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return null;
  // مسیر پیش‌فرض view/index.html است؛ «index.html» ریشه همان فایل داشبورد مدیریت است و اجازه‌ی نوشتن روی آن داده نمی‌شود (قبلاً باعث بازنویسی مدیریت شد)
  const path=(prompt('مسیر فایل نسخه‌ی مشاهده داخل مخزن (پیشنهاد: view/index.html):',old&&old.path&&old.path!=='index.html'?old.path:'view/index.html')||'').trim().replace(/^\/+/,'');
  if(!path||path==='index.html'){alert('مسیر index.html در ریشه همان صفحه‌ی مدیریت است. مسیر دیگری مثل view/index.html بزنید.');return null}
  const branch=(prompt('نام شاخه (branch):',old&&old.branch||'main')||'').trim()||'main';
  const token=(prompt('توکن GitHub (Fine-grained، فقط همین مخزن، Contents: Read and write):',old&&old.token||'')||'').trim();if(!token)return null;
  const c={repo,path,branch,token};try{localStorage.setItem(GH_KEY,JSON.stringify(c))}catch(_){}return c;
}
// ghPublish: ۱) sha فایل فعلی را می‌گیرد (اگر نبود یعنی فایل جدید است) ۲) محتوا را با همان مسیر PUT می‌کند.
// ghSelf: اگر مسیر انتشار همان صفحه‌ای باشد که الان در آن هستیم (مثلاً index.html همین سایت)، انتشار نسخه‌ی مشاهده، خود داشبورد مدیریت را بازنویسی می‌کند؛ پس جلوی آن را می‌گیریم.
function ghSelf(cfg){
  const n=x=>('/'+x).replace(/\/+/g,'/').replace(/index\.html$/,'').replace(/\/$/,'').toLowerCase();
  const [ow,rp]=cfg.repo.split('/');
  return location.hostname.toLowerCase()===ow.toLowerCase()+'.github.io'&&n(location.pathname)===n('/'+rp+'/'+cfg.path);
}
async function ghPublish(cfg,html){
  const url='https://api.github.com/repos/'+cfg.repo+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/');
  const H={'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  let sha;const g=await fetch(url+'?ref='+encodeURIComponent(cfg.branch),{headers:H,cache:'no-store'});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('خواندن فایل ناموفق ('+g.status+'): '+(g.status===401?'توکن نامعتبر':g.status===403?'دسترسی توکن کافی نیست':'مخزن/شاخه را بررسی کنید'));
  const body={message:'update dashboard '+(D.iso||''),content:b64utf8(html),branch:cfg.branch};if(sha)body.sha=sha;
  const r=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
  const rj=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('انتشار ناموفق ('+r.status+'): '+(rj.message||''));
  return rj;
}
const pubGo=async e=>{
  if(!authed)return;
  try{
    let cfg=ghCfg();/* تنظیمات قدیمیِ «index.html» نامعتبر است و دوباره پرسیده می‌شود؛ دکمه‌ی ⚙ یا Shift هم تنظیمات را باز می‌کند */if(!cfg||e.shiftKey||e.currentTarget.id==='pubSet'||cfg.path==='index.html'){cfg=ghAsk(cfg);if(!cfg){umsg('انتشار لغو شد یا اطلاعات ناقص بود.');return}}
    if(ghSelf(cfg)){umsg('انتشار انجام نشد: مسیر «'+cfg.path+'» همان صفحه‌ی مدیریت است و آن را بازنویسی می‌کرد. با Shift+کلیک مسیر را «view/index.html» بگذارید.');return}
    const out=await buildSealed();if(!out)return;
    umsg('در حال ارسال به GitHub…');const res=await ghPublish(cfg,out);
    // آدرس Pages: https://OWNER.github.io/REPO/مسیر (index.html حذف می‌شود)؛ این‌جا نشان داده می‌شود تا کاربر مطمئن شود فایل کجا نوشته شده
    const [ow,rp]=cfg.repo.split('/');const pg='https://'+ow.toLowerCase()+'.github.io/'+rp+'/'+cfg.path.replace(/index\.html$/,'');
    umsg('منتشر شد ✓ در مخزن '+cfg.repo+' ، فایل «'+cfg.path+'» (شاخه '+cfg.branch+') ذخیره شد'+((res.commit&&res.commit.sha)?' [commit '+res.commit.sha.slice(0,7)+']':'')+'. بعد از حدود ۱ تا ۲ دقیقه این آدرس به‌روز می‌شود: '+pg);
  }catch(err){umsg('انتشار نشد: '+(err&&err.message?err.message:err))}
};
$('#pubBtn').addEventListener('click',pubGo);
// دکمه‌ی ⚙: تغییر تنظیمات انتشار بدون نیاز به Shift (برای موبایل)، و بلافاصله منتشر می‌کند
$('#pubSet').addEventListener('click',pubGo);
}

</script>
